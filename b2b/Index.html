<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Industrial Product Showcase</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 1. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- 2. Global Variable Shim (CRITICAL FIX for UMD libraries) -->
    <script>
        // Fix for libraries that expect React on window but don't find it immediately
        window.React = React;
        window.ReactDOM = ReactDOM;
    </script>

    <!-- 3. Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- 4. Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@0.460.0/dist/umd/lucide-react.min.js"></script>

    <!-- 5. Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 6. Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <style>
        /* Custom scrollbar hiding utility */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white text-neutral-900 font-sans antialiased selection:bg-neutral-900 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // -----------------------------
        // Imports & Global Setup
        // -----------------------------
        
        // Ensure globals are available
        const { useMemo, useState, useEffect, useRef } = React;
        
        // Safely access libraries
        const MotionLib = window.Motion;
        const LucideLib = window.lucideReact;

        if (!MotionLib) {
            console.error("Framer Motion library failed to load.");
        }
        if (!LucideLib) {
            console.error("Lucide React library failed to load.");
        }

        const { motion, AnimatePresence } = MotionLib || { motion: { div: 'div' }, AnimatePresence: ({children}) => children };
        
        // Destructure Icons
        const {
            Search, ShoppingCart, FileText, Box, Download, Shield, Globe,
            ChevronRight, ChevronDown, ExternalLink, Mail, Phone, MapPin,
            X, CheckCircle, Loader2, AlertCircle, User, Briefcase,
            Calendar, MessageSquare
        } = LucideLib || {};

        // Fallback Icon component if library fails
        const IconFallback = () => <span className="w-4 h-4 bg-gray-200 inline-block rounded"></span>;
        
        // Helper to safely render icon
        const SafeIcon = (IconComponent, props) => {
            if (IconComponent) return <IconComponent {...props} />;
            return <IconFallback />;
        };

        // -----------------------------
        // Mock Data
        // -----------------------------

        const PRODUCTS = [
            {

                },

                bigClass: "Industrial Robots",
                categoryPath: ["Robotics", "6-Axis Robots"],

                shortDesc: {

                },
                heroImage: "https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1200&q=80",

                    "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1581091870621-3c96fe2f8e2b?auto=format&fit=crop&w=1200&q=80",

                glbModelUrl: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",

                            { attr: "Axes", value: "6" },

                    {

                ],
                docs: [
                    {

                    },
                    {

                    },
                    {

                    },
                ],

                    { format: "STEP", fileName: "RobotX1.step", sizeMB: 18.2 },
                    { format: "IGES", fileName: "RobotX1.iges", sizeMB: 14.9 },
                    { format: "DWG", fileName: "RobotX1.dwg", sizeMB: 7.3 },
                ],
            },
            {
                id: "p-drive-servo-s5",
                name: {
                    en: "Servo Drive S5",
                    de: "Servoantrieb S5",
                    fr: "Variateur servo S5",
                },
                sku: "S5-SD-480",
                bigClass: "Electric Drives",
                categoryPath: ["Automation", "Servo Systems"],
                badges: ["Hot", "RoHS"],
                shortDesc: {
                    en: "High dynamic servo drive with compact footprint.",
                    de: "Hochdynamischer Servoantrieb mit kompakter Bauform.",
                    fr: "Variateur servo haute dynamique, format compact.",
                },
                heroImage: "https://images.unsplash.com/photo-1581091215367-59ab6b89b5e4?auto=format&fit=crop&w=1200&q=80",
                gallery: [
                    "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?auto=format&fit=crop&w=1200&q=80",
                ],
                glbModelUrl: "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb",
                keySpecs: [
                    { label: "Rated Voltage", value: "400" },
                    { label: "Rated Current", value: "12" },
                    { label: "Control", value: "EtherCAT" },
                ],
                techData: [
                    {
                        group: "Electrical",
                        items: [
                            { attr: "Rated Voltage", value: "400", unit: "VAC" },
                            { attr: "Rated Current", value: "12", unit: "A" },
                            { attr: "Peak Current", value: "24", unit: "A" },
                        ],
                    },
                    {

                            { attr: "Operating Temp", value: "0–45", unit: "°C" },
                        ],
                    },
                ],
                docs: [
                    {
                        id: "d4",
                        type: "datasheet",
                        title: {
                            en: "Datasheet — Servo Drive S5",
                            de: "Datenblatt — Servoantrieb S5",
                            fr: "Fiche technique — Variateur S5",
                        },
                        fileName: "Datasheet_ServoDriveS5.pdf",
                        sizeMB: 1.9,
                    },
                    {
                        id: "d5",
                        type: "whitepaper",
                        title: {
                            en: "White Paper — Low-Temperature Efficiency",
                            de: "Whitepaper — Effizienz bei niedrigen Temperaturen",
                            fr: "Livre blanc — Efficacité à basse température",
                        },
                        fileName: "WP_LowTemp_Efficiency.pdf",
                        sizeMB: 2.7,
                    },
                ],
                cad: [
                    { format: "STEP", fileName: "ServoDriveS5.step", sizeMB: 6.2 },
                    { format: "DWG", fileName: "ServoDriveS5.dwg", sizeMB: 2.4 },
                ],
            },
        ];

        const BIG_CLASSES = [
            {
                title: "Industrial Robots",
                groups: [
                    { title: "6-Axis Robots", tag: "Robotics" },
                    { title: "SCARA Robots", tag: "Robotics" },
                    { title: "Collaborative Robots", tag: "Robotics" },
                ],
            },
            {
                title: "Electric Drives",
                groups: [
                    { title: "Servo Systems", tag: "Automation" },
                    { title: "Motors", tag: "Automation" },
                    { title: "Inverters", tag: "Automation" },
                ],
            },
            {
                title: "Sensors & Vision",
                groups: [
                    { title: "Machine Vision", tag: "Sensing" },
                    { title: "Encoders", tag: "Sensing" },
                    { title: "Safety Sensors", tag: "Sensing" },
                ],
            },
        ];

        // -----------------------------
        // UI Helpers & Components
        // -----------------------------

        function cn(...classes) {
            return classes.filter(Boolean).join(" ");
        }

        function pill(text) {
            return (
                <span className="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-medium text-neutral-700">
                    {text}
                </span>
            );
        }

        function formatMB(n) {
            return `${n.toFixed(1)} MB`;
        }

        function DocIcon({ type }) {
            if (type === "datasheet") return SafeIcon(FileText, { className: "h-4 w-4" });
            if (type === "manual") return SafeIcon(Shield, { className: "h-4 w-4" });
            return SafeIcon(Globe, { className: "h-4 w-4" });
        }

        // --- 增强的通用输入组件 ---

        function FormInput({ label, error, icon, className, ...props }) {
            return (
                <div className={cn("space-y-1.5", className)}>
                    <label className="text-xs font-semibold text-neutral-700">{label}</label>
                    <div className="relative">
                        <input
                            className={cn(
                                "w-full rounded-2xl border bg-white py-2.5 text-sm outline-none transition-all placeholder:text-neutral-400",
                                icon ? "pl-10 pr-3" : "px-3",
                                error
                                    ? "border-red-500 focus:ring-2 focus:ring-red-100"
                                    : "border-neutral-200 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-100"
                            )}
                            {...props}
                        />
                        {icon && (
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400">
                                {icon}
                            </div>
                        )}
                    </div>
                    {error && (
                        <div className="flex items-center gap-1 text-xs text-red-500">
                            {SafeIcon(AlertCircle, { className: "h-3 w-3" })}
                            <span>{error}</span>
                        </div>
                    )}
                </div>
            );
        }

        function FormTextarea({ label, error, className, ...props }) {
            return (
                <div className={cn("space-y-1.5", className)}>
                    <label className="text-xs font-semibold text-neutral-700">{label}</label>
                    <textarea
                        className={cn(
                            "w-full min-h-[100px] rounded-2xl border bg-white px-3 py-2.5 text-sm outline-none transition-all placeholder:text-neutral-400",
                            error
                                ? "border-red-500 focus:ring-2 focus:ring-red-100"
                                : "border-neutral-200 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-100"
                        )}
                        {...props}
                    />
                    {error && (
                        <div className="flex items-center gap-1 text-xs text-red-500">
                            {SafeIcon(AlertCircle, { className: "h-3 w-3" })}
                            <span>{error}</span>
                        </div>
                    )}
                </div>
            );
        }

        // -----------------------------
        // Main App Component
        // -----------------------------

        function B2BIndustrialShowcase() {
            const [lang, setLang] = useState("en");
            const [route, setRoute] = useState({ name: "home" });
            const [megaOpen, setMegaOpen] = useState(false);
            const [searchOpen, setSearchOpen] = useState(false);
            const [query, setQuery] = useState("");
            const [selectedBigClass, setSelectedBigClass] = useState(undefined);

            const [cartOpen, setCartOpen] = useState(false);
            const [quoteCart, setQuoteCart] = useState([]);

            const [cookieConsent, setCookieConsent] = useState("unset");

            // Filtering Logic
            const products = useMemo(() => {
                let list = PRODUCTS;
                if (selectedBigClass) list = list.filter((p) => p.bigClass === selectedBigClass);
                const q = query.trim().toLowerCase();
                if (q) {
                    list = list.filter((p) => {
                        const hay = `${p.name[lang]} ${p.sku} ${p.shortDesc[lang]} ${p.bigClass} ${p.categoryPath.join(" ")}`.toLowerCase();
                        return hay.includes(q);
                    });
                }
                return list;
            }, [lang, query, selectedBigClass]);

            const currentProduct = useMemo(() => {
                if (route.name !== "product") return null;
                return PRODUCTS.find((p) => p.id === route.id) ?? null;
            }, [route]);

            const cartCount = quoteCart.reduce((sum, i) => sum + i.qty, 0);

            // Navigation Helpers
            function navToCatalog(opts) {
                setRoute({ name: "catalog", bigClass: opts?.bigClass, q: opts?.q });
                setSelectedBigClass(opts?.bigClass);
                setQuery(opts?.q ?? "");
                setMegaOpen(false);
                setSearchOpen(false);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            function navToProduct(id) {
                setRoute({ name: "product", id });
                setMegaOpen(false);
                setSearchOpen(false);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            function addToQuoteCart(productId, qty = 1) {
                setQuoteCart((prev) => {
                    const idx = prev.findIndex((x) => x.productId === productId);
                    if (idx >= 0) {
                        const next = [...prev];
                        next[idx] = { ...next[idx], qty: next[idx].qty + qty };
                        return next;
                    }
                    return [...prev, { productId, qty }];
                });
                setCartOpen(true);
            }

            function setQty(productId, qty) {
                setQuoteCart((prev) => {
                    const next = prev
                        .map((x) => (x.productId === productId ? { ...x, qty } : x))
                        .filter((x) => x.qty > 0);
                    return next;
                });
            }

            function resetDownloadWall() {
                setDownloadGate({ open: false, kind: "doc", payload: null });
            }

            const [downloadGate, setDownloadGate] = useState({ open: false, kind: "doc", payload: null });

            return (
                <div className="min-h-screen bg-white text-neutral-900 font-sans selection:bg-neutral-900 selection:text-white">
                    <Header
                        lang={lang}
                        setLang={setLang}
                        megaOpen={megaOpen}
                        setMegaOpen={setMegaOpen}
                        searchOpen={searchOpen}
                        setSearchOpen={setSearchOpen}
                        query={query}
                        setQuery={setQuery}
                        selectedBigClass={selectedBigClass}
                        setSelectedBigClass={setSelectedBigClass}
                        onGoHome={() => setRoute({ name: "home" })}
                        onGoCatalog={() => navToCatalog({ bigClass: selectedBigClass, q: query })}
                        onGoCatalogWith={(bigClass) => navToCatalog({ bigClass })}
                        onGoContact={() => setRoute({ name: "contact" })}
                        cartCount={cartCount}
                        onOpenCart={() => setCartOpen(true)}
                    />

                    <main className="min-h-[calc(100vh-300px)]">
                        <AnimatePresence mode="wait">
                            {route.name === "home" && (
                                <motion.div
                                    key="home"
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <HomeHero
                                        onBrowse={() => navToCatalog({})}
                                        onPickBigClass={(c) => navToCatalog({ bigClass: c })}
                                    />
                                    <HomeHighlights
                                        onPick={(id) => navToProduct(id)}
                                        onBrowse={() => navToCatalog({})}
                                    />
                                    <TrustAndCompliance
                                        onImpressum={() => setRoute({ name: "impressum" })}
                                        onPrivacy={() => setRoute({ name: "privacy" })}
                                    />
                                </motion.div>
                            )}

                            {route.name === "catalog" && (
                                <motion.div
                                    key="catalog"
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <Catalog
                                        lang={lang}
                                        products={products}
                                        selectedBigClass={selectedBigClass}
                                        onSelectBigClass={(c) => setSelectedBigClass(c)}
                                        onClearBigClass={() => setSelectedBigClass(undefined)}
                                        query={query}
                                        onOpenProduct={navToProduct}
                                    />
                                </motion.div>
                            )}

                            {route.name === "product" && currentProduct && (
                                <motion.div
                                    key={currentProduct.id}
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <ProductDetail
                                        lang={lang}
                                        product={currentProduct}
                                        onBack={() => navToCatalog({ bigClass: currentProduct.bigClass })}
                                        onOpenProduct={navToProduct}
                                        onAddToQuote={() => addToQuoteCart(currentProduct.id, 1)}
                                        onDownloadDoc={(doc) => setDownloadGate({ open: true, kind: "doc", payload: doc })}
                                        onDownloadCAD={(format) =>
                                            setDownloadGate({ open: true, kind: "cad", payload: { product: currentProduct, format } })
                                        }
                                    />
                                </motion.div>
                            )}

                            {route.name === "contact" && (
                                <motion.div
                                    key="contact"
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <ContactPage onBack={() => setRoute({ name: "home" })} />
                                </motion.div>
                            )}

                            {route.name === "impressum" && (
                                <motion.div
                                    key="impressum"
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <LegalPage
                                        title="Impressum"
                                        subtitle="Legal disclosure (DACH / EU best practice)"
                                        onBack={() => setRoute({ name: "home" })}
                                    >
                                        <div className="space-y-3 text-sm leading-6 text-neutral-700">
                                            <p><strong>Company:</strong> Example Industrial GmbH</p>
                                            <p><strong>Address:</strong> Musterstraße 1, 60311 Frankfurt, Germany</p>
                                            <p><strong>Register:</strong> HRB 123456</p>
                                            <p className="text-neutral-500 italic">This is a static template.</p>
                                        </div>
                                    </LegalPage>
                                </motion.div>
                            )}

                            {route.name === "privacy" && (
                                <motion.div
                                    key="privacy"
                                    initial={{ opacity: 0, y: 8 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -8 }}
                                    transition={{ duration: 0.25 }}
                                >
                                    <LegalPage
                                        title="Privacy Policy"
                                        subtitle="GDPR-oriented baseline"
                                        onBack={() => setRoute({ name: "home" })}
                                    >
                                        <div className="space-y-3 text-sm leading-6 text-neutral-700">
                                            <p>We value your privacy. Data is processed only for business purposes.</p>
                                            <p className="text-neutral-500 italic">This is a static template.</p>
                                        </div>
                                    </LegalPage>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>

                    <Footer
                        onImpressum={() => setRoute({ name: "impressum" })}
                        onPrivacy={() => setRoute({ name: "privacy" })}
                        onCatalog={() => navToCatalog({})}
                        onContact={() => setRoute({ name: "contact" })}
                    />

                    <Drawer open={cartOpen} onClose={() => setCartOpen(false)}>
                        <QuoteCart
                            items={quoteCart}
                            onSetQty={setQty}
                            onClose={() => setCartOpen(false)}
                        />
                    </Drawer>

                    <Modal open={downloadGate.open} onClose={resetDownloadWall} title="Download Request">
                        <DownloadWall
                            kind={downloadGate.open ? downloadGate.kind : "doc"}
                            payload={downloadGate.open ? downloadGate.payload : null}
                            onClose={resetDownloadWall}
                        />
                    </Modal>

                    <CookieBanner
                        state={cookieConsent}
                        onAccept={() => setCookieConsent("accepted")}
                        onReject={() => setCookieConsent("rejected")}
                        onPrivacy={() => setRoute({ name: "privacy" })}
                    />
                </div>
            );
        }

        // -----------------------------
        // Header
        // -----------------------------

        function Header(props) {
            const {
                lang,
                setLang,
                megaOpen,
                setMegaOpen,
                searchOpen,
                setSearchOpen,
                query,
                setQuery,
                selectedBigClass,
                setSelectedBigClass,
                onGoHome,
                onGoCatalog,
                onGoCatalogWith,
                onGoContact,
                cartCount,
                onOpenCart,
            } = props;

            return (
                <div className="sticky top-0 z-40 border-b bg-white/85 backdrop-blur-md">
                    <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
                        <button
                            className="flex items-center gap-2 group"
                            onClick={onGoHome}
                            aria-label="Home"
                        >
                            <div className="grid h-9 w-9 place-items-center rounded-2xl bg-neutral-900 text-white transition-transform group-hover:scale-105">
                                {SafeIcon(Box, { className: "h-5 w-5" })}
                            </div>
                            <div className="text-left hidden sm:block">
                                <div className="text-sm font-semibold leading-4">Industrial Catalog</div>
                                <div className="text-xs text-neutral-500">Showcase / SSOT-ready</div>
                            </div>
                        </button>

                        <div className="hidden items-center gap-2 md:flex">
                            <div className="relative">
                                <button
                                    className={cn(
                                        "inline-flex items-center gap-2 rounded-2xl border px-3 py-2 text-sm transition-colors",
                                        megaOpen ? "bg-neutral-100 border-neutral-300" : "hover:bg-neutral-50"
                                    )}
                                    onClick={() => setMegaOpen(!megaOpen)}
                                >
                                    Products
                                    {SafeIcon(ChevronDown, { className: "h-4 w-4" })}
                                </button>

                                <AnimatePresence>
                                    {megaOpen && (
                                        <motion.div
                                            initial={{ opacity: 0, y: 8 }}
                                            animate={{ opacity: 1, y: 0 }}

                name: "",
                email: "",
                subject: "",

            const [errors, setErrors] = useState({});

            const validate = () => {
                const newErrors = {};

                        <div className="flex gap-4">
                            <div className="h-10 w-10 shrink-0 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                                {SafeIcon(Shield, { className: "h-5 w-5" })}
                            </div>
                            <div>
                                <div className="text-sm font-bold text-neutral-900">Privacy Settings</div>
                                <div className="text-sm text-neutral-600 max-w-lg mt-1">
                                    We use cookies to enhance your experience and analyze catalog usage.
                                    <button className="ml-1 font-medium text-neutral-900 underline" onClick={onPrivacy}>
                                        Read Policy
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-2 pl-14 md:pl-0">
                            <button className="rounded-xl border border-neutral-200 px-5 py-2.5 text-sm font-bold text-neutral-700 hover:bg-neutral-50" onClick={onReject}>
                                Necessary Only
                            </button>
                            <button className="rounded-xl bg-neutral-900 px-5 py-2.5 text-sm font-bold text-white shadow-lg hover:bg-neutral-800" onClick={onAccept}>
                                Accept All
                            </button>
                        </div>
                    </div>
                </motion.div>
            );
        }

        function LegalPage({ title, subtitle, onBack, children }) {
            return (
                <div className="mx-auto max-w-3xl px-4 py-12">
                    <button className="group mb-8 flex items-center gap-1 rounded-full border px-4 py-1.5 text-sm font-medium text-neutral-600 hover:bg-neutral-50 hover:text-neutral-900" onClick={onBack}>
                        {SafeIcon(ChevronRight, { className: "h-4 w-4 rotate-180 transition-transform group-hover:-translate-x-1" })}
                        Back to Home
                    </button>
                    <h1 className="text-4xl font-bold tracking-tight text-neutral-900">{title}</h1>
                    <div className="mt-2 text-lg text-neutral-500">{subtitle}</div>
                    <div className="mt-8 rounded-3xl border bg-white p-8 shadow-sm">{children}</div>
                </div>
            );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<B2BIndustrialShowcase />);
    </script>
</body>
</html>
