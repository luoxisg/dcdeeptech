# docker-compose.yml — Local development stack for the DCDeepTech gateway.
# Usage: docker-compose up --build
#
# Copy .env.example to .env and fill real values before running.

version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: dcdeeptech-gateway:local
    container_name: dcdeeptech-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host inside container
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
