# config/cloud_config.example.yaml
# 重庆 AIDC 云端节点配置模板

# ─── 服务器绑定 ──────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8443
  workers: 8

# ─── TLS 1.3 + 国密套件（RFC 8998）────────────────────────────
tls:
  version: "1.3"
  cipher_suites:
    - "TLS_SM4_GCM_SM3"     # 首选：国密 GCM 模式
    - "TLS_SM4_CCM_SM3"     # 备选
  server_cert: "/opt/security/certs/aidc_cert.pem"
  server_key:  "/opt/security/keys/aidc_private.pem"
  ca_bundle:   "/opt/security/certs/ca-bundle-tlcp.crt"
  require_client_cert: false  # mTLS（生产环境建议开启）

# ─── SM2 密钥管理 ────────────────────────────────────────────────
crypto:
  sm2_private_key_path: "/opt/security/keys/aidc_private.pem"
  sm2_public_key_path:  "/opt/security/keys/aidc_public.pem"
  key_rotation_days: 365

# ─── VLM 推理引擎 ────────────────────────────────────────────────
vlm_engine:
  model_path: "/mnt/models/vlm-72b-instruct"
  tensor_parallel_size: 8        # H20/A100 GPU 数量
  gpu_memory_utilization: 0.92
  max_model_len: 32768
  max_new_tokens: 1024

# ─── OIDC 身份验证 ───────────────────────────────────────────────
auth:
  oidc_issuer:   "https://auth.sg-cq-api.example.com"
  oidc_audience: "cq-aidc-vlm-api"
  jwks_uri:      "https://auth.sg-cq-api.example.com/.well-known/jwks.json"

# ─── FinOps 计费配置 ─────────────────────────────────────────────
billing:
  price_visual_input_per_mtok:  6.0    # 元/百万 Token
  price_text_input_per_mtok:    4.0
  price_text_output_per_mtok:   16.0
  default_monthly_quota_tokens: 10000000  # 1000 万 Token/月

# ─── 日志配置 ────────────────────────────────────────────────────
logging:
  level: "INFO"
  format: "json"   # json（结构化日志，便于 ELK 接入）| text
