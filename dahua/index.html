 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PSA Innovation: Green Intelligent Edge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        /* 基础与滚动条设定 */
        body { margin: 0; overflow-x: hidden; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        
        /* 动态背景 */
        .bg-orbs {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: -1; pointer-events: none;
            background: linear-gradient(to bottom right, #f8fafc, #e2e8f0);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: float 20s infinite ease-in-out alternate; }
        .orb-1 { width: 40vw; height: 40vw; background: rgba(14, 165, 233, 0.12); top: -10%; left: -10%; }
        .orb-2 { width: 50vw; height: 50vw; background: rgba(16, 185, 129, 0.08); bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 15%) scale(1.1); } }

        /* 动画类 */
        .animate-fade-up { opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }

        /* 玻璃拟物卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6); transition: all 0.3s ease; cursor: pointer;
        }
        .glass-card:active { transform: scale(0.98); }
        @media (min-width: 768px) { .glass-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.15); border-color: rgba(14, 165, 233, 0.3); } }

        /* 全屏模态过渡动画 */
        .modal-enter { transform: translateY(100%); opacity: 0; }
        .modal-active { transform: translateY(0); opacity: 1; }

        /* 图表容器 */
        .chart-container { position: relative; width: 100%; margin: 0 auto; height: 280px; }
        @media (min-width: 768px) { .chart-container { height: 380px; } }

        /* 底部导航栏移动端适配 */
        .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased selection:bg-sky-200 selection:text-sky-900">

    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <!-- 主体内容区：移动端底部留出空间给Tab栏 -->
    <div id="app" class="min-h-screen flex flex-col max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 pb-28 md:pb-10 relative z-10">
        
        <!-- Header -->
        <header class="mb-6 md:mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 animate-fade-up">
            <div>
                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight" id="header-title">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-600 to-emerald-500" id="title-hl">Smart Port</span> Synergy
                </h1>
                <p class="mt-2 text-sm md:text-base text-slate-500 font-medium" id="header-subtitle"></p>
            </div>
            <!-- Lang Toggle -->
            <div class="flex items-center bg-white rounded-full p-1 shadow-sm border border-slate-200">
                <button onclick="toggleLang('en')" id="btn-lang-en" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 text-white">EN</button>
                <button onclick="toggleLang('zh')" id="btn-lang-zh" class="px-4 py-1.5 rounded-full text-sm font-bold transition-all text-slate-500">中文</button>
            </div>
        </header>

        <!-- 动态布局：PC端顶部Nav，移动端折叠为底部Drawer/Tab Bar -->
        <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-slate-200 z-40 flex justify-around items-center px-2 py-3 bottom-nav-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)] md:relative md:bg-transparent md:border-none md:shadow-none md:flex-wrap md:justify-start md:p-0 md:mb-8 md:gap-3 transition-all" id="nav-container">
            <!-- JS 注入标签 -->
        </nav>

        <!-- 移动端：底部搜索/行动栏 (悬浮在Tab上方) -->
        <div class="fixed bottom-[80px] left-4 right-4 z-30 md:hidden flex justify-center animate-fade-up delay-200">
            <button onclick="openModal('search')" class="w-full max-w-sm bg-slate-900 text-white rounded-full px-6 py-3 shadow-xl flex items-center justify-between font-medium active:scale-95 transition-transform">
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span id="mobile-search-text">Search Integration...</span>
                </span>
                <span class="bg-slate-700 text-xs px-2 py-1 rounded">⌘K</span>
            </button>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow w-full"></main>
    </div>

    <!-- 炫技：全屏沉浸式模态窗口 (Full-Screen Modal) -->
    <div id="fs-modal" class="fixed inset-0 z-50 bg-slate-50/95 backdrop-blur-2xl flex-col transition-all duration-400 modal-enter hidden">
        <div class="flex justify-between items-center p-5 md:p-8 border-b border-slate-200 bg-white/50 pt-safe">
            <h2 id="modal-title" class="text-xl md:text-3xl font-extrabold text-slate-900 bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600">Details</h2>
            <button onclick="closeModal()" class="w-10 h-10 bg-slate-200/50 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="modal-body" class="p-6 md:p-10 overflow-y-auto flex-grow text-slate-700 pb-24">
            <!-- Modal Content Injected Here -->
        </div>
    </div>

    <script>
        // === State Management ===
        const state = { lang: 'en', currentTab: 'context', sim: { ai: true, cooling: false } };

        // === Content & Dictionary ===
        const i18n = {
            header: {
                hl: { en: "Smart Port", zh: "大士港" },
                title: { en: " Synergy", zh: " 边缘计算联合方案" },
                sub: { en: "Joint Value Proposition: Dahua, dcdeeptech & axiomdeta for PSA.", zh: "联合生态价值：大华股份 x dcdeeptech x axiomdeta" },
                search: { en: "Search ecosystem & docs...", zh: "检索生态与落地方案..." }
            },
            tabs: [
                { id: 'context', icon: '🎯', en: 'Context', zh: '现状痛点' },
                { id: 'capabilities', icon: '🧩', en: 'Ecosystem', zh: '硬件生态' },
                { id: 'solution', icon: '⚙️', en: 'Simulator', zh: '联合沙盘' },
                { id: 'roadmap', icon: '🚀', en: 'Go-to-Market', zh: '商业落地' }
            ],
            context: {
                title: { en: "The Automation Frontier: Tuas Port", zh: "自动化前沿：新加坡大士港" },
                radarTitle: { en: "Current IT vs. Tuas Demands", zh: "当前IT能力 vs 大士港需求" },
                radarLabels: { en: ['Low Latency', 'Thermal Mgmt', 'Energy Efficiency', 'AI Scale', 'Durability'], zh: ['极低延迟', '热能管理', '能源效率', 'AI算力扩展', '环境耐久度'] },
                pains: [
                    { id: 'p1', icon: "🌡️", t: {en: "Thermal Throttling", zh: "高温降频难题"}, d: {en: "Click for details on edge GPU failures in tropical heat.", zh: "点击查看热带高温导致边缘AI服务器宕机的详细数据。"},
                      detail: { en: "In Singapore's 32°C+ ambient temperature with >80% humidity, standard passive cooling for edge AI units (like NVIDIA Jetson or discrete GPUs) fails. Hardware throttles performance by up to 60% to prevent melting, causing critical delays in AGV navigation.", zh: "在新加坡常年32度以上、湿度超80%的环境中，标准边缘AI设备的被动散热失效。为防止烧毁，硬件会自动降频达60%，这直接导致无人集卡(AGV)的导航视觉识别出现致命延迟。"} },
                    { id: 'p2', icon: "⚡", t: {en: "Power Density Limit", zh: "算力与电网博弈"}, d: {en: "Processing 4K OCR spikes local grid limits.", zh: "点击查看4K视觉解析对港口局部电网的冲击。"},
                      detail: { en: "Thousands of cameras running OCR and safety algorithms require dense GPU power. Distributing this power to remote crane pillars without massive infrastructure upgrades is a primary bottleneck.", zh: "成千上万个摄像头运行OCR和安全算法需要密集的GPU算力。如何在不进行大规模基建翻新的情况下，将大量电力输送到偏远的岸桥机柱上，是核心瓶颈。"} }
                ]
            },
            capabilities: {
                title: { en: "The Hardware Trinity Ecosystem", zh: "三位一体的硬件生态" },
                intro: { en: "Combining Vision AI, Deep Tech thermal management, and robust physical delivery.", zh: "融合顶尖视觉AI、深科技热管理算法与坚固的物理底座交付。" },
                cards: [
                    { id: 'c1', color: 'sky', icon: '👁️', name: "Dahua Technology", role: { en: "The Brain: Industrial Vision AI", zh: "视觉大脑：工业AI核心" }, 
                      features: { en: ["Pro AI Camera Sensors", "Port-specific OCR algorithms"], zh: ["专业级边缘AI传感器", "港口专属OCR与行为算法"] },
                      modalDesc: { en: "Dahua provides the primary intelligence, processing video streams directly at the edge to track containers, AGVs, and personnel safety.", zh: "大华股份提供核心智能引擎，在边缘侧直接处理视频流，实现集装箱追踪、AGV导航辅助与人员安全监控。" } },
                    { id: 'c2', color: 'indigo', icon: '🔬', name: "dcdeeptech", role: { en: "The Habitat: Cooling OS", zh: "微气候OS：核心温控" }, 
                      features: { en: ["Joint R&D with IMDA & NUS", "Dynamic Thermal Algorithms"], zh: ["联合 IMDA 与 NUS 深度研发", "动态热能管理专有算法"] },
                      modalDesc: { en: "Backed by NUS research and IMDA grants, dcdeeptech provides the software and fluid-dynamic logic to keep high-density chips cool in the tropics.", zh: "在新加坡国立大学(NUS)的科研支持与IMDA的资助下，dcdeeptech 提供软硬结合的流体力学逻辑与液冷/风冷控制系统，确保高密度芯片在热带完美运行。" } },
                    { id: 'c3', color: 'emerald', icon: '🏗️', name: "axiomdeta", role: { en: "The Foundation: Physical Delivery", zh: "物理底座：热带基建交付" }, 
                      features: { en: ["Tropical Base Design", "Turnkey Hardware Integration"], zh: ["热带物理底座设计", "硬件交钥匙集成交付"] },
                      modalDesc: { en: "Axiomdeta translates the deep tech into rugged, deployable physical chassis. They ensure the hardware can withstand salt spray, vibrations, and port logistics.", zh: "axiomdeta 负责将深科技转化为坚固、可规模化部署的物理机箱。他们确保这些硬件设备能够抵御高盐雾、强震动以及复杂的港口物流装卸环境。" } }
                ]
            },
            solution: {
                title: { en: "The 'Green Edge' Simulator", zh: "“绿色边缘”交互沙盘" },
                toggles: {
                    ai: { en: "Enable Dahua AI", zh: "启动 大华边缘AI" },
                    cool: { en: "Enable dcdeeptech & axiomdeta", zh: "启动 联合物理温控舱" }
                }
            },
            roadmap: {
                title: { en: "Commercial & Integration Strategy", zh: "商业闭环与被集成生态" },
                biz: [
                    { icon: '🤝', title: { en: "System Integration (Integrated-By)", zh: "被集成战略 (Integrated-By)" }, desc: { en: "The solution is packaged as a standard module, specifically designed to be integrated by top-tier systems integrators like ST Engineering (STE), NCS, and Siemens.", zh: "整体方案作为标准化黑盒模块，专为STE(新科工程)、NCS(恩士迅)与西门子等顶级系统集成商设计，提供即插即用的被集成能力。" } },
                    { icon: '🏢', title: { en: "Dahua Channel as Main Body", zh: "大华渠道为主体的商业闭环" }, desc: { en: "Project declarations, logistics, capital flows, and technical service flows are primarily channeled through Dahua's established regional network.", zh: "项目的落地申报、硬件物流配送、资金流转以及售后技术服务流，将以大华现有的成熟海外渠道网络作为运作主体。" } },
                    { icon: '📜', title: { en: "Government Grants (MPA/ESG)", zh: "政府资金杠杆" }, desc: { en: "Leveraging joint R&D status to apply for MPA MINT fund and ESG Enterprise Development Grants.", zh: "依托IMDA/NUS的联合研发背景，合力撬动海事局(MPA MINT)及企业发展局(ESG)的创新专项资金支持。" } }
                ]
            }
        };

        const t = (path) => {
            return path.split('.').reduce((obj, key) => obj && obj[key], i18n)[state.lang];
        };

        // === Logic ===
        function toggleLang(lang) {
            state.lang = lang;
            document.getElementById('btn-lang-en').className = lang === 'en' ? "px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 text-white" : "px-4 py-1.5 rounded-full text-sm font-bold transition-all text-slate-500";
            document.getElementById('btn-lang-zh').className = lang === 'zh' ? "px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-slate-800 text-white" : "px-4 py-1.5 rounded-full text-sm font-bold transition-all text-slate-500";
            
            document.getElementById('title-hl').innerText = i18n.header.hl[lang];
            document.getElementById('header-title').lastChild.textContent = i18n.header.title[lang];
            document.getElementById('header-subtitle').innerText = i18n.header.sub[lang];
            document.getElementById('mobile-search-text').innerText = i18n.header.search[lang];

            renderNav();
            switchTab(state.currentTab, false);
        }

        function renderNav() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = i18n.tabs.map(tab => `
                <button onclick="switchTab('${tab.id}', true)" class="flex flex-col md:flex-row items-center md:px-5 md:py-2.5 rounded-xl md:rounded-full transition-all duration-300 ${
                    state.currentTab === tab.id 
                    ? 'text-sky-600 md:bg-gradient-to-r md:from-sky-500 md:to-sky-600 md:text-white md:shadow-lg md:shadow-sky-500/30 scale-105' 
                    : 'text-slate-400 md:bg-white md:text-slate-500 hover:text-slate-800 md:border md:border-slate-200'
                }">
                    <span class="text-xl md:text-base md:mr-2 mb-1 md:mb-0">${tab.icon}</span>
                    <span class="text-[10px] md:text-sm font-bold tracking-wide">${tab[state.lang]}</span>
                    ${state.currentTab === tab.id ? '<div class="w-1 h-1 bg-sky-500 rounded-full mt-1 md:hidden"></div>' : '<div class="w-1 h-1 mt-1 md:hidden"></div>'}
                </button>
            `).join('');
        }

        function openModal(type, dataId = null) {
            const modal = document.getElementById('fs-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth; 
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-active');

            if (type === 'search') {
                title.innerText = state.lang === 'en' ? 'Global Search' : '全局检索';
                body.innerHTML = `
                    <div class="relative w-full max-w-2xl mx-auto">
                        <input type="text" placeholder="${i18n.header.search[state.lang]}" class="w-full text-xl md:text-3xl p-4 border-b-2 border-slate-300 bg-transparent focus:outline-none focus:border-sky-500 transition-colors placeholder-slate-300">
                        <div class="mt-8 text-slate-400 text-sm">
                            <p class="font-bold mb-4 uppercase tracking-wider">${state.lang === 'en' ? 'Suggested Queries' : '推荐搜索'}</p>
                            <div class="flex flex-wrap gap-2">
                                <span class="px-4 py-2 bg-slate-100 rounded-full cursor-pointer hover:bg-sky-100 hover:text-sky-600">IMDA Grants</span>
                                <span class="px-4 py-2 bg-slate-100 rounded-full cursor-pointer hover:bg-sky-100 hover:text-sky-600">ST Engineering Integration</span>
                                <span class="px-4 py-2 bg-slate-100 rounded-full cursor-pointer hover:bg-sky-100 hover:text-sky-600">OCR Latency</span>
                            </div>
                        </div>
                    </div>`;
            } else if (type === 'pain') {
                const pain = i18n.context.pains.find(p => p.id === dataId);
                title.innerText = pain.t[state.lang];
                body.innerHTML = `
                    <div class="max-w-3xl mx-auto text-lg md:text-2xl leading-relaxed text-slate-700 font-medium">
                        <div class="text-6xl mb-8">${pain.icon}</div>
                        ${pain.detail[state.lang]}
                    </div>`;
            } else if (type === 'card') {
                const card = i18n.capabilities.cards.find(c => c.id === dataId);
                title.innerText = card.name;
                body.innerHTML = `
                    <div class="max-w-3xl mx-auto">
                        <div class="inline-flex items-center px-4 py-2 bg-${card.color}-100 text-${card.color}-700 rounded-full font-bold text-sm mb-6">
                            ${card.role[state.lang]}
                        </div>
                        <p class="text-xl md:text-2xl leading-relaxed text-slate-700 font-medium mb-8">
                            ${card.modalDesc[state.lang]}
                        </p>
                        <h4 class="font-bold text-slate-900 mb-4">${state.lang==='en'?'Core Capabilities':'核心能力'}</h4>
                        <ul class="space-y-3">
                            ${card.features[state.lang].map(f => `
                                <li class="flex items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <span class="text-${card.color}-500 mr-3 text-xl">✓</span> ${f}
                                </li>`).join('')}
                        </ul>
                    </div>`;
            }
        }

        function closeModal() {
            const modal = document.getElementById('fs-modal');
            modal.classList.remove('modal-active');
            modal.classList.add('modal-enter');
            setTimeout(() => { modal.classList.add('hidden'); }, 400);
        }

        let chartInstance = null;

        function switchTab(tabId, animate = true) {
            state.currentTab = tabId;
            renderNav();
            const main = document.getElementById('main-content');
            const animClass = animate ? 'animate-fade-up' : '';
            let html = '';

            if (tabId === 'context') {
                html = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8 ${animClass}">
                        <div class="glass-card p-4 md:p-6 rounded-3xl flex flex-col items-center">
                            <h3 class="text-lg font-bold text-slate-800 mb-2">${t('context.radarTitle')}</h3>
                            <div class="chart-container w-full"><canvas id="radarChart"></canvas></div>
                        </div>
                        <div class="space-y-4 md:space-y-6">
                            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 px-2">${t('context.title')}</h2>
                            ${i18n.context.pains.map((p) => `
                                <div onclick="openModal('pain', '${p.id}')" class="glass-card p-5 md:p-6 rounded-2xl flex items-start group">
                                    <div class="text-3xl mr-4 group-hover:scale-110 transition-transform">${p.icon}</div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-lg group-hover:text-sky-600 transition-colors">${p.t[state.lang]}</h4>
                                        <p class="text-sm text-slate-500 mt-1">${p.d[state.lang]}</p>
                                    </div>
                                    <div class="ml-auto text-slate-300 group-hover:text-sky-500 mt-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                main.innerHTML = html;
                setTimeout(initRadarChart, 50);
            } 
            else if (tabId === 'capabilities') {
                html = `
                    <div class="${animClass}">
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">${t('capabilities.title')}</h2>
                        <p class="text-slate-600 mb-8">${t('capabilities.intro')}</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${i18n.capabilities.cards.map(c => `
                                <div onclick="openModal('card', '${c.id}')" class="glass-card p-6 md:p-8 rounded-3xl border-t-4 border-t-${c.color}-500 group">
                                    <div class="w-14 h-14 rounded-2xl bg-${c.color}-100 flex items-center justify-center text-3xl mb-6 group-hover:rotate-6 transition-transform shadow-inner text-${c.color}-600">
                                        ${c.icon}
                                    </div>
                                    <h3 class="text-xl font-bold text-slate-900 mb-1">${c.name}</h3>
                                    <p class="text-${c.color}-600 font-semibold text-sm mb-4">${c.role[state.lang]}</p>
                                    <div class="flex items-center text-sm text-slate-400 group-hover:text-${c.color}-500 font-medium">
                                        ${state.lang==='en'?'View Details':'查看核心技术'} 
                                        <svg class="w-4 h-4 ml-1 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                main.innerHTML = html;
            }
            else if (tabId === 'solution') {
                const s = state.sim;
                html = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 ${animClass}">
                        <div class="space-y-6">
                            <h2 class="text-2xl md:text-3xl font-bold text-slate-800">${t('solution.title')}</h2>
                            
                            <!-- Toggles -->
                            <div class="glass-card p-6 rounded-3xl space-y-4">
                                <div class="flex items-center justify-between cursor-pointer group" onclick="toggleSim('ai')">
                                    <span class="font-bold text-slate-700 group-hover:text-sky-600">${t('solution.toggles.ai')}</span>
                                    <div class="w-12 h-6 rounded-full transition-colors relative ${s.ai ? 'bg-sky-500' : 'bg-slate-300'}">
                                        <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform ${s.ai ? 'translate-x-6' : ''}"></div>
                                    </div>
                                </div>
                                <div class="w-full h-px bg-slate-100"></div>
                                <div class="flex items-center justify-between cursor-pointer group" onclick="toggleSim('cooling')">
                                    <span class="font-bold text-slate-700 group-hover:text-emerald-600">${t('solution.toggles.cool')}</span>
                                    <div class="w-12 h-6 rounded-full transition-colors relative ${s.cooling ? 'bg-emerald-500' : 'bg-slate-300'}">
                                        <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform ${s.cooling ? 'translate-x-6' : ''}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 动态图表 -->
                        <div class="glass-card p-6 rounded-3xl flex flex-col justify-center">
                            <div class="chart-container"><canvas id="barChart"></canvas></div>
                        </div>
                    </div>`;
                main.innerHTML = html;
                setTimeout(initBarChart, 50);
            }
            else if (tabId === 'roadmap') {
                html = `
                    <div class="${animClass}">
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-8">${t('roadmap.title')}</h2>
                        <div class="space-y-6">
                            ${i18n.roadmap.biz.map((b, i) => `
                                <div class="glass-card p-6 md:p-8 rounded-3xl flex flex-col md:flex-row gap-4 md:items-center relative overflow-hidden group">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-slate-100 rounded-bl-full -z-10 group-hover:bg-sky-50 transition-colors"></div>
                                    <div class="text-4xl md:text-5xl md:mr-6 p-4 bg-white rounded-2xl shadow-sm border border-slate-100">${b.icon}</div>
                                    <div>
                                        <h3 class="text-xl font-bold text-slate-900 mb-2">${b.title[state.lang]}</h3>
                                        <p class="text-slate-600 leading-relaxed">${b.desc[state.lang]}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                main.innerHTML = html;
            }
        }

        function toggleSim(type) { state.sim[type] = !state.sim[type]; switchTab('solution', false); }

        function initRadarChart() {
            const ctx = document.getElementById('radarChart');
            if(!ctx) return;
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: i18n.context.radarLabels[state.lang],
                    datasets: [
                        { label: state.lang==='en'?'Standard IT':'标准IT设备', data: [50, 40, 40, 60, 30], borderColor: '#94a3b8', backgroundColor: 'rgba(148,163,184,0.2)' },
                        { label: state.lang==='en'?'Tuas Target':'港口指标', data: [95, 90, 95, 90, 90], borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,0.2)' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100, ticks:{display:false} } }, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function initBarChart() {
            const ctx = document.getElementById('barChart');
            if(!ctx) return;
            if(chartInstance) chartInstance.destroy();
            const s = state.sim;
            let pwr = 50, aiCap = 20, life = 40;
            if(s.ai && !s.cooling) { pwr = 95; aiCap = 60; life = 20; }
            if(s.ai && s.cooling) { pwr = 60; aiCap = 100; life = 95; }
            if(!s.ai && s.cooling) { pwr = 30; aiCap = 20; life = 95; }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: state.lang==='en' ? ['Power Draw', 'AI Compute', 'Hardware Life'] : ['能耗负载', 'AI有效算力', '硬件寿命'],
                    datasets: [{ label: state.lang==='en'?'Status Index':'状态指数', data: [pwr, aiCap, life], backgroundColor: ['#f59e0b', '#0ea5e9', '#10b981'], borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
            });
        }

        // Init App
        document.addEventListener('DOMContentLoaded', () => { toggleLang(state.lang); });
        window.addEventListener('resize', () => { if(chartInstance) chartInstance.resize(); });
    </script>
</body>
</html>
