    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Gemini API 集成 ---
        const apiKey = ""; // API Key injected by environment
        const chatHistory = document.getElementById('chat-history');
        const btnAnalyze = document.getElementById('btn-analyze');
        const aiTerminal = document.getElementById('ai-terminal');
        const btnAi = document.getElementById('btn-ai');
        const closeTerminal = document.getElementById('close-terminal');

        // Toggle Terminal
        btnAi.addEventListener('click', () => aiTerminal.classList.add('open'));
        closeTerminal.addEventListener('click', () => aiTerminal.classList.remove('open'));

        function appendMessage(role, text, isHtml = false) {
            const div = document.createElement('div');
            div.className = role === 'user' 
                ? "bg-purple-50 border border-purple-100 p-2 rounded text-slate-700 ml-4"
                : "bg-white border border-slate-200 p-2 rounded text-slate-700 mr-4 shadow-sm prose prose-sm max-w-none";
            
            if (isHtml) {
                div.innerHTML = text;
            } else {
                div.textContent = text;
            }
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function analyzeTelemetry() {
            const inlet = document.getElementById('val-inlet').innerText;
            const outlet = document.getElementById('val-outlet').innerText;
            
            appendMessage('user', `Analyze Status: Inlet ${inlet}, Outlet ${outlet}`);
            btnAnalyze.disabled = true;
            btnAnalyze.innerHTML = `<svg class="animate-spin h-3 w-3 mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> PROCESSING...`;

            try {
                // Check if API Key exists
                if (!apiKey) {
                    throw new Error("API Key is missing or invalid.");
                }

                const prompt = `
                    Act as a Data Center Operations Engineer. Analyze this telemetry from a Marine Edge Container:
                    - Inlet Temperature: ${inlet}
                    - Outlet Temperature: ${outlet}
                    - Status: Active Cooling
                    
                    Provide a concise technical assessment in Chinese. 
                    1. Calculate Delta T.
                    2. Evaluate if it's within optimal range (Target Delta T is 10-15°C).
                    3. Suggest 1 actionable maintenance or optimization tip.
                    Keep it brief and professional. Use bullet points.
                `;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No analysis generated.";
                
                // Use marked to parse markdown
                appendMessage('ai', marked.parse(aiText), true);

            } catch (error) {
                console.error("AI Analysis Error:", error);
                let displayError = "Connection Error. Please check your network or API key.";
                if (error.message.includes("API Key")) {
                    displayError = "System Error: API Key missing.";
                }
                appendMessage('ai', displayError);
            } finally {
                btnAnalyze.disabled = false;
                btnAnalyze.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> ANALYZE TELEMETRY ✨`;
            }
        }

        btnAnalyze.addEventListener('click', analyzeTelemetry);

        // --- 初始化 Three.js ---
        const container = document.getElementById('canvas-container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.position.set(6, 4, 8); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- 灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const redLight = new THREE.PointLight(0xff4444, 1.0, 8);
        redLight.position.set(-2, 1, 0);
        scene.add(redLight);
        
        const bottomLight = new THREE.DirectionalLight(0xe2e8f0, 0.8);
        bottomLight.position.set(0, -5, 0);
        scene.add(bottomLight);

        // --- 辅助网格 ---
        const gridHelper = new THREE.GridHelper(30, 30, 0x94a3b8, 0xcbd5e1);
        scene.add(gridHelper);

        // --- 程序化纹理生成 ---
        function createCorrugatedTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#334155'; 
            ctx.fillRect(0, 0, 512, 512);

            const gradient = ctx.createLinearGradient(0, 0, 512, 0);
            for (let i = 0; i <= 20; i++) {
                const stop1 = i / 20;
                const stop2 = Math.min(1.0, (i + 0.5) / 20);
                gradient.addColorStop(stop1, '#94a3b8'); 
                gradient.addColorStop(stop2, '#1e293b'); 
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        const bumpMap = createCorrugatedTexture();

        // --- 3D 模型构建 ---
        const containerGroup = new THREE.Group();
        scene.add(containerGroup);

        // 1. 集装箱外壳
        const boxGeo = new THREE.BoxGeometry(4.5, 2.4, 2.2);
        const boxMat = new THREE.MeshStandardMaterial({
            color: 0x334155, 
            metalness: 0.6,
            roughness: 0.3, 
            bumpMap: bumpMap,
            bumpScale: 0.08, 
            transparent: true,
            opacity: 0.95,
            side: THREE.DoubleSide
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.y = 1.2;
        box.castShadow = true;
        box.receiveShadow = true;
        box.name = "ContainerShell";
        containerGroup.add(box);

        // 2. 机柜 (Rack)
        const rackGeo = new THREE.BoxGeometry(0.6, 1.8, 0.8);
        const rackMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e293b, 
            emissive: 0x0f172a,
            roughness: 0.4,
            metalness: 0.7 
        });
        
        const racks = [];
        for(let i=0; i<4; i++) {
            const rack = new THREE.Mesh(rackGeo, rackMat.clone());
            rack.position.set(-1.5 + i * 1.0, 1.1, 0);
            containerGroup.add(rack);
            racks.push(rack);

            // LED 灯点
            const ledGeo = new THREE.PlaneGeometry(0.4, 0.05);
            const ledMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 }); // Cyan
            for(let j=0; j<6; j++) {
                const led = new THREE.Mesh(ledGeo, ledMat.clone());
                led.position.set(0, 0.6 - j * 0.25, 0.41);
                rack.add(led);
                led.userData = { 
                    blinkSpeed: Math.random() * 0.1, 
                    offset: Math.random() * 100 
                };
            }
        }

        // 3. HVAC (冷却机组)
        const hvacGroup = new THREE.Group();
        const hvacGeo = new THREE.BoxGeometry(0.8, 1.6, 1.4);
        const hvacMat = new THREE.MeshStandardMaterial({ 
            color: 0x64748b, // Slate-500
            metalness: 0.5,
            roughness: 0.5
        });
        const hvac = new THREE.Mesh(hvacGeo, hvacMat);
        hvacGroup.add(hvac);
        hvacGroup.position.set(2.8, 1.0, 0);
        containerGroup.add(hvacGroup);

        // 风扇系统优化 (Horizontal Embed Adjustment)
        // A. 顶部风扇孔洞 (嵌入感)
        const fanHoleGeo = new THREE.CircleGeometry(0.38, 32);
        const fanHoleMat = new THREE.MeshBasicMaterial({ color: 0x1e293b }); // 深色模拟内部
        const fanHole = new THREE.Mesh(fanHoleGeo, fanHoleMat);
        fanHole.rotation.x = -Math.PI / 2; // 水平放置
        fanHole.position.set(0, 0.801, 0); // 略高于HVAC顶部表面
        hvac.add(fanHole);

        // B. 风扇叶片
        const fanGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.02, 16);
        const fanMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, wireframe: true });
        const fan = new THREE.Mesh(fanGeo, fanMat);
        // 保持水平 (Cylinder默认Y轴朝上，无需旋转X/Z)
        fan.position.set(0, 0.82, 0); // 位于孔洞上方
        hvac.add(fan);

        // --- CFD 粒子系统 (加大颗粒度) ---
        const particleCount = 1200;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pColor = new Float32Array(particleCount * 3);
        const pData = []; 

        for(let i=0; i<particleCount; i++) {
            pPos[i*3] = -3 + Math.random() * 1.5; 
            pPos[i*3+1] = 0.2 + Math.random() * 2.0; 
            pPos[i*3+2] = -1 + Math.random() * 2.0; 
            
            pData.push({
                speed: 0.03 + Math.random() * 0.04,
                yBase: pPos[i*3+1]
            });

            // 初始颜色
            pColor[i*3] = 0; pColor[i*3+1] = 0; pColor[i*3+2] = 1;
        }
        
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3));

        const pMat = new THREE.PointsMaterial({
            size: 0.15, // 加大颗粒度 (原0.06)
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.NormalBlending, 
            depthWrite: false
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // --- 交互逻辑 ---
        function toggleShellVisibility() {
            if (box.material.opacity > 0.1) {
                box.material.opacity = 0.05;
                box.material.transparent = true;
                box.material.roughness = 1.0; 
            } else {
                box.material.opacity = 0.95;
                box.material.roughness = 0.3;
            }
        }

        window.addEventListener('contextmenu', (event) => {
            event.preventDefault(); 
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(box);
            if (intersects.length > 0) {
                toggleShellVisibility();
            }
        });

        document.getElementById('btn-shell').addEventListener('click', toggleShellVisibility);

        // --- 动画循环 ---
        let autoRotate = true;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 风扇旋转 (绕Y轴旋转，即水平旋转)
            fan.rotation.y -= 0.25;

            if (autoRotate) {
                containerGroup.rotation.y = Math.sin(time * 0.1) * 0.15;
            }

            // LED 闪烁
            racks.forEach(rack => {
                rack.children.forEach(led => {
                    const blink = Math.sin(time * 8 + led.userData.offset) > 0.2;
                    led.material.color.setHex(blink ? 0x06b6d4 : 0x155e75);
                });
            });

            // 粒子更新
            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;

            for(let i=0; i<particleCount; i++) {
                let x = positions[i*3];
                let y = positions[i*3+1];
                let z = positions[i*3+2];
                const data = pData[i];

                x += data.speed;

                if (x > -2 && x < 2) {
                    y = data.yBase + Math.sin(x * 3 + time * 3) * 0.15; 
                }

                if (x > 3.5 || y < 0 || y > 2.5) {
                    x = -3 + Math.random();
                    y = 0.2 + Math.random() * 2.0;
                    z = -1 + Math.random() * 2.0;
                    data.yBase = y;
                }

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                // 颜色变化
                const t = Math.max(0, Math.min(1, (x + 2.5) / 5.5));
                
                if (t < 0.5) {
                    const localT = t * 2;
                    colors[i*3] = 0; 
                    colors[i*3+1] = localT * 0.8;
                    colors[i*3+2] = 0.8; 
                } else {
                    const localT = (t - 0.5) * 2;
                    colors[i*3] = 0.8 * localT; 
                    colors[i*3+1] = 0.8 * (1 - localT); 
                    colors[i*3+2] = 0.8 * (1 - localT); 
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        document.getElementById('loader').style.opacity = 0; 

        // --- 事件监听 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            controls.reset();
            camera.position.set(6, 4, 8);
        });
        
        document.getElementById('btn-rotate').addEventListener('click', () => {
            autoRotate = !autoRotate;
        });

        // 模拟数据更新
        setInterval(() => {
            const inlet = (22 + Math.random()).toFixed(1);
            const outlet = (34 + Math.random() * 3).toFixed(1);
            document.getElementById('val-inlet').innerText = inlet + "°C";
            document.getElementById('val-outlet').innerText = outlet + "°C";
        }, 2000);

    <\/script>
</body>

            const rackKW = (itKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
            const heatLoadKW = rackKW * 0.98; 
            const maxCOP = BASE_COP * (1 + (MAX_SUPPLY_TEMP - 18) * COP_COEFF);
            const minCoolingKW = heatLoadKW / maxCOP;
            return (rackKW + minCoolingKW) / itKW;
        };

        const calcCoolingCOP = (supplyC, profileParams) => {
            const { BASE_COP, COP_COEFF } = profileParams;
            return BASE_COP * (1 + (supplyC - 18) * COP_COEFF);
        };

        const calcPUE = (itKW, rackKW, supplyC, profileParams) => {
            const cop = calcCoolingCOP(supplyC, profileParams);
            const coolingKW = (rackKW * 0.98) / cop; 
            return (rackKW + coolingKW) / itKW;
        };

        const calcChipTemp = (supplyC, rackKW) => {
            const heatLoadKW = rackKW * 0.98;
            return supplyC + (heatLoadKW * GLOBAL_CONSTANTS.THERMAL_RESISTANCE) + 2.0;
        };

        // --- COMPONENTS ---
        const L1Metric = ({ label, value, unit, color, isMpcActive, traceLabel, warning }) => (
            <div className={\`relative flex flex-col items-center justify-center p-3 rounded-lg border transition-all duration-700 \${isMpcActive && color !== 'text-slate-200' ? 'kpi-glow-mpc border-blue-500/50' : 'border-white/10 bg-slate-800/30'}\`}>
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">{label}</span>
                <div className={\`text-2xl font-mono font-bold \${color || 'text-white'} leading-none\`}>
                    {value} <span className="text-[11px] text-slate-500 font-normal">{unit}</span>
                </div>
                {warning && <div className="absolute -top-1 right-1 text-amber-400 animate-pulse" title={warning}><Icon name="AlertTriangle" size={14} /></div>}
                {traceLabel && <div className={\`absolute -bottom-5 w-full text-center opacity-0 transition-opacity duration-300 group-hover:opacity-100 text-[10px] italic whitespace-nowrap \${warning ? 'text-amber-400' : 'text-slate-500'}\`}>{traceLabel}</div>}
            </div>
        );

        const L2Metric = ({ label, value, unit, isMpcActive }) => (
            <div className={\`flex justify-between items-center text-xs border-b border-white/5 py-1.5 last:border-0 transition-colors duration-500 \${isMpcActive ? 'text-blue-200' : 'text-slate-500'}\`}>
                <span>{label}</span>
                <span className="font-mono">{value} {unit}</span>
            </div>
        );

        const QualityMetric = ({ label, value, unit, tooltip }) => (
            <div className="flex justify-between items-center text-xs py-1 group relative">
                <div className="flex items-center gap-1 text-slate-400">
                    <span>{label}</span>
                    {tooltip && <Icon name="Info" size={12} className="text-slate-600 cursor-help" />}
                </div>
                <span className="font-mono text-slate-200">{value} <span className="text-slate-500 text-[10px]">{unit}</span></span>
            </div>
        );

        const ValidationStep = ({ icon, text, delay, visible }) => {
            const [show, setShow] = useState(false);
            useEffect(() => {
                let timer;
                if (visible) timer = setTimeout(() => setShow(true), delay);
                else setShow(false);
                return () => clearTimeout(timer);
            }, [visible, delay]);
            return (
                <div className={\`flex items-start gap-2 transition-all duration-500 ease-out transform \${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'}\`}>
                    <div className="mt-0.5 text-emerald-400 shrink-0"><Icon name={icon} size={14} /></div>
                    <p className="text-[11px] text-slate-300 leading-tight">{text}</p>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [mode, setMode] = useState('MPC');
            const [showScenario, setShowScenario] = useState(false);
            const [showSummary, setShowSummary] = useState(true);
            const [isQualityExpanded, setIsQualityExpanded] = useState(true); 
            const [activeProfileId, setActiveProfileId] = useState('MODERN');
            
            const [inputs, setInputs] = useState({ itPowerKW: 85.0, safetyLimitC: GLOBAL_CONSTANTS.GLOBAL_LIMIT_TEMP, baselineTempC: GLOBAL_CONSTANTS.BASELINE_TEMP });
            const [state, setState] = useState({ supplyTempC: 18.0, chipTempC: 45.0, rackPowerKW: 95.0, pue: 1.45, pueMin: 1.22, cue: 0.6, wue: 1.8, margin: 20.0, deltaPue: 0.0, variance: 0.0, slew: 0.0, marginUtil: 0.0, history: [], isFeasibilityLimit: false });

            const t = I18N[lang];
            const activeProfile = ARCH_PROFILES[activeProfileId];

            useEffect(() => { setShowSummary(mode === 'MPC'); }, [mode]);

            useEffect(() => {
                const tick = setInterval(() => {
                    setState(prev => {
                        const { PSU_EFFICIENCY, NON_IT_LOAD_KW, MAX_SUPPLY_TEMP } = activeProfile.params;
                        const { MIN_SUPPLY_TEMP } = GLOBAL_CONSTANTS;
                        
                        const rackKW = (inputs.itPowerKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
                        const heatLoadKW = rackKW * 0.98;
                        const minFeasiblePUE = computeMinFeasiblePUE(inputs.itPowerKW, activeProfile);
                        const baselineSupply = GLOBAL_CONSTANTS.BASELINE_TEMP;
                        const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply, activeProfile.params);

                        let nextSupply = prev.supplyTempC;
                        if (mode === 'PID') {
                            const err = inputs.baselineTempC - prev.supplyTempC;
                            nextSupply = prev.supplyTempC + (err * 0.2); 
                        } else {
                            const SAFE_MARGIN = 2.5; 
                            const maxFeasibleChip = inputs.safetyLimitC - SAFE_MARGIN;
                            const deltaT = (heatLoadKW * GLOBAL_CONSTANTS.THERMAL_RESISTANCE) + 2.0;
                            let optimalSupply = maxFeasibleChip - deltaT;
                            optimalSupply = Math.max(MIN_SUPPLY_TEMP, Math.min(MAX_SUPPLY_TEMP, optimalSupply));
                            nextSupply = prev.supplyTempC * 0.6 + optimalSupply * 0.4;
                        }

                        const nextChip = calcChipTemp(nextSupply, rackKW);
                        let nextPUE = calcPUE(inputs.itPowerKW, rackKW, nextSupply, activeProfile.params);
                        let isLimit = false;
                        if (nextPUE < minFeasiblePUE) { nextPUE = minFeasiblePUE; isLimit = true; }
                        const isNearLimit = (nextPUE - minFeasiblePUE) < 0.015;

                        const nextCUE = nextPUE * GLOBAL_CONSTANTS.CARBON_INTENSITY;
                        const nextMargin = inputs.safetyLimitC - nextChip;
                        const deltaPuePct = ((baselinePUE - nextPUE) / baselinePUE * 100).toFixed(1);
                        const diff = nextSupply - prev.supplyTempC;
                        const nextSlew = Math.abs(diff); 
                        const nextVar = prev.variance * 0.9 + (diff * diff) * 0.1;
                        const marginUtil = (nextChip / inputs.safetyLimitC) * 100;
                        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
                        const newHistory = [...prev.history, { time: now, chip: nextChip, supply: nextSupply, limit: inputs.safetyLimitC, baseline: inputs.baselineTempC }].slice(-60);

                        return {
                            supplyTempC: nextSupply, chipTempC: nextChip, rackPowerKW: rackKW, pue: nextPUE, pueMin: minFeasiblePUE, cue: nextCUE, wue: nextPUE * GLOBAL_CONSTANTS.WATER_USAGE_INTENSITY, margin: nextMargin, deltaPue: deltaPuePct, variance: Math.sqrt(nextVar), slew: nextSlew, marginUtil: marginUtil, history: newHistory, isFeasibilityLimit: isNearLimit || isLimit
                        };
                    });
                }, 800);
                return () => clearInterval(tick);
            }, [inputs, mode, lang, activeProfile]);

            // --- REPORT GENERATOR ---
            const generateMemo = () => {
                const w = window.open('', '_blank');
                const { PSU_EFFICIENCY, NON_IT_LOAD_KW } = activeProfile.params;
                const rackKW = (inputs.itPowerKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
                
                // Explicit Counterfactual
                const baselineSupply = GLOBAL_CONSTANTS.BASELINE_TEMP; 
                const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply, activeProfile.params);
                const baselineChip = calcChipTemp(baselineSupply, rackKW);
                
                const actualSupply = state.supplyTempC;
                const actualPUE = state.pue;
                const actualChip = state.chipTempC;
                const pueSaving = ((baselinePUE - actualPUE) / baselinePUE * 100).toFixed(2);
                
                const profReqText = lang === 'en' 
                    ? \`Under fixed operating demand (IT load treated as an exogenous input) and strict thermal safety constraints ($T_{chip} \\le \${inputs.safetyLimitC}^\\circ\\mathrm{C}$), the MPC controller performs dynamic setpoint optimization on the supply water temperature ($T_{supply}$). By converting conservative thermal safety margins into controllable degrees of freedom, the system transitions from fixed, conservative operation (PID baseline at $18^\\circ\\mathrm{C}$) to energy-optimal operation, resulting in a measurable reduction in system PUE under identical load conditions ($\\Delta PUE \\approx -\${pueSaving}\\%$).\`
                    : \`在满足芯片热安全约束（$T_{chip} \\le \${inputs.safetyLimitC}^\\circ\\mathrm{C}$）与运行需求（IT负载给定）的前提下，MPC 对供水温度 $T_{supply}$ 进行动态优化，将保守冗余转化为能效收益，并在同一负载条件下相较 PID ($18^\\circ\\mathrm{C}$ 定温) 实现可量化的 PUE 降低（$\\Delta PUE \\approx -\${pueSaving}\\%$）。\`;

                // KaTeX scripts
                const katexHead = \`
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"><\\/script>
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"><\\/script>
                \`;

                // Export Script with Self-Check
                const exportScript = \`
                    <script>
                        function renderMath() {
                            if(window.renderMathInElement) {
                                renderMathInElement(document.body, {
                                    delimiters: [
                                        { left: "$$", right: "$$", display: true },
                                        { left: "\\\\\\\\(", right: "\\\\\\\\)", display: false },
                                        { left: "$", right: "$", display: false }
                                    ],
                                    throwOnError: false
                                });
                            }
                        }

                        async function prepareForExport() {
                            let attempts = 0;
                            while(!window.renderMathInElement && attempts < 50) {
                                await new Promise(r => setTimeout(r, 100));
                                attempts++;
                            }
                            renderMath();
                            if (document.fonts && document.fonts.ready) await document.fonts.ready;
                            await new Promise(r => setTimeout(r, 800));

                            const content = document.body.innerText;
                            if (content.match(/\\\\\\\\(circ|mathrm|eta|le|Delta|approx)/)) {
                                const msg = "\${lang}" === 'zh' 
                                    ? "导出中断：检测到未渲染的数学公式代码。\\\\n请检查网络连接是否允许加载 KaTeX 库。" 
                                    : "Export Halted: Unrendered LaTeX code detected.\\\\nPlease check if network allows loading KaTeX.";
                                alert(msg);
                                throw new Error("Self-check failed: Unrendered LaTeX");
                            }
                        }

                        window.onload = () => {
                            prepareForExport().then(() => {
                                window.print();
                            }).catch(e => {
                                console.error("Export failed:", e);
                            });
                        };
                    <\\/script>
                \`;

                const html = \`
                    <!DOCTYPE html>
                    <html lang="\${lang}">
                    <head>
                        <title>\${t.report.title}</title>
                        \${katexHead}
                        <style>
                            body { font-family: 'Noto Serif SC', serif; padding: 40px; color: #1e293b; max-width: 800px; margin: 0 auto; line-height: 1.5; }
                            h1 { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 5px; font-size: 24px; }
                            .meta { color: #64748b; font-family: monospace; font-size: 0.9em; margin-bottom: 30px; }
                            h2 { margin-top: 30px; font-size: 18px; border-left: 4px solid #3b82f6; padding-left: 10px; background: #f8fafc; }
                            table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9em; }
                            th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
                            th { background: #f1f5f9; }
                            .highlight { font-weight: bold; color: #1e40af; }
                            .mono { font-family: monospace; }
                            .summary-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 4px; margin-bottom: 20px; color: #1e3a8a; font-size: 0.95em; }
                            ul { padding-left: 20px; }
                            li { margin-bottom: 5px; }
                        </style>
                    </head>
                    <body>
                        <h1>\${t.report.title}</h1>
                        <div class="meta">
                            DATE: \${new Date().toISOString().split('T')[0]}<br/>
                            SUBJECT: \${t.instance}<br/>
                            ARCH_PROFILE: \${activeProfile.label} (\${activeProfile.desc})<br/>
                            ID: \${Math.random().toString(36).substr(2, 9).toUpperCase()}
                        </div>

                        <div class="summary-box">
                            <strong>\${t.profReqTitle}:</strong><br/>
                            \${profReqText}
                        </div>

                        <h2>\${t.report.titles.prob}</h2>
                        <ul>
                            <li><strong>\${t.report.content.prob_vars.u}</strong></li>
                            <li><strong>\${t.report.content.prob_vars.y}</strong></li>
                            <li><strong>\${t.report.content.prob_vars.j}</strong></li>
                        </ul>
                        <div class="summary-box">
                            \${t.report.content.prob_summary}
                        </div>

                        <h2>\${t.report.titles.baseline}</h2>
                        <p>\${t.report.content.comp_intro}</p>
                        <p>($P_{IT} = \${inputs.itPowerKW.toFixed(1)}$ kW, $T_{baseline} = \${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$)</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Parameter</th>
                                    <th>PID Baseline (Counterfactual)</th>
                                    <th>MPC (Actual)</th>
                                    <th>Delta</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Setpoint ($T_{supply}$)</td>
                                    <td>$$\${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$$</td>
                                    <td class="highlight">$$\${actualSupply.toFixed(1)}^\\circ\\mathrm{C}$$</td>
                                    <td>$$\${(actualSupply - baselineSupply).toFixed(1)}^\\circ\\mathrm{C}$$</td>
                                </tr>
                                <tr>
                                    <td>Chip Temp ($T_{chip}$)</td>
                                    <td>$$\${baselineChip.toFixed(1)}^\\circ\\mathrm{C}$$</td>
                                    <td>$$\${actualChip.toFixed(1)}^\\circ\\mathrm{C}$$</td>
                                    <td>Margin Utilized</td>
                                </tr>
                                <tr>
                                    <td><strong>System PUE</strong></td>
                                    <td>\${baselinePUE.toFixed(3)}</td>
                                    <td class="highlight">\${actualPUE.toFixed(3)}</td>
                                    <td><strong>-\${pueSaving}%</strong></td>
                                </tr>
                            </tbody>
                        </table>

                        <h2>\${t.report.titles.trace}</h2>
                        <div class="mono" style="background:#f8fafc; padding:10px; border:1px solid #e2e8f0; font-size:0.8em;">
                            # SYSTEM CONSTANTS (PROFILE: \${activeProfile.id})<br/>
                            $\\eta_{PSU} = \${activeProfile.params.PSU_EFFICIENCY}$<br/>
                            $R_{th} = \${GLOBAL_CONSTANTS.THERMAL_RESISTANCE} \\; \\mathrm{K/kW}$<br/>
                            $P_{facility} = \${activeProfile.params.NON_IT_LOAD_KW} \\; \\mathrm{kW}$<br/>
                            $PUE_{floor} = \${activeProfile.pueFloor.toFixed(3)}$<br/>
                            <br/>
                            # BOUNDARY CONDITIONS<br/>
                            $T_{limit} = \${inputs.safetyLimitC}^\\circ\\mathrm{C}$<br/>
                            $T_{baseline} = \${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$<br/>
                            $P_{IT} = \${inputs.itPowerKW} \\; \\mathrm{kW}$
                        </div>

                        \${exportScript}
                    </body>
                    </html>
                \`;
                w.document.write(html);
                w.document.close();
            };

            return (
                <div className="flex flex-col h-screen p-4 gap-2 bg-[#020617] text-slate-200 overflow-hidden font-sans text-xs">
                    {/* HEADER */}
                    <header className="glass-panel p-4 rounded-xl flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-blue-900/30 rounded-lg text-blue-400"><Icon name="Activity" size={28} /></div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white">{t.title}</h1>
                                <div className="flex items-center gap-2 text-xs text-slate-400 font-mono mt-1">
                                    <span className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700">VER 8.0 (Academic)</span>
                                    <span>{t.instance}</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <div className="flex bg-slate-800 rounded p-0.5 border border-slate-700">
                                <button onClick={() => setMode('PID')} className={\`px-3 py-1 rounded text-xs font-bold \${mode==='PID' ? 'bg-amber-600 text-white' : 'text-slate-400'}\`}>PID</button>
                                <button onClick={() => setMode('MPC')} className={\`px-3 py-1 rounded text-xs font-bold \${mode==='MPC' ? 'bg-blue-600 text-white' : 'text-slate-400'}\`}>MPC</button>
                            </div>
                            <button onClick={generateMemo} className="px-3 py-1 border border-blue-500/30 bg-blue-500/10 rounded text-xs text-blue-300 font-bold hover:bg-blue-500/20 flex items-center gap-1">
                                <Icon name="FileText" size={14} /> {t.report.btn}
                            </button>
                        </div>
                    </header>

                    {/* ANIMATED PROFESSOR REQUIREMENT BLOCK */}
                    <div className={\`glass-panel px-3 py-2 rounded-lg border-l-2 border-blue-500 bg-blue-900/10 shrink-0 transition-all duration-500 \${showSummary ? 'opacity-100 max-h-24' : 'opacity-0 max-h-0 overflow-hidden py-0 border-0'}\`}>
                        <div className="space-y-1">
                            {t.validationSteps.map((step, idx) => (
                                <ValidationStep key={idx} icon={step.icon} text={typeof step.text === 'function' ? step.text(state.deltaPue) : step.text} delay={idx * 600} visible={showSummary} />
                            ))}
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 grid grid-cols-12 gap-2 min-h-0">
                        
                        {/* LEFT: CONTROLS & HIERARCHICAL METRICS */}
                        <div className="col-span-3 flex flex-col gap-2 overflow-y-auto pr-1">
                            {/* Inputs */}
                            <section className="glass-panel p-3 rounded-lg shrink-0">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2 border-b border-white/10 pb-1">{t.sections.input}</h3>
                                <div>
                                    <div className="flex justify-between text-xs mb-1 text-slate-300"><span>{t.labels.itPower}</span><span className="font-mono">{inputs.itPowerKW.toFixed(0)} kW</span></div>
                                    <input type="range" min="50" max="130" step="1" value={inputs.itPowerKW} onChange={(e) => setInputs(s => ({...s, itPowerKW: Number(e.target.value)}))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                </div>
                            </section>

                            {/* Boundary */}
                            <section className="glass-panel p-3 rounded-lg shrink-0">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2 border-b border-white/10 pb-1">{t.sections.boundary}</h3>
                                {/* Architecture Selector */}
                                <div className="mb-3">
                                    <div className="text-xs text-slate-400 mb-1">{t.sections.arch}</div>
                                    <div className="flex flex-col gap-1.5">
                                        {Object.values(ARCH_PROFILES).map((prof) => (
                                            <button key={prof.id} onClick={() => setActiveProfileId(prof.id)} className={\`text-xs text-left px-2 py-1.5 rounded border transition-all flex justify-between items-center \${activeProfileId === prof.id ? 'bg-blue-500/20 border-blue-500/50 text-white' : 'bg-slate-800/50 border-slate-700/50 text-slate-400 hover:border-slate-500'}\`}>
                                                <div><div className="font-bold">{prof.label}</div></div>
                                                <div className="text-[10px] font-mono opacity-80 bg-black/30 px-1 rounded">&gt;{prof.pueFloor}</div>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-1.5 text-xs flex justify-between items-center text-slate-400 bg-black/20 px-2 py-1 rounded border border-white/5">
                                        <span>{t.labels.physLimit}:</span><span className="font-mono text-white font-bold">{state.pueMin.toFixed(3)}</span>
                                    </div>
                                </div>
                                <div className="border-t border-white/5 pt-2">
                                    <div className="flex justify-between text-xs mb-1 text-red-300"><span>{t.labels.chipLimit}</span><span className="font-mono">{inputs.safetyLimitC.toFixed(0)}°C</span></div>
                                    <input type="range" min="60" max="75" step="1" value={inputs.safetyLimitC} onChange={(e) => setInputs(s => ({...s, safetyLimitC: Number(e.target.value)}))} className="w-full h-1.5 bg-slate-700 rounded-lg accent-red-500" />
                                </div>
                            </section>

                            {/* PID Dashboard */}
                            {mode === 'PID' && (
                                <section className="glass-panel rounded-lg p-3 bg-slate-900/30 border border-amber-900/20 shrink-0">
                                    <h3 className="text-xs font-bold text-amber-500/70 uppercase mb-2 border-b border-amber-900/20 pb-1">{t.sections.pid_dash}</h3>
                                    <div className="space-y-1.5">
                                        <div className="flex justify-between text-xs"><span className="text-slate-500">{t.pid_dash.setpoint}</span><span className="font-mono text-amber-100">{GLOBAL_CONSTANTS.BASELINE_TEMP.toFixed(1)} °C</span></div>
                                        <div className="flex justify-between text-xs"><span className="text-slate-500">{t.pid_dash.margin}</span><span className="font-mono text-slate-300">{state.margin.toFixed(1)} °C</span></div>
                                    </div>
                                </section>
                            )}

                            {/* MPC Dashboard */}
                            {mode === 'MPC' && (
                                <section className="glass-panel rounded-lg overflow-hidden bg-slate-900/30 border border-blue-900/20 shrink-0">
                                    <button onClick={() => setIsQualityExpanded(!isQualityExpanded)} className="w-full p-2 flex justify-between items-center text-xs font-bold text-slate-400 hover:text-blue-300 hover:bg-white/5 transition-colors">
                                        <span>{t.sections.advanced}</span><Icon name={isQualityExpanded ? "ChevronUp" : "ChevronDown"} size={14} />
                                    </button>
                                    {isQualityExpanded && (
                                        <div className="p-2 pt-0 space-y-2 bg-black/20">
                                            <div className="h-px bg-white/5 my-1"></div>
                                            <div className="space-y-1">
                                                <div className="text-xs text-slate-500 font-bold uppercase">{t.quality.stability}</div>
                                                <QualityMetric label={t.labels.variance} value={state.variance.toFixed(3)} unit="" />
                                                <QualityMetric label={t.labels.slew} value={state.slew.toFixed(2)} unit="°C/s" />
                                            </div>
                                            <div className="space-y-1">
                                                <div className="text-xs text-slate-500 font-bold uppercase">{t.quality.constraint}</div>
                                                <QualityMetric label={t.labels.utilization} value={state.marginUtil.toFixed(1)} unit="%" />

            `;

            const canvas = document.getElementById('cfd-canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');

            // 粒子数据
            const PARTICLES = 220;
            const particles = Array.from({length: PARTICLES}, () => ({
                x: Math.random() * W * 0.55,
                y: H * 0.2 + Math.random() * H * 0.6,
                vx: 0.6 + Math.random() * 0.8,
                vy: (Math.random() - 0.5) * 0.4,
                progress: Math.random(), // 0=cold,1=hot
                size: 2 + Math.random() * 2.5,
                life: Math.random()
            }));

            // 机柜定义（二维投影）
            const CX = W * 0.5, CY = H * 0.5;
            const RACK_W = W * 0.55, RACK_H = H * 0.65;
            const racks = [0,1,2,3].map(i => ({
                x: CX - RACK_W/2 + (i+0.5)*(RACK_W/4),
                y: CY,
                w: RACK_W/4 * 0.72,
                h: RACK_H * 0.85
            }));

            let t = 0;
            let inlet = 22.0, outlet = 35.0;
            let updateTimer = 0;

            function lerp(a, b, t) { return a + (b-a)*t; }
            function heatColor(p) {
                // blue(cold) -> cyan -> green -> yellow -> red(hot)
                const stops = [
                    [0.0, [30,120,255,0.8]],
                    [0.3, [0,200,200,0.85]],
                    [0.6, [40,200,80,0.85]],
                    [0.8, [255,200,30,0.9]],
                    [1.0, [255,60,30,0.95]]

                    if(p <= stops[i+1][0]) {
                        const local = (p - stops[i][0])/(stops[i+1][0]-stops[i][0]);
                        const a = stops[i][1], b = stops[i+1][1];
                        return [lerp(a[0],b[0],local)|0, lerp(a[1],b[1],local)|0, lerp(a[2],b[2],local)|0, lerp(a[3],b[3],local)];

                glowGrad.addColorStop(0,'rgba(6,182,212,0.15)'); glowGrad.addColorStop(1,'rgba(16,185,129,0.15)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath(); ctx.roundRect(boxX, boxY, RACK_W, RACK_H, 8); ctx.fill();

                // 顶部标签
                ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('▼ COOL AIR IN', CX - RACK_W*0.3, boxY - 8);
                ctx.fillStyle = '#f87171';
                ctx.fillText('▲ HOT AIR OUT', CX + RACK_W*0.3, boxY - 8);

                // 各机柜
                racks.forEach((rack, ri) => {
                    const rx = rack.x - rack.w/2, ry = rack.y - rack.h/2;

                    ctx.beginPath(); ctx.roundRect(rx, ry, rack.w, rack.h, 4); ctx.fill(); ctx.stroke();

                    // LED 行
                    const ledColors = ['#06b6d4','#10b981','#f59e0b','#3b82f6'];
                    for(let row=0; row<8; row++) {
                        const ly = ry + 8 + row * (rack.h - 16) / 8;
                        const blink = Math.sin(t*7 + ri*1.3 + row*0.8) > 0.2;
                        ctx.fillStyle = blink ? ledColors[ri%4] : '#1e3a5f';
                        ctx.beginPath(); ctx.roundRect(rx+4, ly, rack.w-8, 5, 2); ctx.fill();
                    }

                    // HVAC 单元（最右侧）
                    if(ri === 3) {
                        const hx = rack.x + rack.w/2 + 6, hy = rack.y - rack.h/2;
                        ctx.fillStyle = '#334155'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
                        ctx.beginPath(); ctx.roundRect(hx, hy, 28, rack.h, 4); ctx.fill(); ctx.stroke();
                        // 风扇动画
                        const fanY = rack.y;
                        ctx.save(); ctx.translate(hx+14, fanY);
                        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
                        for(let b=0; b<4; b++) {
                            const angle = t*4 + b * Math.PI/2;
                            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(angle)*11, Math.sin(angle)*11); ctx.stroke();
                        }
                        ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fillStyle='#64748b'; ctx.fill();
                        ctx.restore();
                        ctx.fillStyle = '#0891b2'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
                        ctx.fillText('HVAC', hx+14, hy+rack.h+12);
                    }
                });

                // 粒子更新与绘制
                particles.forEach(p => {
                    // 更新
                    p.x += p.vx;
                    // 波动
                    p.vy = Math.sin(p.x * 0.03 + t * 2 + p.life * 10) * 0.35;
                    p.y += p.vy;
                    p.progress = Math.min(1, p.x / (W * 0.82));

                    // 重置
                    if(p.x > W * 0.9 || p.y < boxY - 10 || p.y > boxY + RACK_H + 10) {
                        p.x = W * 0.03 + Math.random() * W * 0.08;
                        p.y = boxY + 20 + Math.random() * (RACK_H - 40);
                        p.progress = 0; p.vx = 0.5 + Math.random() * 0.9;
                        p.life = Math.random();
                    }

                    const [r,g,b,a] = heatColor(p.progress);
                    ctx.beginPath();
                    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*1.8);
                    grad.addColorStop(0,`rgba(${r},${g},${b},${a})`);
                    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
                    ctx.fillStyle = grad;
                    ctx.arc(p.x, p.y, p.size*1.8, 0, Math.PI*2);
                    ctx.fill();
                });

                // 温度色条图例
                const barX = 16, barY = H - 80, barW = 12, barH = 60;
                const barGrad = ctx.createLinearGradient(0, barY+barH, 0, barY);
                barGrad.addColorStop(0,'rgb(30,120,255)');
                barGrad.addColorStop(0.5,'rgb(40,200,80)');
                barGrad.addColorStop(1,'rgb(255,60,30)');
                ctx.fillStyle = barGrad;
                ctx.fillRect(barX, barY, barW, barH);
                ctx.strokeStyle='#475569'; ctx.lineWidth=1;
                ctx.strokeRect(barX, barY, barW, barH);
                ctx.fillStyle='#94a3b8'; ctx.font='10px monospace'; ctx.textAlign='left';
                ctx.fillText('HOT', barX+16, barY+5);
                ctx.fillText('COLD', barX+16, barY+barH+3);

                // 数据更新
                if(updateTimer % 120 === 0) {
                    inlet = 21.5 + Math.random();
                    outlet = 33.5 + Math.random() * 3;
                    const dt = outlet - inlet;
                    const inEl = document.getElementById('cfd-inlet');
                    const outEl = document.getElementById('cfd-outlet');
                    const dtEl = document.getElementById('cfd-dt');
                    if(inEl) inEl.textContent = inlet.toFixed(1)+'°C';
                    if(outEl) outEl.textContent = outlet.toFixed(1)+'°C';
                    if(dtEl) dtEl.textContent = dt.toFixed(1)+'°C';
                }
            }

            // Init telemetry display
            setTimeout(() => {
                const inEl = document.getElementById('cfd-inlet');
                const outEl = document.getElementById('cfd-outlet');
                const dtEl = document.getElementById('cfd-dt');
                if(inEl) inEl.textContent = '22.0°C';
                if(outEl) outEl.textContent = '35.2°C';
                if(dtEl) dtEl.textContent = '13.2°C';
            }, 50);

            drawFrame();
        }

        // ---------- MPC 热控优化仪表盘 ----------
        function startMPC(panel, lang) {

            // Physics
            const THERMAL_R = 0.22, MIN_T = 16, BASE_T = 18, LIMIT_T = 65;
            const profiles = {
                LEGACY: { label: isZH?'传统':'Legacy', pueFloor:1.35, COP:3.2, COPc:0.025, maxT:26, nonIT:12 },
                MODERN: { label: isZH?'现代':'Modern', pueFloor:1.22, COP:4.0, COPc:0.035, maxT:32, nonIT:6 },
                ADVANCED:{ label: isZH?'前沿':'Advanced', pueFloor:1.14, COP:5.5, COPc:0.045, maxT:40, nonIT:3.5 }
            };

            // State
            let mode = 'MPC', profileId = 'MODERN';
            let itPow = 85, safetyLim = LIMIT_T;
            let supply = 18, chip = 45, pue = 1.45;
            let history = [];
            let tickCount = 0;
            let baselinePUE = 1.45;

            // Build DOM
            panel.innerHTML = `
<div style="width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:0;color:#e2e8f0;font-size:13px;">
  <!-- Header -->

      <button onclick="window._mpcSetMode('PID')" id="mpc-btn-pid" style="padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid #334155;cursor:pointer;background:#1e293b;color:#94a3b8;">PID</button>

    <!-- Left panel -->

      <div id="mpc-chip" style="font-size:28px;font-weight:800;color:#e2e8f0;font-family:monospace;">--°C</div>
      <div style="color:#64748b;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:4px;">${L.pue}</div>
      <div id="mpc-pue" style="font-size:28px;font-weight:800;color:#10b981;font-family:monospace;">--</div>
      <div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;">
        <div id="mpc-delta" style="font-size:11px;color:#94a3b8;">${L.delta}: --</div>
        <div id="mpc-margin" style="font-size:11px;color:#94a3b8;margin-top:3px;">${L.marg}: --°C</div>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;margin-top:auto;">
        <div id="mpc-status" style="padding:6px 8px;border-radius:6px;font-size:10px;font-weight:700;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10b981;text-align:center;">MPC ACTIVE</div>

    <!-- Chart area -->
    <div style="padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(2,6,23,0.7);overflow:hidden;">

      <canvas id="mpc-chart" style="flex:1;width:100%;min-height:0;border-radius:6px;"></canvas>

            const chartCanvas = document.getElementById('mpc-chart');

            function calcPhysics() {
                const prof = profiles[profileId];
                const rackKW = (itPow / 0.95) + prof.nonIT;
                const heatKW = rackKW * 0.98;

                let nextSupply = supply;
                if(mode === 'PID') {
                    nextSupply += (BASE_T - supply) * 0.2;
                } else {
                    const safeChip = safetyLim - 2.5;
                    const deltaT = heatKW * THERMAL_R + 2.0;
                    let optSupply = safeChip - deltaT;
                    optSupply = Math.max(MIN_T, Math.min(prof.maxT, optSupply));
                    nextSupply = supply * 0.6 + optSupply * 0.4;
                }

                const nextChip = nextSupply + (heatKW * THERMAL_R) + 2.0;
                const cop = prof.COP * (1 + (nextSupply - 18) * prof.COPc);
                const coolingKW = heatKW / cop;
                let nextPUE = (rackKW + coolingKW) / itPow;
                if(nextPUE < prof.pueFloor) nextPUE = prof.pueFloor;

                const baseCOP = prof.COP * (1 + (BASE_T - 18) * prof.COPc);
                const baseCoolKW = heatKW / baseCOP;
                baselinePUE = (rackKW + baseCoolKW) / itPow;

                return { nextSupply, nextChip, nextPUE };
            }

            function drawChart() {
                if(!chartCanvas) return;
                const W = chartCanvas.width, H = chartCanvas.height;
                const ctx = chartCanvas.getContext('2d');
                ctx.clearRect(0,0,W,H);

                // background
                ctx.fillStyle = 'rgba(15,23,42,0.8)';
                ctx.fillRect(0,0,W,H);

                if(history.length < 2) return;

                const PAD = {t:10, r:10, b:30, l:40};
                const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;

                // Grid
                ctx.strokeStyle = 'rgba(51,65,85,0.4)'; ctx.lineWidth = 1;
                for(let i=0;i<=4;i++) {
                    const y = PAD.t + (cH/4)*i;
                    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l+cW, y); ctx.stroke();
                }

                const N = history.length;
                const chipMin = 30, chipMax = 80;
                const supMin = 10, supMax = 45;

                function xp(i) { return PAD.l + (i/(N-1))*cW; }
                function yChip(v) { return PAD.t + cH - ((v-chipMin)/(chipMax-chipMin))*cH; }
                function ySup(v) { return PAD.t + cH - ((v-supMin)/(supMax-supMin))*cH; }

                // Safety limit line
                const limitY = yChip(safetyLim);
                ctx.strokeStyle = 'rgba(239,68,68,0.7)'; ctx.lineWidth = 1.5;
                ctx.setLineDash([4,3]);
                ctx.beginPath(); ctx.moveTo(PAD.l, limitY); ctx.lineTo(PAD.l+cW, limitY); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#ef4444'; ctx.font = '9px monospace';
                ctx.textAlign = 'left'; ctx.fillText(L.limit+` ${safetyLim}°C`, PAD.l+3, limitY-3);

                // Baseline supply line
                const basY = ySup(BASE_T);
                ctx.strokeStyle = 'rgba(245,158,11,0.5)'; ctx.lineWidth = 1;
                ctx.setLineDash([3,3]);
                ctx.beginPath(); ctx.moveTo(PAD.l, basY); ctx.lineTo(PAD.l+cW, basY); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#f59e0b'; ctx.font = '9px monospace';
                ctx.fillText(L.baseline+` ${BASE_T}°C`, PAD.l+3, basY-3);

                // Supply temp area
                ctx.beginPath();
                history.forEach((d,i) => {
                    const x = xp(i), y = ySup(d.supply);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                const areaPath = new Path2D();
                history.forEach((d,i) => {
                    const x = xp(i), y = ySup(d.supply);
                    i===0 ? areaPath.moveTo(x,y) : areaPath.lineTo(x,y);
                });
                areaPath.lineTo(xp(N-1), PAD.t+cH);
                areaPath.lineTo(PAD.l, PAD.t+cH);
                areaPath.closePath();
                const areaGrad = ctx.createLinearGradient(0,0,0,cH);
                areaGrad.addColorStop(0,'rgba(59,130,246,0.25)');
                areaGrad.addColorStop(1,'rgba(59,130,246,0.02)');
                ctx.fillStyle = areaGrad;
                ctx.fill(areaPath);

                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2.5;
                ctx.beginPath();
                history.forEach((d,i) => {
                    const x = xp(i), y = ySup(d.supply);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.stroke();

                // Chip temp line
                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
                ctx.beginPath();
                history.forEach((d,i) => {
                    const x = xp(i), y = yChip(d.chip);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.stroke();

                // Y-axis labels
                ctx.fillStyle = '#64748b'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
                [40,50,60,70].forEach(v => {
                    ctx.fillText(v+'°', PAD.l-3, yChip(v)+3);
                });

                // Legend
                ctx.textAlign = 'left'; ctx.font = '10px monospace';
                ctx.fillStyle = '#3b82f6'; ctx.fillRect(PAD.l, H-20, 20, 3);
                ctx.fillStyle = '#94a3b8'; ctx.fillText('T_supply', PAD.l+24, H-14);
                ctx.fillStyle = '#f97316'; ctx.fillRect(PAD.l+100, H-20, 20, 3);
                ctx.fillStyle = '#94a3b8'; ctx.fillText('T_chip', PAD.l+124, H-14);
            }

            function resizeChart() {
                if(!chartCanvas || !chartCanvas.parentElement) return;
                const rect = chartCanvas.parentElement.getBoundingClientRect();
                const cH = Math.max(100, rect.height - 60);
                chartCanvas.width = rect.width - 24;
                chartCanvas.height = cH;
            }
            setTimeout(resizeChart, 50);

            window._mpcSetMode = function(m) {
                mode = m;
                const btnM = document.getElementById('mpc-btn-mpc');
                const btnP = document.getElementById('mpc-btn-pid');
                if(btnM) { btnM.style.background = m==='MPC'?'#1d4ed8':'#1e293b'; btnM.style.color = m==='MPC'?'#fff':'#94a3b8'; }
                if(btnP) { btnP.style.background = m==='PID'?'#b45309':'#1e293b'; btnP.style.color = m==='PID'?'#fff':'#94a3b8'; }
                const st = document.getElementById('mpc-status');
                if(st) {
                    st.textContent = m === 'MPC' ? 'MPC ACTIVE' : 'PID FIXED';
                    st.style.background = m==='MPC'?'rgba(16,185,129,0.1)':'rgba(245,158,11,0.1)';
                    st.style.borderColor = m==='MPC'?'rgba(16,185,129,0.3)':'rgba(245,158,11,0.3)';
                    st.style.color = m==='MPC'?'#10b981':'#f59e0b';
                }
            };
            window._mpcSetProfile = function(id) {
                profileId = id;
                Object.keys(profiles).forEach(k => {
                    const btn = document.getElementById('mpc-arch-'+k);
                    if(btn) { btn.style.background = k===id?'#1d4ed8':'#1e293b'; btn.style.color = k===id?'#fff':'#94a3b8'; }
                });
            };

            let tickInterval = setInterval(() => {
                tickCount++;
                const {nextSupply, nextChip, nextPUE} = calcPhysics();
                supply = nextSupply; chip = nextChip; pue = nextPUE;

                const now = tickCount;
                history = [...history, {time:now, supply, chip, limit:safetyLim}].slice(-60);

                const supEl = document.getElementById('mpc-supply');
                const chipEl = document.getElementById('mpc-chip');
                const pueEl = document.getElementById('mpc-pue');
                const deltaEl = document.getElementById('mpc-delta');
                const margEl = document.getElementById('mpc-margin');

                if(supEl) supEl.textContent = supply.toFixed(1)+'°C';
                if(chipEl) {
                    chipEl.textContent = chip.toFixed(1)+'°C';
                    chipEl.style.color = chip > safetyLim - 3 ? '#ef4444' : '#e2e8f0';
                }
                if(pueEl) pueEl.textContent = pue.toFixed(3);
                const deltaPct = ((baselinePUE - pue) / baselinePUE * 100).toFixed(1);
                if(deltaEl) { deltaEl.textContent = `${L.delta}: ${mode==='MPC'?'-':''}${Math.abs(deltaPct)}%`; deltaEl.style.color = mode==='MPC' ? '#10b981' : '#f59e0b'; }
                const margin = safetyLim - chip;
                if(margEl) { margEl.textContent = `${L.marg}: ${margin.toFixed(1)}°C`; margEl.style.color = margin < 5 ? '#ef4444' : '#94a3b8'; }

                if(chartCanvas && history.length > 1) drawChart();
            }, 800);

            // Stop interval when panel is removed
            const observer = new MutationObserver(() => {
                if(!document.getElementById('mpc-chart')) {
                    clearInterval(tickInterval);
                    observer.disconnect();
                }
            });
            observer.observe(document.body, {childList:true, subtree:true});
        }

            }
            else if (tabId === 'coretech') {
                html = `
                    <div class="${animClass} flex flex-col h-[calc(100vh-220px)] md:h-[calc(100vh-180px)] gap-4 pb-4">

                main.innerHTML = html;
                
                // 加载子系统的 Iframe
                if (!state.subTech) state.subTech = 'cfd';

            else if (tabId === 'roadmap') {
                html = `
                    <div class="${animClass}">

                                <div class="text-4xl text-indigo-500 mb-4 opacity-80 group-hover:scale-110 transition-transform"><i class="fa-solid fa-handshake-angle"></i></div>
                                <h3 class="text-lg font-bold text-slate-100 mb-3">${t('roadmap', 's3_t')}</h3>
                                <p class="text-sm text-slate-400 leading-relaxed mb-4">${t('roadmap', 's3_d')}</p>
                            </div>
                        </div>
                    </div>`;
                main.innerHTML = html;
            }
            else if (tabId === 'financials') {
                const scen = state.finScenario;
                const d = finData[scen];
                html = `
                    <div class="${animClass} grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 space-y-6">
                            <div>
                                <h2 class="text-2xl font-bold mb-2">${t('financials', 't1')}</h2>
                                <p class="text-slate-400 text-sm">${t('financials', 'd1')}</p>
                            </div>
                            
                            <!-- 场景切换 Toggle -->
                            <div class="flex bg-slate-800/50 p-1 rounded-full w-full max-w-md border border-slate-700">
                                <button onclick="changeFinScenario('cons')" class="flex-1 py-1.5 text-sm font-bold rounded-full transition-all ${scen === 'cons' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}">${t('financials', 'scen_cons')}</button>
                                <button onclick="changeFinScenario('base')" class="flex-1 py-1.5 text-sm font-bold rounded-full transition-all ${scen === 'base' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}">${t('financials', 'scen_base')}</button>
                                <button onclick="changeFinScenario('agg')" class="flex-1 py-1.5 text-sm font-bold rounded-full transition-all ${scen === 'agg' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}">${t('financials', 'scen_agg')}</button>
                            </div>

                            <div class="glass-card p-6 rounded-3xl">
                                <div class="chart-container" style="height: 280px;"><canvas id="finChart"></canvas></div>
                                
                                <div class="mt-6 overflow-x-auto">
                                    <table class="w-full text-sm text-left">
                                        <thead>
                                            <tr class="text-slate-400 border-b border-slate-700">
                                                <th class="pb-2">Year</th>
                                                <th class="pb-2 text-right">2026</th>
                                                <th class="pb-2 text-right">2027</th>
                                                <th class="pb-2 text-right">2028</th>
                                                <th class="pb-2 text-right">2029</th>
                                                <th class="pb-2 text-right">2030</th>
                                            </tr>
                                        </thead>
                                        <tbody class="text-slate-300">
                                            <tr class="border-b border-slate-800">
                                                <td class="py-2 font-bold text-cyan-400">${t('financials', 'chart_rev')}</td>
                                                <td class="py-2 text-right">${d.rev[0].toFixed(1)}</td><td class="py-2 text-right">${d.rev[1].toFixed(1)}</td><td class="py-2 text-right">${d.rev[2].toFixed(1)}</td><td class="py-2 text-right">${d.rev[3].toFixed(1)}</td><td class="py-2 text-right">${d.rev[4].toFixed(1)}</td>
                                            </tr>
                                            <tr class="border-b border-slate-800">
                                                <td class="py-2 font-bold text-slate-500">Net Margin</td>
                                                <td class="py-2 text-right text-slate-500">${d.margin[0]}</td><td class="py-2 text-right text-slate-500">${d.margin[1]}</td><td class="py-2 text-right text-slate-500">${d.margin[2]}</td><td class="py-2 text-right text-slate-500">${d.margin[3]}</td><td class="py-2 text-right text-slate-500">${d.margin[4]}</td>
                                            </tr>
                                            <tr>
                                                <td class="py-2 font-bold text-emerald-400">${t('financials', 'chart_prof')}</td>
                                                <td class="py-2 text-right text-emerald-400 font-bold">${d.prof[0].toFixed(2)}</td><td class="py-2 text-right text-emerald-400 font-bold">${d.prof[1].toFixed(2)}</td><td class="py-2 text-right text-emerald-400 font-bold">${d.prof[2].toFixed(2)}</td><td class="py-2 text-right text-emerald-400 font-bold">${d.prof[3].toFixed(2)}</td><td class="py-2 text-right text-emerald-400 font-bold">${d.prof[4].toFixed(2)}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="glass-card p-6 rounded-3xl border-t-4 border-t-cyan-500">
                                <h3 class="font-bold text-lg text-slate-100 mb-4 flex items-center gap-2">
                                    <i class="fa-solid fa-lightbulb text-cyan-400"></i> ${t('financials', 'assump_t')}
                                </h3>
                                <ul class="space-y-3 text-sm text-slate-400">
                                    <li class="flex gap-2"><i class="fa-solid fa-caret-right text-cyan-600 mt-1"></i> <span>${t('financials', 'assump_1')}</span></li>

                                    </div>
                                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                                        <p class="text-slate-300">${t('financials', 'n_2')}</p>

                                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                                        <p class="text-slate-300">${t('financials', 'n_3')}</p>
                                    </div>
                                </div>
                            </div>

                    </div>`;
                main.innerHTML = html;
                setTimeout(initFinChart, 50);
            }

        // 模态框控制
        function openModal(docId) {
            const modal = document.getElementById('fs-modal');
            const doc = i18n.docs[docId];
            
            document.getElementById('modal-title').innerText = doc.title[state.lang];
            document.getElementById('modal-icon').innerHTML = doc.icon;
            document.getElementById('modal-body').innerHTML = doc.content[state.lang];
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; // Trigger reflow
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-active');
        }

        function closeModal() {
            const modal = document.getElementById('fs-modal');
            modal.classList.remove('modal-active');
            modal.classList.add('modal-enter');
            setTimeout(() => { modal.classList.add('hidden'); }, 400);
        }

        // 图表初始化
        let chartInstance = null;
        let finChartInstance = null;

        function changeFinScenario(scen) {
            state.finScenario = scen;
            switchTab('financials', false);
        }

        function initRadarChart() {
            const ctx = document.getElementById('radarChart');
            if(!ctx) return;
            if(chartInstance) chartInstance.destroy();
            
            Chart.defaults.color = '#94a3b8';
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: i18n.context.r_labels[state.lang],
                    datasets: [
                        { 
                            label: t('context', 'r_d1'), 
                            data: [40, 50, 40, 30, 60], 
                            borderColor: '#64748b', backgroundColor: 'rgba(100,116,139,0.2)',
                            pointBackgroundColor: '#64748b'
                        },
                        { 
                            label: t('context', 'r_d2'), 
                            data: [95, 100, 90, 95, 85], 
                            borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.25)',
                            pointBackgroundColor: '#10b981'
                        }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { 
                        r: { 
                            min: 0, max: 100, 
                            ticks:{display:false},
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { font: { size: 10, weight: 'bold' } }
                        } 
                    }, 
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } 
                }
            });
        }

        function initFinChart() {
            const ctx = document.getElementById('finChart');
            if(!ctx) return;
            if(finChartInstance) finChartInstance.destroy();

            const scen = state.finScenario;
            const d = finData[scen];

            Chart.defaults.color = '#94a3b8';
            finChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['2026', '2027', '2028', '2029', '2030'],
                    datasets: [
                        {
                            label: t('financials', 'chart_rev'),
                            data: d.rev,
                            backgroundColor: 'rgba(14, 165, 233, 0.8)',
                            borderRadius: 4,
                            order: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: t('financials', 'chart_prof'),
                            data: d.prof,
                            type: 'line',
                            borderColor: '#10b981',
                            backgroundColor: '#10b981',
                            borderWidth: 3,
                            pointBackgroundColor: '#020617',
                            pointBorderColor: '#10b981',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            order: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: {
                            type: 'linear', display: true, position: 'left',
                            title: { display: true, text: 'Revenue (M SGD)', color: '#0ea5e9' },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y1: {
                            type: 'linear', display: true, position: 'right',
                            title: { display: true, text: 'Net Profit (M SGD)', color: '#10b981' },
                            grid: { drawOnChartArea: false }
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } } }
                }
            });
        }

        // Init App
        document.addEventListener('DOMContentLoaded', () => { 
            toggleLang('zh'); // 初始化加载中文
        });
        window.addEventListener('resize', () => { 
            if(chartInstance) chartInstance.resize(); 
            if(finChartInstance) finChartInstance.resize();
        });
    </script>
</body>
</html>
