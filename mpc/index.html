 <!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDC MPC Operations Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- PropTypes -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        body {
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; /* 强制无滚动 */
            height: 100vh;
        }

        /* 动态背景网格 */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 90%);
        }

        /* 玻璃态面板 - 更通透 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* 扫描线动画 */
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanner-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            animation: scan 3s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        /* OCP Rack */
        .ocp-rack-frame {
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #334155;
            background: #0f172a;
        }
        .server-sled {
            position: relative;
            background: #1e293b;
            border-bottom: 1px solid #0f172a;
            transition: background-color 0.5s ease;
        }
        .server-led { box-shadow: 0 0 5px currentColor; }

        /* 气流粒子动画 */
        @keyframes flow-x {
            0% { transform: translateX(-10px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(20px); opacity: 0; }
        }
        .airflow-particle {
            position: absolute;
            width: 2px;
            height: 1px;
            background: rgba(255,255,255,0.3);
            animation: flow-x 1s linear infinite;
        }

        /* 全屏闪烁 */
        @keyframes mode-flash {
            0% { opacity: 0; }
            10% { opacity: 0.2; background: white; }
            100% { opacity: 0; }
        }
        .mode-flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            animation: mode-flash 0.3s ease-out forwards;
        }

        .recharts-responsive-container { min-height: 0; } /* 允许图表压缩 */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, ReferenceLine, ComposedChart } = window.Recharts;

        // --- 图标组件 ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name.toLowerCase());
                    iconRef.current.appendChild(i);
                    window.lucide.createIcons({
                        attrs: { width: size, height: size, class: className },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="flex items-center justify-center"></span>;
        };

        // --- 小尺寸仪表 ---
        const MiniGauge = ({ value, label, color }) => {
            const radius = 28;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (value / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center relative">
                    <div className="relative w-16 h-16">
                        <svg className="w-full h-full transform -rotate-90">
                            <circle cx="32" cy="32" r={radius} stroke="#1e293b" strokeWidth="6" fill="transparent" />
                            <circle 
                                cx="32" cy="32" r={radius} 
                                stroke={color} 
                                strokeWidth="6" 
                                fill="transparent" 
                                strokeDasharray={circumference} 
                                strokeDashoffset={strokeDashoffset} 
                                strokeLinecap="round"
                                className="transition-all duration-700 ease-out"
                            />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-xs font-bold font-mono" style={{ color }}>{value}</span>
                        </div>
                    </div>
                    <span className="text-[9px] text-slate-500 font-bold uppercase mt-1 tracking-wider">{label}</span>
                </div>
            );
        };

        // --- OCP 机柜组件 (Enhanced Physics) ---
        const OCPRack = ({ load, temp, pue, cue, wug, mode, theme, t }) => {
            const units = 14; 
            
            // 模拟单个服务器单元的物理状态
            const serverData = useMemo(() => {
                return Array.from({ length: units }).map((_, i) => {
                    const unitId = units - i; // 从上到下编号 14 -> 1
                    
                    // 基础负载分配
                    const isIdle = (i / units) * 100 > load;
                    
                    // 物理模拟：热分层效应 (Thermal Stratification)
                    // PID 模式下，顶部机柜(unitId较大)温度显著升高
                    let unitTemp = parseFloat(temp);
                    let variance = 0;

                    if (!isIdle) {
                        if (mode === 'PID') {
                            // PID: 严重的热分层 + 随机热点
                            const heightPenalty = (unitId / units) * 8; // 顶部热 8度
                            const hotspot = Math.random() > 0.8 ? 10 : 0; // 随机热点
                            variance = heightPenalty + hotspot + (Math.random() * 2);
                        } else if (mode === 'Rule') {
                            // Rule: 中等分层
                            const heightPenalty = (unitId / units) * 4;
                            variance = heightPenalty + (Math.random() * 3);
                        } else {
                            // MPC: 智能导风，温度极其均匀
                            variance = Math.random() * 1.5; 
                        }
                    } else {
                        unitTemp = 24; // 待机温度
                    }

                    const finalTemp = (unitTemp + variance).toFixed(1);
                    
                    // 颜色映射：根据单体温度决定颜色
                    let color = '#1e293b'; // 默认冷
                    if (!isIdle) {
                        if (finalTemp < 50) color = '#064e3b'; // 极佳 (深绿)
                        else if (finalTemp < 60) color = '#1e293b'; // 正常 (蓝灰)
                        else if (finalTemp < 70) color = '#713f12'; // 偏热 (暗橙)
                        else color = '#7f1d1d'; // 过热 (暗红)
                    }

                    return {
                        id: unitId,
                        temp: finalTemp,
                        isIdle,
                        color,
                        isHot: finalTemp > 65
                    };
                });
            }, [load, temp, mode]);

            return (
                <div className="glass-panel p-4 rounded-xl h-full flex flex-col items-center relative overflow-hidden">
                    {/* Metrics Overlay */}
                    <div className="w-full flex justify-between gap-2 mb-2 pb-2 border-b border-slate-700/50 text-[10px]">
                        <div className="flex flex-col items-center">
                            <span className="text-slate-500 font-bold">PUE</span>
                            <span className={`${pue < 1.2 ? 'text-emerald-400' : 'text-slate-200'} font-bold font-mono`}>{pue}</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <span className="text-slate-500 font-bold">CUE</span>
                            <span className="text-blue-400 font-bold font-mono">{cue}</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <span className="text-slate-500 font-bold">WUG</span>
                            <span className="text-cyan-400 font-bold font-mono">{wug}</span>
                        </div>
                    </div>

                    <div className="ocp-rack-frame w-full flex-1 flex flex-col p-[2px] relative rounded-sm bg-black/80">
                        {/* Rack Top Switch */}
                        <div className="h-6 bg-slate-900 border-b border-slate-700 mb-[1px] flex items-center justify-between px-2">
                             <div className="flex gap-1">{[1,2].map(i => <div key={i} className="w-1 h-1 rounded-full bg-green-500 animate-pulse"></div>)}</div>
                             <span className="text-[8px] text-slate-500 font-mono">ToR-SW-01</span>
                        </div>
                        
                        {/* Servers */}
                        <div className="flex-1 flex flex-col gap-[1px] relative z-10 p-1">
                            {serverData.map((unit) => (
                                <div 
                                    key={unit.id} 
                                    className="server-sled flex-1 flex items-center justify-between px-2 transition-colors duration-500"
                                    style={{ backgroundColor: unit.color }}
                                >
                                    <div className="flex items-center gap-2">
                                        <span className="text-[8px] font-mono text-slate-500 w-4">{unit.id}U</span>
                                        {!unit.isIdle && (
                                            <div className={`w-1 h-1 rounded-full animate-pulse ${unit.isHot ? 'bg-red-500' : 'bg-blue-400'}`}></div>
                                        )}
                                    </div>
                                    
                                    {/* 气流动画 (仅工作状态显示) */}
                                    {!unit.isIdle && (
                                        <div className="absolute inset-0 overflow-hidden pointer-events-none opacity-30">
                                            <div className="airflow-particle" style={{ top: '50%', left: '20%', animationDelay: `${Math.random()}s` }}></div>
                                            <div className="airflow-particle" style={{ top: '30%', left: '50%', animationDelay: `${Math.random()}s` }}></div>
                                        </div>
                                    )}

                                    <span className={`text-[9px] font-mono ${unit.isHot ? 'text-red-400 font-bold' : 'text-slate-400'}`}>
                                        {unit.temp}°C
                                    </span>
                                </div>
                            ))}
                        </div>
                        
                        {/* 底部热成像图例 */}
                        <div className="h-2 w-full mt-1 rounded-sm flex text-[8px] text-slate-500 font-mono justify-between px-1 bg-gradient-to-r from-blue-900 via-yellow-900 to-red-900 opacity-50">
                            <span>20°C</span>
                            <span>80°C</span>
                        </div>

                        {mode === 'MPC' && <div className="scanner-bar" style={{ background: theme.primary, boxShadow: `0 0 10px ${theme.primary}`, opacity: 0.5 }}></div>}
                    </div>
                    
                    <div className="mt-2 w-full flex justify-between text-[9px] text-slate-500 font-mono">
                        <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-900"></div> {t.rack.intake}</div>
                        <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-red-900"></div> {t.rack.exhaust}</div>
                    </div>
                </div>
            );
        };

        const THEME = {
            MPC: { primary: '#3b82f6', bg: 'rgba(59, 130, 246, 0.05)', grid: 'rgba(59, 130, 246, 0.1)', icon: 'Cpu' },
            PID: { primary: '#f59e0b', bg: 'rgba(245, 158, 11, 0.05)', grid: 'rgba(245, 158, 11, 0.1)', icon: 'Activity' },
            Rule: { primary: '#10b981', bg: 'rgba(16, 185, 129, 0.05)', grid: 'rgba(16, 185, 129, 0.1)', icon: 'Scale' }
        };

        const Dashboard = () => {
            const [lang, setLang] = useState('zh');
            const [mode, setMode] = useState('MPC');
            const [load, setLoad] = useState(45);
            const [time, setTime] = useState(0);
            const [history, setHistory] = useState([]);
            const [flash, setFlash] = useState(false); 
            const theme = THEME[mode];

            // 翻译字典 - 覆盖所有 UI 文本
            const translations = {
                zh: {
                    title: "AIDC 智算控制台",
                    subtitle: "MPC 策略神经中枢",
                    header: {
                        online: "在线",
                        region: "新加坡-西部-1"
                    },
                    controller: "控制器",
                    inputLoad: "负载输入",
                    kpi: {
                        chipTemp: "芯片温度",
                        headroom: "热冗余",
                        itPower: "IT功耗",
                        cooling: "制冷功耗"
                    },
                    charts: {
                        realtime: "实时动态",
                        log: "系统日志",
                        listening: "系统初始化完成。正在监听端口 8080...",
                        logPrefix: {
                            mpc: ">> 优化器：",
                            pid: ">> 警告：",
                            rule: ">> 规则："
                        }
                    },
                    rack: {
                        intake: "冷通道",
                        exhaust: "热通道"
                    },
                    labels: {
                        compute: "算力",
                        pump: "泵速"
                    },
                    logs: {
                        mpc: "检测到未来180s负载尖峰。预冷程序已启动...",
                        pid: "温度偏差 > 2.5。被动响应滞后，尝试积分补偿。",
                        rule: "触发阈值 55°C。执行强制切换逻辑。"
                    },
                    modeStatus: {
                        MPC: ">> AI 预测模型已激活",
                        PID: ">> 被动反馈回路已激活",
                        Rule: ">> 静态逻辑已激活"
                    },
                    modes: {
                        MPC: "模型预测",
                        PID: "PID控制",
                        Rule: "规则逻辑"
                    }
                },
                en: {
                    title: "AIDC OPERATIONS",
                    subtitle: "Neural Strategy Hub",
                    header: {
                        online: "ONLINE",
                        region: "SG-WEST-1"
                    },
                    controller: "Controller",
                    inputLoad: "Input Load",
                    kpi: {
                        chipTemp: "CHIP TEMP",
                        headroom: "HEADROOM",
                        itPower: "IT POWER",
                        cooling: "COOLING"
                    },
                    charts: {
                        realtime: "Realtime Dynamics",
                        log: "System Log",
                        listening: "Systemd initialized. Listening on port 8080...",
                        logPrefix: {
                            mpc: ">> OPTIMIZER: ",
                            pid: ">> WARNING: ",
                            rule: ">> RULE: "
                        }
                    },
                    rack: {
                        intake: "COLD AISLE",
                        exhaust: "HOT AISLE"
                    },
                    labels: {
                        compute: "COMPUTE",
                        pump: "PUMP"
                    },
                    logs: {
                        mpc: "Look-ahead window 180s. Pre-cooling...",
                        pid: "Error deviation > 2.5. Integral windup.",
                        rule: "Threshold 55C triggered. Hard switch."
                    },
                    modeStatus: {
                        MPC: ">> AI Predictive Model Active",
                        PID: ">> Reactive Loop Active",
                        Rule: ">> Static Logic Active"
                    },
                    modes: {
                        MPC: "MPC Model",
                        PID: "PID Loop",
                        Rule: "Rule Logic"
                    }
                }
            };

            const t = translations[lang];

            // Simulation Logic
            const currentTemp = useMemo(() => {
                const base = 48 + (load * 0.28);
                const noise = (Math.random() - 0.5) * 1.5;
                let offset = 0;
                if (mode === 'PID') { offset = 8 * Math.sin(time / 2.5) + noise * 2; if (load > 70) offset += 5; }
                else if (mode === 'Rule') { const step = Math.floor(time / 5); offset = (step % 2 === 0 ? 4 : -4) + noise * 0.5; }
                else { offset = Math.sin(time / 10) * 1.2; }
                return (base + offset).toFixed(1);
            }, [load, mode, time]);

            const itPower = (load * 2.5).toFixed(1);
            const pue = (1 + (mode === 'MPC' ? 0.15 : 0.35)).toFixed(2);
            const cue = (parseFloat(pue) * 0.42).toFixed(2);
            const wug = (mode === 'MPC' ? 0.35 + (load/200) : 0.65 + (load/150)).toFixed(2);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(prev => prev + 1);
                    setHistory(prev => {
                        const next = [...prev, { time, temp: parseFloat(currentTemp), target: 50 }];
                        if (next.length > 60) next.shift();
                        return next;
                    });
                }, 800);
                return () => clearInterval(timer);
            }, [currentTemp, time]);

            const handleModeChange = (newMode) => {
                if (newMode === mode) return;
                setFlash(true);
                setMode(newMode);
                setTimeout(() => setFlash(false), 300);
            };

            return (
                <div className="h-screen w-screen p-3 text-slate-200 relative overflow-hidden flex flex-col gap-3">
                    <div className="bg-grid" style={{ backgroundImage: `linear-gradient(to right, ${theme.grid} 1px, transparent 1px), linear-gradient(to bottom, ${theme.grid} 1px, transparent 1px)` }}></div>
                    {flash && <div className="mode-flash-overlay"></div>}

                    {/* --- COMPACT HEADER --- */}
                    <header className="glass-panel rounded-xl px-4 py-2 flex justify-between items-center shrink-0 z-20 h-14">
                        <div className="flex items-center gap-3">
                            <Icon name="Server" size={20} className="text-white" />
                            <div>
                                <h1 className="text-base font-bold tracking-tight text-white leading-tight">{t.title}</h1>
                                <p className="text-[10px] text-slate-400 font-mono uppercase tracking-wider">{t.subtitle}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 text-[10px] font-mono">
                            <div className="flex items-center gap-2">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span className="text-emerald-400">{t.header.online}</span>
                            </div>
                            <span className="text-slate-600">|</span>
                            <span>{t.header.region}</span>
                            <button 
                                onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                                className="ml-4 px-2 py-1 border border-slate-700 rounded hover:bg-white/10 transition-colors"
                            >
                                {lang === 'zh' ? 'EN' : '中文'}
                            </button>
                        </div>
                    </header>

                    {/* --- MAIN CONTENT (GRID) --- */}
                    <div className="flex-1 grid grid-cols-12 gap-3 min-h-0">
                        
                        {/* LEFT: Controls & Gauges (Compact) */}
                        <div className="col-span-3 flex flex-col gap-3 h-full">
                            
                            {/* 1. Compact Mode Selector (Corner) */}
                            <section className="glass-panel p-3 rounded-xl flex flex-col gap-2">
                                <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">{t.controller}</h3>
                                <div className="grid grid-cols-3 gap-1">
                                    {['PID', 'Rule', 'MPC'].map(m => (
                                        <button
                                            key={m}
                                            onClick={() => handleModeChange(m)}
                                            className={`flex flex-col items-center justify-center py-2 rounded-lg border transition-all duration-200 ${mode === m ? 'bg-white/10 border-transparent shadow-inner' : 'border-slate-800 hover:bg-white/5'}`}
                                            style={mode === m ? { color: THEME[m].primary } : { color: '#64748b' }}
                                        >
                                            <Icon name={THEME[m].icon} size={16} />
                                            <span className="text-[9px] font-bold mt-1">{t.modes[m]}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="text-[10px] mt-1 h-8 leading-tight opacity-70 px-1" style={{ color: theme.primary }}>
                                    {t.modeStatus[mode]}
                                </div>
                            </section>

                            {/* 2. Load Input & Gauges */}
                            <section className="glass-panel p-4 rounded-xl flex-1 flex flex-col items-center justify-center gap-6">
                                <div className="w-full">
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase">{t.inputLoad}</label>
                                        <span className="text-2xl font-mono font-bold" style={{ color: theme.primary }}>{load}%</span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="100" value={load} 
                                        onChange={(e) => setLoad(parseInt(e.target.value))}
                                        className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                                        style={{ accentColor: theme.primary }}
                                    />
                                </div>
                                <div className="flex gap-4 justify-center w-full">
                                    <MiniGauge value={load} label={t.labels.compute} color={theme.primary} />
                                    <MiniGauge value={mode==='MPC'?Math.min(100, load+10):Math.min(100, load*1.5)} label={t.labels.pump} color={mode==='PID'?'#ef4444':'#10b981'} />
                                </div>
                            </section>
                        </div>

                        {/* CENTER: Charts (KPIs + Split View) */}
                        <div className="col-span-6 flex flex-col gap-3 h-full">
                            
                            {/* KPI Strip */}
                            <div className="grid grid-cols-4 gap-3 h-20 shrink-0">
                                {[
                                    { l: t.kpi.chipTemp, v: currentTemp, u: "°C", c: parseFloat(currentTemp)>60 ? (mode==='PID'?'text-red-400':'text-yellow-400') : 'text-slate-200' },
                                    { l: t.kpi.headroom, v: (85-parseFloat(currentTemp)).toFixed(1), u: "°C", c: "text-blue-300" },
                                    { l: t.kpi.itPower, v: itPower, u: "kW", c: "text-slate-200" },
                                    { l: t.kpi.cooling, v: (parseFloat(itPower)*(pue-1)).toFixed(1), u: "kW", c: "text-slate-400" },
                                ].map((k,i) => (
                                    <div key={i} className="glass-panel rounded-xl flex flex-col justify-center items-center relative overflow-hidden">
                                        <div className="text-[9px] text-slate-500 font-bold uppercase">{k.l}</div>
                                        <div className={`text-lg font-mono font-bold ${k.c}`}>{k.v}<span className="text-[10px] ml-1 text-slate-600">{k.u}</span></div>
                                    </div>
                                ))}
                            </div>

                            {/* Charts Container */}
                            <div className="flex-1 flex flex-col gap-3 min-h-0">
                                {/* Top Chart: Realtime */}
                                <section className="glass-panel p-3 rounded-xl flex-1 min-h-0 flex flex-col relative overflow-hidden" style={{ borderColor: `${theme.primary}30` }}>
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-2 shrink-0">
                                        <Icon name="Activity" size={12} className={theme.primary} /> {t.charts.realtime}
                                    </h3>
                                    <div className="flex-1 min-h-0">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={history}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" opacity={0.3} />
                                                <XAxis dataKey="time" hide />
                                                <YAxis domain={[40, 70]} hide />
                                                <Tooltip contentStyle={{ backgroundColor: '#020617', borderColor: theme.primary, borderRadius: '4px', fontSize: '10px' }} />
                                                <Line type={mode === 'Rule' ? "stepAfter" : "monotone"} dataKey="temp" stroke={theme.primary} strokeWidth={2} dot={false} isAnimationActive={false} />
                                                <ReferenceLine y={50} stroke="#475569" strokeDasharray="5 5" />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </section>

                                {/* Bottom Chart: Prediction / Log */}
                                <section className="glass-panel p-3 rounded-xl h-1/3 shrink-0 flex flex-col relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full" style={{ backgroundColor: theme.primary, opacity: 0.5 }}></div>
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase mb-2 flex items-center gap-2 shrink-0">
                                        <Icon name="Terminal" size={12} /> {t.charts.log}
                                    </h3>
                                    <div className="font-mono text-[10px] leading-relaxed opacity-80 overflow-hidden">
                                        <div className="text-slate-500">{t.charts.listening} [OK]</div>
                                        <AnimatePresence mode="wait">
                                            <motion.div 
                                                key={mode + lang} 
                                                initial={{ opacity: 0, x: -5 }} 
                                                animate={{ opacity: 1, x: 0 }} 
                                                className="mt-1"
                                                style={{ color: theme.primary }}
                                            >
                                                {t.charts.logPrefix[mode.toLowerCase()] + t.logs[mode.toLowerCase()]}
                                            </motion.div>
                                        </AnimatePresence>
                                    </div>
                                </section>
                            </div>
                        </div>

                        {/* RIGHT: Digital Twin (Rack) */}
                        <div className="col-span-3 h-full">
                            <OCPRack load={load} temp={currentTemp} pue={pue} cue={cue} wug={wug} mode={mode} theme={theme} t={t} />
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
