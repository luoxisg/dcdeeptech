    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&family=Noto+Serif+SC:wght@500;700&display=swap');

        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary-mpc: #3b82f6; 
            --primary-pid: #f59e0b; 
        }

        body {
            background-color: #020617;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-serif { font-family: 'Noto Serif SC', serif; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: border-color 0.5s ease;
        }

        /* Engineering Grid Background */
        .bg-grid {
            background-size: 40px 40px;

        .arrow-right {
            display: inline-block;
            width: 0; 
            height: 0; 
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #64748b;
            margin: 0 8px;
        }

        /* Visual Linkage Animations */
        .kpi-glow-mpc {
            animation: kpi-pulse-blue 1.5s ease-out forwards;
            border-color: rgba(59, 130, 246, 0.6) !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }

        @keyframes kpi-pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { ComposedChart, Line, Area, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ResponsiveContainer, Legend } = window.Recharts;

        // --- ENGINEERING CONSTANTS ---
        const PHYSICS_MODEL = {
            PSU_EFFICIENCY: 0.95,
            NON_IT_LOAD_KW: 6.0,
            THERMAL_RESISTANCE: 0.22,
            CARBON_INTENSITY: 0.45,
            WATER_USAGE_INTENSITY: 1.8, // L/kWh (Scenario assumption)
            MIN_SUPPLY_TEMP: 16.0,
            MAX_SUPPLY_TEMP: 30.0,
            BASELINE_TEMP: 18.0,
            GLOBAL_LIMIT_TEMP: 65.0 // Single Source of Truth for Limit
        };

        // --- I18N STRINGS ---
        const I18N = {
            en: {
                title: "AIDC Thermal Control Paradigm",
                subtitle: "Constraint-Aware Setpoint Optimization (MPC) vs Fixed Baseline (PID)",
                instance: "Representative Instance: GB200 NVL72 Class High-Density Rack",
                // L1 Labels
                l1: {
                    control: "Control Variable (T_supply)",
                    constraint: "Constraint (T_chip)",
                    objective: "Objective (PUE)"
                },
                // L2 Labels
                l2: {
                    cue: "CUE (Derived)",
                    margin: "Margin Utilized"
                },
                // L3 Labels
                l3: {
                    variance: "Setpoint Variance (σ)",
                    effort: "Control Effort"
                },
                // L4 Labels
                l4: {
                    wue: "WUE (Scenario)",
                    carbon: "Grid Emission Factor"
                },
                profReqTitle: "Control Strategy Validation",
                // Animated Steps
                validationSteps: [
                    { icon: "ShieldCheck", text: "Fixed IT load and thermal safety constraints enforced." },
                    { icon: "Sliders", text: "MPC performs dynamic setpoint optimization on supply water temperature (T_supply)." },
                    { icon: "TrendingDown", text: (delta) => `Energy-optimal operation achieved with measurable PUE reduction (ΔPUE ≈ -${delta}%).` }
                ],
                sections: {
                    input: "System Inputs (Disturbance)",
                    boundary: "Boundary Conditions",
                    advanced: "Advanced Telemetry & Assumptions",
                    charts: "System Trajectory"
                },
                labels: {
                    itPower: "IT Workload Power",
                    chipLimit: "Constraint: T_max",
                    baseTemp: "Baseline: T_supply",
                    trace: {
                        opt: "Derived from T_supply optimization",
                        load: "Computed under identical IT load"
                    }
                },
                chartAxis: {
                    chip: "Chip Temp (°C)",
                    supply: "Supply Temp (°C)",
                    limit: "MAX LIMIT"
                },
                twin: {
                    title: "DIGITAL TWIN",
                    state: "STATE",
                    active: "ACTIVE"
                },
                report: {
                    btn: "Generate Review Memo",
                    title: "Technical Review Memorandum",
                    // STRICT ACADEMIC TITLES - NO UNDEFINED
                    titles: {
                        prob: "1. Problem Formulation: Setpoint Optimization under Thermal Safety Constraints",
                        baseline: "2. Counterfactual Baseline Analysis (PID vs. MPC)",
                        trace: "3. Traceability, Assumptions, and System Constants"
                    },
                    content: {
                        prob_vars: {
                            u: "Control Variable: Supply Water Temperature ($T_{supply}$)",
                            y: "Constraint Variable: Chip Junction Temperature ($T_{chip} \\le 65^\\circ\\mathrm{C}$)",
                            j: "Objective Function: Minimize Cooling Energy ($PUE$) s.t. $T_{chip}(k) \\le T_{limit}$"
                        },
                        prob_summary: "Under fixed operating demand (IT load treated as an exogenous input) and strict thermal safety constraints ($T_{chip} \\le T_{limit}$), the MPC controller performs dynamic setpoint optimization on the supply water temperature ($T_{supply}$). By converting conservative thermal safety margins into controllable degrees of freedom, the system transitions from fixed, conservative operation (PID baseline at $18^\\circ\\mathrm{C}$) to energy-optimal operation, resulting in a measurable reduction in system PUE under identical load conditions.",
                        comp_intro: "To isolate the efficacy of the control algorithm from environmental variances, we perform a counterfactual baseline evaluation. The PID baseline represents standard industry practice (fixed supply temperature at 18°C) applied to the exact same IT load profile and physical model as the MPC experiment."
                    }
                },
                langSwitch: "中文" 
            },
            zh: {
                title: "AIDC 热控制范式研究",
                subtitle: "基于约束的设定点优化 (MPC) vs 固定基线 (PID)",
                instance: "代表性实例：GB200 NVL72 级高密度机柜",
                // L1 Labels
                l1: {
                    control: "控制变量 (供水温度)",
                    constraint: "约束变量 (芯片结温)",
                    objective: "优化目标 (PUE)"
                },
                // L2 Labels
                l2: {
                    cue: "CUE (衍生指标)",
                    margin: "裕量利用率"
                },
                // L3 Labels
                l3: {
                    variance: "设定点方差 (σ)",
                    effort: "控制动作量"
                },
                // L4 Labels
                l4: {
                    wue: "WUE (情景假设)",
                    carbon: "电网碳因子"
                },
                profReqTitle: "控制策略有效性验证",
                // Animated Steps
                validationSteps: [
                    { icon: "ShieldCheck", text: "已强制执行固定 IT 负载与热安全约束。" },
                    { icon: "Sliders", text: "MPC 对供水温度 (T_supply) 执行动态设定点优化。" },
                    { icon: "TrendingDown", text: (delta) => `实现能效最优运行，PUE 显著降低 (ΔPUE ≈ -${delta}%)。` }
                ],
                sections: {
                    input: "系统输入 (扰动变量)",
                    boundary: "边界条件 (敏感性分析)",
                    advanced: "高级遥测与假设验证",
                    charts: "系统轨迹与约束边界"
                },
                labels: {
                    itPower: "IT 算力负载 (输入)",
                    chipLimit: "约束条件: T_max",
                    baseTemp: "基线设定: T_supply",
                    trace: {
                        opt: "源于供水温度动态优化",
                        load: "基于完全相同的IT负载计算"
                    }
                },
                chartAxis: {
                    chip: "芯片结温 (°C)",
                    supply: "供水温度 (°C)",
                    limit: "安全红线"
                },
                twin: {
                    title: "数字孪生体",
                    state: "运行状态",
                    active: "在线"
                },
                report: {
                    btn: "生成评审备忘录",
                    title: "技术评审备忘录",
                    // STRICT ACADEMIC TITLES
                    titles: {
                        prob: "1. 问题阐述：热安全约束下的设定点优化",
                        baseline: "2. 反事实基线分析 (PID vs. MPC)",
                        trace: "3. 可追溯性、假设与系统常数"
                    },
                    content: {
                        prob_vars: {
                            u: "控制变量：供水温度 ($T_{supply}$)",
                            y: "约束变量：芯片结温 ($T_{chip} \\le 65^\\circ\\mathrm{C}$)",
                            j: "目标函数：最小化能耗 ($PUE$) s.t. $T_{chip}(k) \\le T_{limit}$"
                        },
                        prob_summary: "在满足芯片热安全约束（$T_{chip} \\le T_{limit}$）与运行需求（IT负载给定）的前提下，MPC 对供水温度 $T_{supply}$ 进行动态优化。通过将保守的热安全冗余转化为可控的自由度，系统从固定的保守运行模式（PID 基线 $18^\\circ\\mathrm{C}$）转变为能效最优运行模式，从而在相同负载条件下实现可量化的 PUE 降低。",
                        comp_intro: "为了将控制算法的效能与环境变化隔离，我们执行了反事实基线评估。PID 基线代表了应用于与 MPC 实验完全相同的 IT 负载曲线和物理模型的标准工业实践（固定供水温度 18°C）。"
                    }
                },
                langSwitch: "EN" 
            }
        };

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name.toLowerCase());
                    ref.current.appendChild(i);
                    window.lucide.createIcons({ nameAttr: 'data-lucide', attrs: {width: size, height: size, class: className} });
                }
            }, [name, size, className]);
            return <span ref={ref} className="flex items-center justify-center"></span>;
        };

        // --- PHYSICS ENGINE ---
        const calcPUE = (itKW, rackKW, supplyC) => {
            const baseCOP = 4.0; 
            const cop = baseCOP * (1 + (supplyC - 18) * 0.035);
            const coolingKW = (rackKW * 0.98) / cop; 
            return (rackKW + coolingKW) / itKW;
        };

        const calcChipTemp = (supplyC, rackKW) => {
            const heatLoadKW = rackKW * 0.98;
            return supplyC + (heatLoadKW * PHYSICS_MODEL.THERMAL_RESISTANCE) + 2.0;
        };

        // --- COMPONENT: L1 METRIC CARD ---
        const L1Metric = ({ label, value, unit, color, isMpcActive, traceLabel }) => (
            <div className={`relative flex flex-col items-center justify-center p-3 rounded-lg border transition-all duration-700 ${isMpcActive && color !== 'text-slate-200' ? 'kpi-glow-mpc border-blue-500/50' : 'border-white/10 bg-slate-800/30'}`}>
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">{label}</span>
                <div className={`text-2xl font-mono font-bold ${color || 'text-white'}`}>
                    {value} <span className="text-xs text-slate-500 font-normal">{unit}</span>
                </div>
                {/* Traceability Tag */}
                {traceLabel && (
                    <div className="absolute -bottom-6 w-full text-center opacity-0 transition-opacity duration-300 group-hover:opacity-100 text-[9px] text-slate-500 italic">
                        {traceLabel}
                    </div>
                )}
            </div>
        );

        // --- COMPONENT: L2 METRIC ROW ---
        const L2Metric = ({ label, value, unit, isMpcActive }) => (
            <div className={`flex justify-between items-center text-xs border-b border-white/5 py-1 last:border-0 transition-colors duration-500 ${isMpcActive ? 'text-blue-200' : 'text-slate-500'}`}>
                <span>{label}</span>
                <span className="font-mono">{value} {unit}</span>
            </div>
        );

        // --- COMPONENT: ANIMATED VALIDATION STEP ---
        const ValidationStep = ({ icon, text, delay, visible }) => {
            const [show, setShow] = useState(false);
            
            useEffect(() => {
                let timer;
                if (visible) {
                    timer = setTimeout(() => setShow(true), delay);
                } else {
                    setShow(false);
                }
                return () => clearTimeout(timer);
            }, [visible, delay]);

            return (
                <div className={`flex items-start gap-3 transition-all duration-500 ease-out transform ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'}`}>
                    <div className="mt-0.5 text-emerald-400 shrink-0">
                        <Icon name={icon} size={14} />
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                        {text}
                    </p>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [mode, setMode] = useState('MPC');
            const [showAdvanced, setShowAdvanced] = useState(false);
            const [showSummary, setShowSummary] = useState(true);
            
            // --- STATE VECTORS ---
            const [inputs, setInputs] = useState({
                itPowerKW: 85.0,
                safetyLimitC: PHYSICS_MODEL.GLOBAL_LIMIT_TEMP,
                baselineTempC: PHYSICS_MODEL.BASELINE_TEMP
            });

            const [state, setState] = useState({
                supplyTempC: 18.0,
                chipTempC: 45.0,
                rackPowerKW: 95.0,
                pue: 1.45,
                cue: 0.6,
                wue: 1.8,
                margin: 20.0,
                deltaPue: 0.0,
                variance: 0.0,
                effort: 0.0,
                history: []
            });

            const t = I18N[lang];

            // Effect: Sequence the Text Appearance
            useEffect(() => {
                if (mode === 'MPC') {
                    setShowSummary(true);
                } else {
                    setShowSummary(false);
                }
            }, [mode]);

            // --- MAIN SIMULATION LOOP (1Hz) ---
            useEffect(() => {
                const tick = setInterval(() => {
                    setState(prev => {
                        const rackKW = (inputs.itPowerKW / PHYSICS_MODEL.PSU_EFFICIENCY) + PHYSICS_MODEL.NON_IT_LOAD_KW;
                        const heatLoadKW = rackKW * 0.98;

                        // Baseline Calculation (Counterfactual)
                        const baselineSupply = PHYSICS_MODEL.BASELINE_TEMP;
                        const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply);

                        let nextSupply = prev.supplyTempC;

                        if (mode === 'PID') {
                            const err = inputs.baselineTempC - prev.supplyTempC;
                            nextSupply = prev.supplyTempC + (err * 0.2); 
                        } else {
                            const SAFE_MARGIN = 2.5; 
                            const maxFeasibleChip = inputs.safetyLimitC - SAFE_MARGIN;
                            const deltaT = (heatLoadKW * PHYSICS_MODEL.THERMAL_RESISTANCE) + 2.0;
                            let optimalSupply = maxFeasibleChip - deltaT;

                            // Clamp
                            optimalSupply = Math.max(PHYSICS_MODEL.MIN_SUPPLY_TEMP, Math.min(PHYSICS_MODEL.MAX_SUPPLY_TEMP, optimalSupply));

                            // Actuator Dynamics
                            nextSupply = prev.supplyTempC * 0.6 + optimalSupply * 0.4;
                        }

                        const nextChip = calcChipTemp(nextSupply, rackKW);
                        const nextPUE = calcPUE(inputs.itPowerKW, rackKW, nextSupply);
                        
                        // L2 Metrics
                        const nextCUE = nextPUE * PHYSICS_MODEL.CARBON_INTENSITY;
                        const nextMargin = inputs.safetyLimitC - nextChip;
                        const deltaPuePct = ((baselinePUE - nextPUE) / baselinePUE * 100).toFixed(1);

                        // L3 Metrics
                        const diff = nextSupply - prev.supplyTempC;
                        const nextEffort = Math.abs(diff); 
                        const nextVar = prev.variance * 0.9 + (diff * diff) * 0.1;

                        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
                        const newHistory = [...prev.history, {
                            time: now,
                            chip: nextChip,
                            supply: nextSupply,
                            limit: inputs.safetyLimitC,
                            baseline: inputs.baselineTempC
                        }].slice(-60);

                        return {
                            supplyTempC: nextSupply,
                            chipTempC: nextChip,
                            rackPowerKW: rackKW,
                            pue: nextPUE,
                            cue: nextCUE,
                            wue: nextPUE * PHYSICS_MODEL.WATER_USAGE_INTENSITY, 
                            margin: nextMargin,
                            deltaPue: deltaPuePct,
                            variance: Math.sqrt(nextVar),
                            effort: nextEffort,
                            history: newHistory
                        };
                    });
                }, 800);
                return () => clearInterval(tick);
            }, [inputs, mode, lang]);

            // --- REPORT GENERATOR ---
            const generateMemo = () => {
                const w = window.open('', '_blank');
                
                const rackKW = (inputs.itPowerKW / PHYSICS_MODEL.PSU_EFFICIENCY) + PHYSICS_MODEL.NON_IT_LOAD_KW;
                
                // Explicit Counterfactual Calculation
                const baselineSupply = PHYSICS_MODEL.BASELINE_TEMP; // 18C fixed
                const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply);
                const baselineChip = calcChipTemp(baselineSupply, rackKW);
                
                const actualSupply = state.supplyTempC;
                const actualPUE = state.pue;
                const actualChip = state.chipTempC;

                const pueSaving = ((baselinePUE - actualPUE) / baselinePUE * 100).toFixed(2);
                
                // KaTeX scripts - Only loaded in Report Window
                const katexHead = `
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"><\/script>
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"><\/script>
                `;

                // Self-Checking Export Script
                const exportScript = `
                    <script>
                        function renderMath() {
                            if(window.renderMathInElement) {
                                renderMathInElement(document.body, {
                                    delimiters: [
                                        { left: "$$", right: "$$", display: true },
                                        { left: "\\\\(", right: "\\\\)", display: false },
                                        { left: "$", right: "$", display: false }
                                    ],
                                    throwOnError: false
                                });
                            }
                        }

                        async function prepareForExport() {
                            let attempts = 0;
                            while(!window.renderMathInElement && attempts < 50) {
                                await new Promise(r => setTimeout(r, 100));
                                attempts++;
                            }
                            renderMath();
                            if (document.fonts && document.fonts.ready) await document.fonts.ready;
                            await new Promise(r => setTimeout(r, 800));

                            const content = document.body.innerText;
                            if (content.match(/\\\\(circ|mathrm|eta|le|Delta|approx)/)) {
                                const msg = "${lang}" === 'zh' 
                                    ? "导出中断：检测到未渲染的数学公式代码。\\n请检查网络连接是否允许加载 KaTeX 库。" 
                                    : "Export Halted: Unrendered LaTeX code detected.\\nPlease check if network allows loading KaTeX.";
                                alert(msg);
                                throw new Error("Self-check failed: Unrendered LaTeX");
                            }
                        }

                        window.onload = () => {
                            prepareForExport().then(() => {
                                window.print();
                            }).catch(e => {
                                console.error("Export failed:", e);
                            });
                        };
                    <\/script>
                `;

                const html = `
                    <!DOCTYPE html>
                    <html lang="${lang}">
                    <head>
                        <title>${t.report.title}</title>
                        ${katexHead}
                        <style>
                            body { font-family: 'Noto Serif SC', serif; padding: 40px; color: #1e293b; max-width: 800px; margin: 0 auto; line-height: 1.5; }
                            h1 { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 5px; font-size: 24px; }
                            .meta { color: #64748b; font-family: monospace; font-size: 0.9em; margin-bottom: 30px; }
                            h2 { margin-top: 30px; font-size: 18px; border-left: 4px solid #3b82f6; padding-left: 10px; background: #f8fafc; }
                            table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9em; }
                            th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
                            th { background: #f1f5f9; }
                            .highlight { font-weight: bold; color: #1e40af; }
                            .mono { font-family: monospace; }
                            .summary-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 4px; margin-bottom: 20px; color: #1e3a8a; font-size: 0.95em; }
                            ul { padding-left: 20px; }
                            li { margin-bottom: 5px; }
                        </style>
                    </head>
                    <body>
                        <h1>${t.report.title}</h1>
                        <div class="meta">
                            DATE: ${new Date().toISOString().split('T')[0]}<br/>
                            SUBJECT: ${t.instance}<br/>
                            ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}
                        </div>

                        <h2>${t.report.titles.prob}</h2>
                        <ul>
                            <li><strong>${t.report.content.prob_vars.u}</strong></li>
                            <li><strong>${t.report.content.prob_vars.y}</strong></li>
                            <li><strong>${t.report.content.prob_vars.j}</strong></li>
                        </ul>
                        <div class="summary-box">
                            ${t.report.content.prob_summary}
                        </div>

                        <h2>${t.report.titles.baseline}</h2>
                        <p>${t.report.content.comp_intro}</p>
                        <p>($P_{IT} = ${inputs.itPowerKW.toFixed(1)}$ kW, $T_{baseline} = ${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$)</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Parameter</th>
                                    <th>PID Baseline (Counterfactual)</th>
                                    <th>MPC (Actual)</th>
                                    <th>Delta</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Setpoint ($T_{supply}$)</td>
                                    <td>$${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td class="highlight">$${actualSupply.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>$${(actualSupply - baselineSupply).toFixed(1)}^\\circ\\mathrm{C}$</td>
                                </tr>
                                <tr>
                                    <td>Chip Temp ($T_{chip}$)</td>
                                    <td>$${baselineChip.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>$${actualChip.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>Margin Utilized</td>
                                </tr>
                                <tr>
                                    <td><strong>System PUE</strong></td>
                                    <td>${baselinePUE.toFixed(3)}</td>
                                    <td class="highlight">${actualPUE.toFixed(3)}</td>
                                    <td><strong>-${pueSaving}%</strong></td>
                                </tr>
                            </tbody>
                        </table>

                        <h2>${t.report.titles.trace}</h2>
                        <div class="mono" style="background:#f8fafc; padding:10px; border:1px solid #e2e8f0; font-size:0.8em;">
                            # SYSTEM CONSTANTS<br/>
                            $\\eta_{PSU} = ${PHYSICS_MODEL.PSU_EFFICIENCY}$<br/>
                            $R_{th} = ${PHYSICS_MODEL.THERMAL_RESISTANCE} \\; \\mathrm{K/kW}$<br/>
                            $P_{facility} = ${PHYSICS_MODEL.NON_IT_LOAD_KW} \\; \\mathrm{kW}$<br/>
                            <br/>
                            # BOUNDARY CONDITIONS<br/>
                            $T_{limit} = ${inputs.safetyLimitC}^\\circ\\mathrm{C}$<br/>
                            $T_{baseline} = ${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$<br/>
                            $P_{IT} = ${inputs.itPowerKW} \\; \\mathrm{kW}$
                        </div>

                        ${exportScript}
                    </body>
                    </html>
                `;
                w.document.write(html);
                w.document.close();
            };

            return (
                <div className="flex flex-col h-screen p-4 gap-4">
                    {/* HEADER */}
                    <header className="glass-panel p-4 rounded-xl flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-blue-900/30 rounded-lg text-blue-400">
                                <Icon name="Activity" size={24} />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight text-white">{t.title}</h1>
                                <div className="flex items-center gap-2 text-xs text-slate-400 font-mono">
                                    <span className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700">VER 5.5 (Staged)</span>
                                    <span>{t.instance}</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                <button onClick={() => setMode('PID')} className={`px-4 py-1.5 rounded text-xs font-bold ${mode==='PID' ? 'bg-amber-600 text-white' : 'text-slate-400'}`}>PID</button>
                                <button onClick={() => setMode('MPC')} className={`px-4 py-1.5 rounded text-xs font-bold ${mode==='MPC' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>MPC</button>
                            </div>
                            <button onClick={() => setLang(l => l==='en'?'zh':'en')} className="px-3 py-1.5 border border-slate-700 rounded text-xs text-slate-400 font-mono hover:text-white">
                                {t.langSwitch}
                            </button>
                        </div>
                    </header>

                    {/* ANIMATED PROFESSOR REQUIREMENT BLOCK */}
                    <div className={`glass-panel p-3 rounded-xl border-l-4 border-blue-500 bg-blue-900/10 shrink-0 transition-all duration-500 ${showSummary ? 'opacity-100 max-h-40' : 'opacity-0 max-h-0 overflow-hidden py-0'}`}>
                        <h4 className="text-xs font-bold text-blue-400 mb-2">{t.profReqTitle}</h4>
                        <div className="space-y-1.5">
                            {t.validationSteps.map((step, idx) => (
                                <ValidationStep 
                                    key={idx} 
                                    icon={step.icon} 
                                    text={typeof step.text === 'function' ? step.text(state.deltaPue) : step.text}
                                    delay={idx * 600}
                                    visible={showSummary}
                                />
                            ))}
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 grid grid-cols-12 gap-4 min-h-0">
                        
                        {/* LEFT: CONTROLS & HIERARCHICAL METRICS */}
                        <div className="col-span-3 flex flex-col gap-4 overflow-y-auto">
                            
                            {/* Inputs (Disturbance) */}
                            <section className="glass-panel p-4 rounded-xl">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-4 border-b border-white/10 pb-2">{t.sections.input}</h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1 text-slate-300">
                                            <span>{t.labels.itPower}</span>
                                            <span className="font-mono">{inputs.itPowerKW.toFixed(0)} kW</span>
                                        </div>
                                        <input 
                                            type="range" min="50" max="130" step="1" 
                                            value={inputs.itPowerKW}
                                            onChange={(e) => setInputs(s => ({...s, itPowerKW: Number(e.target.value)}))}
                                            className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                        />
                                    </div>
                                </div>
                            </section>

                            {/* Boundary Conditions */}
                            <section className="glass-panel p-4 rounded-xl">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-4 border-b border-white/10 pb-2">{t.sections.boundary}</h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1 text-red-300">
                                            <span>{t.labels.chipLimit}</span>
                                            <span className="font-mono">{inputs.safetyLimitC.toFixed(0)}°C</span>
                                        </div>
                                        <input type="range" min="60" max="75" step="1" value={inputs.safetyLimitC} onChange={(e) => setInputs(s => ({...s, safetyLimitC: Number(e.target.value)}))} className="w-full h-1.5 bg-slate-700 rounded-lg accent-red-500" />
                                    </div>
                                </div>
                            </section>

                            {/* L3 & L4: Advanced Telemetry (Collapsible) */}
                            <section className="glass-panel rounded-xl overflow-hidden group">
                                <button onClick={() => setShowAdvanced(!showAdvanced)} className="w-full p-3 flex justify-between items-center text-xs font-bold text-slate-400 hover:bg-white/5 transition-colors">
                                    <span>{t.sections.advanced}</span>
                                    <Icon name={showAdvanced ? "ChevronUp" : "ChevronDown"} size={14} />
                                </button>
                                {showAdvanced && (
                                    <div className="p-4 pt-0 space-y-2 bg-black/20">
                                        {/* L3 Metrics */}
                                        <L2Metric label={t.l3.variance} value={state.variance.toFixed(3)} unit="" isMpcActive={mode==='MPC'} />
                                        <L2Metric label={t.l3.effort} value={state.effort.toFixed(2)} unit="°C/s" isMpcActive={mode==='MPC'} />
                                        <div className="h-px bg-white/10 my-2"></div>
                                        {/* L4 Metrics */}
                                        <L2Metric label={t.l4.wue} value={state.wue.toFixed(2)} unit="L/kWh" isMpcActive={mode==='MPC'} />
                                        <div className="text-[9px] text-slate-500 mt-2 italic">
                                            * WUE is scenario-based (Assumption: {PHYSICS_MODEL.WATER_USAGE_INTENSITY} L/kWh)
                                        </div>
                                    </div>
                                )}
                            </section>

                            <button onClick={generateMemo} className="mt-auto glass-panel p-3 rounded-xl flex items-center justify-center gap-2 hover:bg-white/5 transition-colors text-xs font-bold text-slate-300 uppercase tracking-wider">
                                <Icon name="FileText" size={14} /> {t.report.btn}
                            </button>
                        </div>

                        {/* CENTER: L1 VISUALIZATION & CAUSAL CHAIN */}
                        <div className="col-span-6 flex flex-col gap-4">
                            
                            {/* L1 & L2: Causal Loop Visualizer */}
                            <div className="glass-panel p-4 rounded-xl flex flex-col gap-4">
                                {/* Causal Chain Header */}
                                <div className="flex justify-between items-center text-[10px] text-slate-500 font-mono uppercase tracking-widest border-b border-white/5 pb-2">
                                    <span>Control Input</span>
                                    <span>System Response</span>
                                    <span>Objective</span>
                                </div>
                                
                                {/* L1 Primary Metrics */}
                                <div className="grid grid-cols-3 gap-2 items-center">
                                    {/* Control Variable */}
                                    <L1Metric 
                                        label={t.l1.control} 
                                        value={state.supplyTempC.toFixed(1)} 
                                        unit="°C" 
                                        color={mode === 'MPC' ? "text-blue-400" : "text-amber-400"}
                                        isMpcActive={mode === 'MPC'}
                                        traceLabel={showAdvanced ? t.labels.trace.opt : null}
                                    />
                                    
                                    <div className="flex flex-col items-center">
                                        <div className="h-0.5 w-full bg-slate-700 relative top-1/2"></div>
                                        {/* Constraint Variable */}
                                        <L1Metric 
                                            label={t.l1.constraint} 
                                            value={state.chipTempC.toFixed(1)} 
                                            unit="°C" 
                                            color={state.margin < 3 ? "text-red-400 animate-pulse" : "text-slate-200"}
                                            isMpcActive={false} // Constraint is passive response
                                            traceLabel={showAdvanced ? t.labels.trace.load : null}
                                        />
                                    </div>

                                    {/* Objective Variable */}
                                    <L1Metric 
                                        label={t.l1.objective} 
                                        value={state.pue.toFixed(3)} 
                                        unit="" 
                                        color={mode === 'MPC' ? "text-emerald-400" : "text-slate-200"}
                                        isMpcActive={mode === 'MPC'}
                                        traceLabel={showAdvanced ? `Δ = ${state.deltaPue}%` : null}
                                    />
                                </div>

                                {/* L2 Derived Metrics (Subordinate) */}
                                <div className="grid grid-cols-2 gap-4 pt-2 bg-white/5 rounded-lg p-2">
                                    <L2Metric label={t.l2.margin} value={state.margin.toFixed(1)} unit="°C" isMpcActive={false} />
                                    <L2Metric label={t.l2.cue} value={state.cue.toFixed(2)} unit="kg/kWh" isMpcActive={mode === 'MPC'} />
                                </div>
                            </div>

                            {/* Main Chart */}
                            <div className="glass-panel p-4 rounded-xl flex-1 relative flex flex-col min-h-0">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2 flex items-center gap-2">
                                    <Icon name="LineChart" size={14} /> {t.sections.charts}
                                </h3>
                                <div className="flex-1 w-full min-h-0">
                                    <ResponsiveContainer>
                                        <ComposedChart data={state.history}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" opacity={0.3} />
                                            <XAxis dataKey="time" hide />
                                            {/* LEFT AXIS: Constraint (Chip) */}
                                            <YAxis yAxisId="left" domain={[30, 80]} tick={{fontSize: 10, fill: '#94a3b8'}} label={{value: t.chartAxis.chip, angle:-90, position:'insideLeft', fill:'#94a3b8', fontSize:10}} />
                                            {/* RIGHT AXIS: Control (Supply) */}
                                            <YAxis yAxisId="right" orientation="right" domain={[10, 35]} tick={{fontSize: 10, fill: '#3b82f6'}} label={{value: t.chartAxis.supply, angle:90, position:'insideRight', fill:'#3b82f6', fontSize:10}} />
                                            
                                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', fontSize: '12px' }} itemStyle={{padding: 0}} />
                                            <Legend verticalAlign="top" height={36} iconType="plain" wrapperStyle={{fontSize: '10px'}} />

                                            <ReferenceLine yAxisId="left" y={inputs.safetyLimitC} stroke="#ef4444" strokeDasharray="3 3" label={{ value: t.chartAxis.limit, fill: 'red', fontSize: 10 }} />
                                            
                                            <Area yAxisId="left" type="monotone" dataKey="chip" stroke="#94a3b8" fill="url(#colorChip)" strokeWidth={2} name="Chip Temp (Response)" />
                                            <Line yAxisId="right" type="step" dataKey="supply" stroke="#3b82f6" strokeWidth={2} dot={false} name="Supply Temp (Control)" animationDuration={300} />
                                            
                                            <defs>
                                                <linearGradient id="colorChip" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#94a3b8" stopOpacity={0.1}/>
                                                    <stop offset="95%" stopColor="#94a3b8" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT: DIGITAL TWIN (VISUAL CONFIRMATION) */}
                        <div className="col-span-3 glass-panel p-1 rounded-xl relative overflow-hidden flex flex-col">
                             <div className={`scanline ${mode === 'MPC' ? 'opacity-100' : 'opacity-0'}`}></div>
                             <div className="p-3 border-b border-white/5 bg-slate-900/50">
                                <h3 className="text-xs font-bold text-center text-slate-300">{t.twin.title}</h3>
                                <div className="flex justify-between text-[9px] text-slate-500 mt-1 font-mono uppercase">
                                    <span>Model: GB200</span>
                                    <span>{t.twin.active}</span>
                                </div>
                             </div>
                             <div className="flex-1 p-2 flex flex-col gap-px bg-black/40">
                                {Array.from({length: 18}).map((_, i) => {
                                    const zoneHeightFactor = (18 - i) / 18; 
                                    const heatLoad = state.rackPowerKW * 0.98;
                                    const localTemp = state.supplyTempC + (heatLoad * PHYSICS_MODEL.THERMAL_RESISTANCE * 0.8) + (zoneHeightFactor * 5);
                                    const isHot = localTemp > inputs.safetyLimitC - 2;
                                    const color = isHot ? '#7f1d1d' : (localTemp > inputs.safetyLimitC - 10 ? '#713f12' : '#064e3b');
                                    
                                    return (
                                        <div key={i} className="flex-1 flex items-center justify-between px-2 rounded-sm transition-colors duration-500" style={{ backgroundColor: color }}>
                                            <span className="text-[9px] font-mono text-slate-500">U{36 - i*2}</span>
                                            {/* UI uses simple unicode degree */}
                                            <span className={`text-[9px] font-mono ${isHot ? 'text-red-300 font-bold' : 'text-slate-300'}`}>{localTemp.toFixed(1)}°C</span>
                                        </div>
                                    )
                                })}
                             </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
