                    // STRICT ACADEMIC TITLES
                    titles: {

                        baseline: "2. 反事实基线分析 (PID vs. MPC)",
                        trace: "3. 可追溯性、假设与系统常数"
                    },
                    content: {
                        prob_vars: {
                            u: "控制变量：供水温度 ($T_{supply}$)",
                            y: "约束变量：芯片结温 ($T_{chip} \\le 65^\\circ\\mathrm{C}$)",
                            j: "目标函数：最小化能耗 ($PUE$) s.t. $T_{chip}(k) \\le T_{limit}$"

                        prob_summary: "在满足芯片热安全约束（$T_{chip} \\le T_{limit}$）与运行需求（IT负载给定）的前提下，MPC 对供水温度 $T_{supply}$ 进行动态优化。通过将保守的热安全冗余转化为可控的自由度，系统从固定的保守运行模式（PID 基线 $18^\\circ\\mathrm{C}$）转变为能效最优运行模式，从而在相同负载条件下实现可量化的 PUE 降低。",
                        comp_intro: "为了将控制算法的效能与环境变化隔离，我们执行了反事实基线评估。PID 基线代表了应用于与 MPC 实验完全相同的 IT 负载曲线和物理模型的标准工业实践（固定供水温度 18°C）。"
                    }
                },
                langSwitch: "EN" 
            }
        };

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name.toLowerCase());
                    ref.current.appendChild(i);
                    window.lucide.createIcons({ nameAttr: 'data-lucide', attrs: {width: size, height: size, class: className} });
                }
            }, [name, size, className]);
            return <span ref={ref} className="flex items-center justify-center"></span>;
        };

        // --- PHYSICS ENGINE & FEASIBILITY LAYER ---
        // 1. Compute Min Feasible PUE for a given profile
        const computeMinFeasiblePUE = (itKW, profile) => {
            const { PSU_EFFICIENCY, NON_IT_LOAD_KW, BASE_COP, COP_COEFF, MAX_SUPPLY_TEMP } = profile.params;
            
            // Rack power is IT + Conversion Loss + Fans
            const rackKW = (itKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
            const heatLoadKW = rackKW * 0.98; // Assumed heat load

            // Max possible COP at physical limit
            const maxCOP = BASE_COP * (1 + (MAX_SUPPLY_TEMP - 18) * COP_COEFF);
            
            // Minimum cooling power
            const minCoolingKW = heatLoadKW / maxCOP;

            // PUE = Total / IT
            return (rackKW + minCoolingKW) / itKW;
        };

        const calcCoolingCOP = (supplyC, profileParams) => {
            const { BASE_COP, COP_COEFF } = profileParams;
            return BASE_COP * (1 + (supplyC - 18) * COP_COEFF);
        };

        const calcPUE = (itKW, rackKW, supplyC, profileParams) => {
            const cop = calcCoolingCOP(supplyC, profileParams);
            const coolingKW = (rackKW * 0.98) / cop; 
            return (rackKW + coolingKW) / itKW;
        };

        const calcChipTemp = (supplyC, rackKW) => {
            const heatLoadKW = rackKW * 0.98;
            return supplyC + (heatLoadKW * GLOBAL_CONSTANTS.THERMAL_RESISTANCE) + 2.0;
        };

        // --- COMPONENT: L1 METRIC CARD ---
        const L1Metric = ({ label, value, unit, color, isMpcActive, traceLabel, warning }) => (
            <div className={`relative flex flex-col items-center justify-center p-3 rounded-lg border transition-all duration-700 ${isMpcActive && color !== 'text-slate-200' ? 'kpi-glow-mpc border-blue-500/50' : 'border-white/10 bg-slate-800/30'}`}>

                <div className={`text-2xl font-mono font-bold ${color || 'text-white'}`}>
                    {value} <span className="text-xs text-slate-500 font-normal">{unit}</span>

                {/* Warning / Feasibility Indicator */}
                {warning && (

                {traceLabel && (

        // --- COMPONENT: L2 METRIC ROW ---
        const L2Metric = ({ label, value, unit, isMpcActive }) => (

                <span className="font-mono">{value} {unit}</span>

        );

        // --- COMPONENT: QUALITY DASHBOARD METRIC ---
        const QualityMetric = ({ label, value, unit, tooltip }) => (
            <div className="flex justify-between items-center text-xs py-1 group relative">
                <div className="flex items-center gap-1 text-slate-400">

                    {tooltip && (

                                {tooltip}
                            </div>
                        </div>
                    )}
                </div>
                <span className="font-mono text-slate-200">{value} <span className="text-slate-500 text-[10px]">{unit}</span></span>

        // --- COMPONENT: ANIMATED VALIDATION STEP ---
        const ValidationStep = ({ icon, text, delay, visible }) => {
            const [show, setShow] = useState(false);
            
            useEffect(() => {
                let timer;
                if (visible) {
                    timer = setTimeout(() => setShow(true), delay);
                } else {
                    setShow(false);
                }
                return () => clearTimeout(timer);
            }, [visible, delay]);

            return (
                <div className={`flex items-start gap-3 transition-all duration-500 ease-out transform ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'}`}>
                    <div className="mt-0.5 text-emerald-400 shrink-0">
                        <Icon name={icon} size={14} />
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                        {text}
                    </p>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [mode, setMode] = useState('MPC');
            const [showScenario, setShowScenario] = useState(false);
            const [showSummary, setShowSummary] = useState(true);
            const [isQualityExpanded, setIsQualityExpanded] = useState(false); 
            const [activeProfileId, setActiveProfileId] = useState('MODERN');
            
            // --- STATE VECTORS ---
            const [inputs, setInputs] = useState({
                itPowerKW: 85.0,
                safetyLimitC: GLOBAL_CONSTANTS.GLOBAL_LIMIT_TEMP,
                baselineTempC: GLOBAL_CONSTANTS.BASELINE_TEMP
            });

            const [state, setState] = useState({
                supplyTempC: 18.0,
                chipTempC: 45.0,
                rackPowerKW: 95.0,
                pue: 1.45,
                pueMin: 1.22,
                cue: 0.6,
                wue: 1.8,
                margin: 20.0,
                deltaPue: 0.0,
                variance: 0.0,
                slew: 0.0,
                marginUtil: 0.0,
                history: [],
                isFeasibilityLimit: false
            });

            const t = I18N[lang];
            const activeProfile = ARCH_PROFILES[activeProfileId];

            useEffect(() => {
                if (mode === 'MPC') {
                    setShowSummary(true);
                } else {
                    setShowSummary(false);
                }
            }, [mode]);

            // --- MAIN SIMULATION LOOP (1Hz) ---
            useEffect(() => {
                const tick = setInterval(() => {
                    setState(prev => {
                        // FIX: Correctly extract variables from activeProfile.params and GLOBAL_CONSTANTS
                        const { PSU_EFFICIENCY, NON_IT_LOAD_KW, MAX_SUPPLY_TEMP } = activeProfile.params;
                        const { MIN_SUPPLY_TEMP } = GLOBAL_CONSTANTS;
                        
                        // Physics Derivations
                        const rackKW = (inputs.itPowerKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
                        const heatLoadKW = rackKW * 0.98;

                        // Calculate Feasibility Floor (Hard Bound)
                        const minFeasiblePUE = computeMinFeasiblePUE(inputs.itPowerKW, activeProfile);

                        // Baseline Calculation (Counterfactual using active profile params)
                        const baselineSupply = GLOBAL_CONSTANTS.BASELINE_TEMP;
                        const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply, activeProfile.params);

                        let nextSupply = prev.supplyTempC;

                        if (mode === 'PID') {
                            // Fixed PID behavior
                            const err = inputs.baselineTempC - prev.supplyTempC;
                            nextSupply = prev.supplyTempC + (err * 0.2); 
                        } else {
                            // MPC Optimization
                            const SAFE_MARGIN = 2.5; 
                            const maxFeasibleChip = inputs.safetyLimitC - SAFE_MARGIN;
                            const deltaT = (heatLoadKW * GLOBAL_CONSTANTS.THERMAL_RESISTANCE) + 2.0;
                            let optimalSupply = maxFeasibleChip - deltaT;

                            // Clamp Optimization to Profile Constraints
                            // Ensure MAX_SUPPLY_TEMP is used from profile
                            optimalSupply = Math.max(MIN_SUPPLY_TEMP, Math.min(MAX_SUPPLY_TEMP, optimalSupply));

                            // Actuator Dynamics
                            nextSupply = prev.supplyTempC * 0.6 + optimalSupply * 0.4;
                        }

                        const nextChip = calcChipTemp(nextSupply, rackKW);
                        let nextPUE = calcPUE(inputs.itPowerKW, rackKW, nextSupply, activeProfile.params);
                        
                        // Enforce PUE Feasibility Floor in UI
                        let isLimit = false;
                        if (nextPUE < minFeasiblePUE) {
                            nextPUE = minFeasiblePUE;
                            isLimit = true;
                        }
                        const isNearLimit = (nextPUE - minFeasiblePUE) < 0.015;

                        // L2 Metrics
                        const nextCUE = nextPUE * GLOBAL_CONSTANTS.CARBON_INTENSITY;
                        const nextMargin = inputs.safetyLimitC - nextChip;
                        const deltaPuePct = ((baselinePUE - nextPUE) / baselinePUE * 100).toFixed(1);

                        // L3 Metrics
                        const diff = nextSupply - prev.supplyTempC;
                        const nextSlew = Math.abs(diff); 
                        const nextVar = prev.variance * 0.9 + (diff * diff) * 0.1;
                        
                        const marginUtil = (nextChip / inputs.safetyLimitC) * 100;

                        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
                        const newHistory = [...prev.history, {
                            time: now,
                            chip: nextChip,
                            supply: nextSupply,
                            limit: inputs.safetyLimitC,
                            baseline: inputs.baselineTempC
                        }].slice(-60);

                        return {
                            supplyTempC: nextSupply,
                            chipTempC: nextChip,
                            rackPowerKW: rackKW,
                            pue: nextPUE,
                            pueMin: minFeasiblePUE,
                            cue: nextCUE,
                            wue: nextPUE * GLOBAL_CONSTANTS.WATER_USAGE_INTENSITY, 
                            margin: nextMargin,
                            deltaPue: deltaPuePct,
                            variance: Math.sqrt(nextVar),
                            slew: nextSlew,
                            marginUtil: marginUtil,
                            history: newHistory,
                            isFeasibilityLimit: isNearLimit || isLimit
                        };
                    });
                }, 800);
                return () => clearInterval(tick);
            }, [inputs, mode, lang, activeProfile]);

            // --- REPORT GENERATOR ---
            const generateMemo = () => {
                const w = window.open('', '_blank');
                const { PSU_EFFICIENCY, NON_IT_LOAD_KW } = activeProfile.params;
                const rackKW = (inputs.itPowerKW / PSU_EFFICIENCY) + NON_IT_LOAD_KW;
                
                // Explicit Counterfactual
                const baselineSupply = GLOBAL_CONSTANTS.BASELINE_TEMP; 
                const baselinePUE = calcPUE(inputs.itPowerKW, rackKW, baselineSupply, activeProfile.params);
                const baselineChip = calcChipTemp(baselineSupply, rackKW);
                
                const actualSupply = state.supplyTempC;
                const actualPUE = state.pue;
                const actualChip = state.chipTempC;
                const pueSaving = ((baselinePUE - actualPUE) / baselinePUE * 100).toFixed(2);
                
                // KaTeX scripts
                const katexHead = `
                    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"><\/script>
                    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"><\/script>
                `;

                const exportScript = `
                    <script>
                        function renderMath() {
                            if(window.renderMathInElement) {
                                renderMathInElement(document.body, {
                                    delimiters: [
                                        { left: "$$", right: "$$", display: true },
                                        { left: "\\\\(", right: "\\\\)", display: false },
                                        { left: "$", right: "$", display: false }
                                    ],
                                    throwOnError: false
                                });
                            }
                        }
                        async function prepareForExport() {
                            let attempts = 0;
                            while(!window.renderMathInElement && attempts < 50) {
                                await new Promise(r => setTimeout(r, 100));
                                attempts++;
                            }
                            renderMath();
                            if (document.fonts && document.fonts.ready) await document.fonts.ready;
                            await new Promise(r => setTimeout(r, 800));
                            const content = document.body.innerText;
                            if (content.match(/\\\\(circ|mathrm|eta|le|Delta|approx)/)) {
                                alert("Export Halted: Unrendered LaTeX code detected.");
                                throw new Error("Self-check failed");
                            }
                        }
                        window.onload = () => {
                            prepareForExport().then(() => { window.print(); }).catch(e => { console.error(e); });
                        };
                    <\/script>
                `;

                const html = `
                    <!DOCTYPE html>
                    <html lang="${lang}">
                    <head>
                        <title>${t.report.title}</title>
                        ${katexHead}
                        <style>
                            body { font-family: 'Noto Serif SC', serif; padding: 40px; color: #1e293b; max-width: 800px; margin: 0 auto; line-height: 1.5; }
                            h1 { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 5px; font-size: 24px; }
                            .meta { color: #64748b; font-family: monospace; font-size: 0.9em; margin-bottom: 30px; }
                            h2 { margin-top: 30px; font-size: 18px; border-left: 4px solid #3b82f6; padding-left: 10px; background: #f8fafc; }
                            table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9em; }
                            th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
                            th { background: #f1f5f9; }
                            .highlight { font-weight: bold; color: #1e40af; }
                            .mono { font-family: monospace; }
                            .summary-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 4px; margin-bottom: 20px; color: #1e3a8a; font-size: 0.95em; }
                            ul { padding-left: 20px; }
                            li { margin-bottom: 5px; }
                        </style>
                    </head>
                    <body>
                        <h1>${t.report.title}</h1>
                        <div class="meta">
                            DATE: ${new Date().toISOString().split('T')[0]}<br/>
                            SUBJECT: ${t.instance}<br/>
                            ARCH_PROFILE: ${activeProfile.label} (${activeProfile.desc})<br/>
                            ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}
                        </div>

                        <h2>${t.report.titles.prob}</h2>
                        <ul>
                            <li><strong>${t.report.content.prob_vars.u}</strong></li>
                            <li><strong>${t.report.content.prob_vars.y}</strong></li>
                            <li><strong>${t.report.content.prob_vars.j}</strong></li>
                        </ul>
                        <div class="summary-box">
                            ${t.report.content.prob_summary}
                        </div>

                        <h2>${t.report.titles.baseline}</h2>
                        <p>${t.report.content.comp_intro}</p>
                        <p>($P_{IT} = ${inputs.itPowerKW.toFixed(1)}$ kW, $T_{baseline} = ${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$)</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Parameter</th>
                                    <th>PID Baseline (Counterfactual)</th>
                                    <th>MPC (Actual)</th>
                                    <th>Delta</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Setpoint ($T_{supply}$)</td>
                                    <td>$${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td class="highlight">$${actualSupply.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>$${(actualSupply - baselineSupply).toFixed(1)}^\\circ\\mathrm{C}$</td>
                                </tr>
                                <tr>
                                    <td>Chip Temp ($T_{chip}$)</td>
                                    <td>$${baselineChip.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>$${actualChip.toFixed(1)}^\\circ\\mathrm{C}$</td>
                                    <td>Margin Utilized</td>
                                </tr>
                                <tr>
                                    <td><strong>System PUE</strong></td>
                                    <td>${baselinePUE.toFixed(3)}</td>
                                    <td class="highlight">${actualPUE.toFixed(3)}</td>
                                    <td><strong>-${pueSaving}%</strong></td>
                                </tr>
                            </tbody>
                        </table>

                        <h2>${t.report.titles.trace}</h2>
                        <div class="mono" style="background:#f8fafc; padding:10px; border:1px solid #e2e8f0; font-size:0.8em;">
                            # SYSTEM CONSTANTS (PROFILE: ${activeProfile.id})<br/>
                            $\\eta_{PSU} = ${PSU_EFFICIENCY}$<br/>
                            $R_{th} = ${GLOBAL_CONSTANTS.THERMAL_RESISTANCE} \\; \\mathrm{K/kW}$<br/>
                            $P_{facility} = ${NON_IT_LOAD_KW} \\; \\mathrm{kW}$<br/>
                            $PUE_{floor} = ${activeProfile.pueFloor.toFixed(3)}$<br/>
                            <br/>
                            # BOUNDARY CONDITIONS<br/>
                            $T_{limit} = ${inputs.safetyLimitC}^\\circ\\mathrm{C}$<br/>
                            $T_{baseline} = ${baselineSupply.toFixed(1)}^\\circ\\mathrm{C}$<br/>
                            $P_{IT} = ${inputs.itPowerKW} \\; \\mathrm{kW}$
                        </div>

                        ${exportScript}
                    </body>
                    </html>
                `;
                w.document.write(html);
                w.document.close();
            };

            return (
                <div className="flex flex-col h-screen p-4 gap-4">
                    {/* HEADER */}
                    <header className="glass-panel p-4 rounded-xl flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-blue-900/30 rounded-lg text-blue-400">
                                <Icon name="Activity" size={24} />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight text-white">{t.title}</h1>
                                <div className="flex items-center gap-2 text-xs text-slate-400 font-mono">
                                    <span className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700">VER 6.3 (Stable)</span>
                                    <span>{t.instance}</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                <button onClick={() => setMode('PID')} className={`px-4 py-1.5 rounded text-xs font-bold ${mode==='PID' ? 'bg-amber-600 text-white' : 'text-slate-400'}`}>PID</button>
                                <button onClick={() => setMode('MPC')} className={`px-4 py-1.5 rounded text-xs font-bold ${mode==='MPC' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>MPC</button>
                            </div>
                            <button onClick={generateMemo} className="px-3 py-1.5 border border-blue-500/30 bg-blue-500/10 rounded text-xs text-blue-300 font-bold hover:bg-blue-500/20 flex items-center gap-2">
                                <Icon name="FileText" size={14} /> {t.report.btn}
                            </button>
                            <button onClick={() => setLang(l => l==='en'?'zh':'en')} className="px-3 py-1.5 border border-slate-700 rounded text-xs text-slate-400 font-mono hover:text-white">
                                {t.langSwitch}
                            </button>
                        </div>
                    </header>

                    {/* ANIMATED PROFESSOR REQUIREMENT BLOCK */}
                    <div className={`glass-panel p-3 rounded-xl border-l-4 border-blue-500 bg-blue-900/10 shrink-0 transition-all duration-500 ${showSummary ? 'opacity-100 max-h-40' : 'opacity-0 max-h-0 overflow-hidden py-0'}`}>
                        <h4 className="text-xs font-bold text-blue-400 mb-2">{t.profReqTitle}</h4>
                        <div className="space-y-1.5">
                            {t.validationSteps.map((step, idx) => (
                                <ValidationStep 
                                    key={idx} 
                                    icon={step.icon} 
                                    text={typeof step.text === 'function' ? step.text(state.deltaPue) : step.text}
                                    delay={idx * 600}
                                    visible={showSummary}
                                />
                            ))}
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 grid grid-cols-12 gap-4 min-h-0">
                        
                        {/* LEFT: CONTROLS & ARCHITECTURE */}
                        <div className="col-span-3 flex flex-col gap-4 overflow-y-auto">
                            
                            {/* Inputs (Disturbance) */}
                            <section className="glass-panel p-4 rounded-xl">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-4 border-b border-white/10 pb-2">{t.sections.input}</h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1 text-slate-300">
                                            <span>{t.labels.itPower}</span>
                                            <span className="font-mono">{inputs.itPowerKW.toFixed(0)} kW</span>
                                        </div>
                                        <input 
                                            type="range" min="50" max="130" step="1" 
                                            value={inputs.itPowerKW}
                                            onChange={(e) => setInputs(s => ({...s, itPowerKW: Number(e.target.value)}))}
                                            className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                        />
                                    </div>
                                </div>
                            </section>

                            {/* Boundary Conditions & Architecture */}
                            <section className="glass-panel p-4 rounded-xl">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-4 border-b border-white/10 pb-2">{t.sections.boundary}</h3>
                                <div className="space-y-4">
                                    {/* Architecture Selector */}
                                    <div>
                                        <div className="text-xs text-slate-400 mb-2">{t.sections.arch}</div>
                                        <div className="flex flex-col gap-2">
                                            {Object.values(ARCH_PROFILES).map((prof) => (
                                                <button 
                                                    key={prof.id}
                                                    onClick={() => setActiveProfileId(prof.id)}
                                                    className={`text-[10px] text-left px-3 py-2 rounded border transition-all flex justify-between items-center ${
                                                        activeProfileId === prof.id 
                                                        ? 'bg-blue-500/20 border-blue-500/50 text-white' 
                                                        : 'bg-slate-800/50 border-slate-700/50 text-slate-400 hover:border-slate-500'
                                                    }`}
                                                >
                                                    <div>
                                                        <div className="font-bold">{prof.label}</div>
                                                        <div className="opacity-70">{prof.desc}</div>
                                                    </div>
                                                    <div className="text-[9px] font-mono opacity-80 bg-black/30 px-1.5 py-0.5 rounded border border-white/5">
                                                        &gt;{prof.pueFloor}
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="mt-2 text-[10px] flex justify-between items-center text-slate-400 bg-black/20 p-2 rounded border border-white/5">
                                            <span>{t.labels.physLimit}:</span>
                                            <span className="font-mono text-white font-bold">{state.pueMin.toFixed(3)}</span>
                                        </div>
                                        <div className="text-[9px] text-slate-500 mt-2 italic px-1">
                                            {t.labels.feasibility}
                                        </div>
                                    </div>

                                    <div className="border-t border-white/5 pt-4">
                                        <div className="flex justify-between text-xs mb-1 text-red-300">
                                            <span>{t.labels.chipLimit}</span>
                                            <span className="font-mono">{inputs.safetyLimitC.toFixed(0)}°C</span>
                                        </div>
                                        <input type="range" min="60" max="75" step="1" value={inputs.safetyLimitC} onChange={(e) => setInputs(s => ({...s, safetyLimitC: Number(e.target.value)}))} className="w-full h-1.5 bg-slate-700 rounded-lg accent-red-500" />
                                    </div>
                                </div>
                            </section>

                            {/* PID OPERATIONAL DASHBOARD (PID Mode) */}
                            {mode === 'PID' && (
                                <section className="glass-panel rounded-xl p-4 bg-slate-900/30 border border-amber-900/20">
                                    <h3 className="text-xs font-bold text-amber-500/70 uppercase mb-3 border-b border-amber-900/20 pb-2">
                                        {t.sections.pid_dash}
                                    </h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center text-xs">
                                            <span className="text-slate-500">{t.pid_dash.setpoint}</span>
                                            <span className="font-mono text-amber-100">{GLOBAL_CONSTANTS.BASELINE_TEMP.toFixed(1)} °C</span>
                                        </div>
                                        <div className="flex justify-between items-center text-xs">
                                            <span className="text-slate-500">{t.pid_dash.margin}</span>
                                            <span className="font-mono text-slate-300">{state.margin.toFixed(1)} °C</span>
                                        </div>
                                        <div className="flex justify-between items-center text-xs border-t border-white/5 pt-2">
                                            <span className="text-slate-500">{t.pid_dash.baseline}</span>
                                            <span className="font-mono text-slate-300">{calcPUE(inputs.itPowerKW, state.rackPowerKW, GLOBAL_CONSTANTS.BASELINE_TEMP, activeProfile.params).toFixed(3)}</span>
                                        </div>
                                    </div>
                                </section>
                            )}

                            {/* MPC CONTROL QUALITY DASHBOARD (MPC Mode) */}
                            {mode === 'MPC' && (
                                <section className="glass-panel rounded-xl overflow-hidden bg-slate-900/30 border border-blue-900/20">
                                    <button 
                                        onClick={() => setIsQualityExpanded(!isQualityExpanded)} 
                                        className="w-full p-3 flex justify-between items-center text-xs font-bold text-slate-400 hover:text-blue-300 hover:bg-white/5 transition-colors"
                                    >
                                        <span>{t.sections.advanced}</span>
                                        <Icon name={isQualityExpanded ? "ChevronUp" : "ChevronDown"} size={14} />
                                    </button>
                                    
                                    {isQualityExpanded && (
                                        <div className="p-4 pt-0 space-y-2 bg-black/20">
                                            <div className="h-px bg-white/5 my-2"></div>
                                            <div className="mb-3">
                                                <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">{t.quality.stability}</div>
                                                <QualityMetric label={t.labels.variance} value={state.variance.toFixed(3)} unit="" />
                                                <QualityMetric label={t.labels.slew} value={state.slew.toFixed(2)} unit="°C/s" />
                                            </div>
                                            <div className="mb-3">
                                                <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">{t.quality.constraint}</div>
                                                <QualityMetric label={t.labels.utilization} value={state.marginUtil.toFixed(1)} unit="%" tooltip={t.quality.tooltips.margin} />
                                                <div className="w-full h-1 bg-slate-700 rounded-full mt-1 overflow-hidden">
                                                    <div className="h-full bg-blue-500/60 transition-all duration-700" style={{width: `${Math.min(100, Math.max(0, state.marginUtil))}%`}} />
                                                </div>
                                            </div>
                                            <div>
                                                <button onClick={() => setShowScenario(!showScenario)} className="flex items-center gap-1 text-[10px] text-slate-500 font-bold uppercase hover:text-slate-300 transition-colors">
                                                    <Icon name={showScenario ? "ChevronDown" : "ChevronRight"} size={10} />
                                                    {t.quality.scenario}
                                                </button>
                                                {showScenario && (
                                                    <div className="mt-2 pl-2 border-l border-slate-700/50">
                                                        <QualityMetric label={t.labels.wue} value={state.wue.toFixed(2)} unit="L/kWh" />
                                                        <div className="text-[9px] text-slate-600 mt-1 italic leading-tight">{t.quality.disclaimer}</div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </section>
                            )}
                        </div>

                        {/* CENTER: L1 VISUALIZATION & CAUSAL CHAIN */}
                        <div className="col-span-6 flex flex-col gap-4">
                            
                            {/* L1 & L2: Causal Loop Visualizer */}
                            <div className="glass-panel p-4 rounded-xl flex flex-col gap-4">
                                <div className="flex justify-between items-center text-[10px] text-slate-500 font-mono uppercase tracking-widest border-b border-white/5 pb-2">
                                    <span>Control Input</span>
                                    <span>System Response</span>
                                    <span>Objective</span>
                                </div>
                                
                                <div className="grid grid-cols-3 gap-2 items-center">
                                    <L1Metric 
                                        label={t.l1.control} 
                                        value={state.supplyTempC.toFixed(1)} 
                                        unit="°C" 
                                        color={mode === 'MPC' ? "text-blue-400" : "text-amber-400"}
                                        isMpcActive={mode === 'MPC'}
                                        traceLabel={mode === 'MPC' ? t.labels.trace.opt : t.pid_dash.setpoint}
                                    />
                                    
                                    <div className="flex flex-col items-center">
                                        <div className="h-0.5 w-full bg-slate-700 relative top-1/2"></div>
                                        <L1Metric 
                                            label={t.l1.constraint} 
                                            value={state.chipTempC.toFixed(1)} 
                                            unit="°C" 
                                            color={state.margin < 3 ? "text-red-400 animate-pulse" : "text-slate-200"}
                                            isMpcActive={false} 
                                            traceLabel={t.labels.trace.load}
                                        />
                                    </div>

                                    <L1Metric 
                                        label={t.l1.objective} 
                                        value={state.pue.toFixed(3)} 
                                        unit="" 
                                        color={mode === 'MPC' ? "text-emerald-400" : "text-slate-200"}
                                        isMpcActive={mode === 'MPC'}
                                        traceLabel={state.isFeasibilityLimit ? t.labels.trace.limit : (activeProfileId === 'ADVANCED' && mode === 'MPC' ? t.labels.trace.adv : `Δ = ${state.deltaPue}%`)}
                                        warning={state.isFeasibilityLimit ? t.labels.trace.limit : null}
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4 pt-2 bg-white/5 rounded-lg p-2">
                                    <L2Metric label={t.l2.margin} value={state.margin.toFixed(1)} unit="°C" isMpcActive={false} />
                                    <L2Metric label={t.l2.cue} value={state.cue.toFixed(2)} unit="kg/kWh" isMpcActive={mode === 'MPC'} />
                                </div>
                            </div>

                            {/* Main Chart */}
                            <div className="glass-panel p-4 rounded-xl flex-1 relative flex flex-col min-h-0">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2 flex items-center gap-2">
                                    <Icon name="LineChart" size={14} /> {t.sections.charts}
                                </h3>
                                <div className="flex-1 w-full min-h-0">
                                    <ResponsiveContainer>
                                        <ComposedChart data={state.history}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" opacity={0.3} />
                                            <XAxis dataKey="time" hide />
                                            <YAxis yAxisId="left" domain={[30, 80]} tick={{fontSize: 10, fill: '#94a3b8'}} label={{value: t.chartAxis.chip, angle:-90, position:'insideLeft', fill:'#94a3b8', fontSize:10}} />
                                            <YAxis yAxisId="right" orientation="right" domain={[10, 45]} tick={{fontSize: 10, fill: '#3b82f6'}} label={{value: t.chartAxis.supply, angle:90, position:'insideRight', fill:'#3b82f6', fontSize:10}} />
                                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', fontSize: '12px' }} itemStyle={{padding: 0}} />
                                            <Legend verticalAlign="top" height={36} iconType="plain" wrapperStyle={{fontSize: '10px'}} />
                                            <ReferenceLine yAxisId="left" y={inputs.safetyLimitC} stroke="#ef4444" strokeDasharray="3 3" label={{ value: t.chartAxis.limit, fill: 'red', fontSize: 10 }} />
                                            <Area yAxisId="left" type="monotone" dataKey="chip" stroke="#94a3b8" fill="url(#colorChip)" strokeWidth={2} name="Chip Temp (Response)" />
                                            <Line yAxisId="right" type="step" dataKey="supply" stroke="#3b82f6" strokeWidth={2} dot={false} name="Supply Temp (Control)" animationDuration={300} />
                                            <defs>
                                                <linearGradient id="colorChip" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#94a3b8" stopOpacity={0.1}/>
                                                    <stop offset="95%" stopColor="#94a3b8" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT: DIGITAL TWIN (VISUAL CONFIRMATION) */}
                        <div className="col-span-3 glass-panel p-1 rounded-xl relative overflow-hidden flex flex-col">
                             <div className={`scanline ${mode === 'MPC' ? 'opacity-100' : 'opacity-0'}`}></div>
                             <div className="p-3 border-b border-white/5 bg-slate-900/50">
                                <h3 className="text-xs font-bold text-center text-slate-300">{t.twin.title}</h3>
                                <div className="flex justify-between text-[9px] text-slate-500 mt-1 font-mono uppercase">
                                    <span>Model: GB200</span>
                                    <span>{t.twin.active}</span>
                                </div>
                             </div>
                             <div className="flex-1 p-2 flex flex-col gap-px bg-black/40">
                                {Array.from({length: 18}).map((_, i) => {
                                    const zoneHeightFactor = (18 - i) / 18; 
                                    const heatLoad = state.rackPowerKW * 0.98;
                                    const localTemp = state.supplyTempC + (heatLoad * GLOBAL_CONSTANTS.THERMAL_RESISTANCE * 0.8) + (zoneHeightFactor * 5);
                                    const isHot = localTemp > inputs.safetyLimitC - 2;
                                    const color = isHot ? '#7f1d1d' : (localTemp > inputs.safetyLimitC - 10 ? '#713f12' : '#064e3b');
                                    return (
                                        <div key={i} className="flex-1 flex items-center justify-between px-2 rounded-sm transition-colors duration-500" style={{ backgroundColor: color }}>
                                            <span className="text-[9px] font-mono text-slate-500">U{36 - i*2}</span>
                                            <span className={`text-[9px] font-mono ${isHot ? 'text-red-300 font-bold' : 'text-slate-300'}`}>{localTemp.toFixed(1)}°C</span>
                                        </div>
                                    )
                                })}
                             </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
