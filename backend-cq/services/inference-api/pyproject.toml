[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cq-inference-api"
version = "0.1.0"
description = "Chongqing inference HTTP API — receives requests from SG gateway dispatcher"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
