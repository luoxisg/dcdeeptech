    <style>
        body {

            overflow-x: hidden;
        }

        /* Hide scrollbar for horizontal nav but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 380px;
            }
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Checkbox Animation */
        .custom-checkbox input:checked + div {
            background-color: #0D9488;
            border-color: #0D9488;

        .custom-checkbox input:checked + div svg {

        // --- 2. STATE & INIT ---
        
        let currentLang = 'zh';
        let currentStepId = 'customs';
        let chartInstance = null;
        let checkedStates = {}; // Persist checklist state

        document.addEventListener('DOMContentLoaded', () => {
            // Initial Animations
            gsap.to("#hero-section", { opacity: 1, y: 0, duration: 1, ease: "power3.out" });
            gsap.to("#dashboard-content", { opacity: 1, duration: 1, delay: 0.3 });
            
            initApp();
        });

        function initApp() {
            renderNav();
            loadStep(currentStepId);
            updateStaticText();
        }

        // --- 3. CORE LOGIC ---

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            
            // Animate language switch
            gsap.to("body", { opacity: 0.5, duration: 0.2, yoyo: true, repeat: 1, onRepeat: () => {
                initApp();
            }});
        }

        function updateStaticText() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (I18N[currentLang][key]) {
                    el.textContent = I18N[currentLang][key];
                }
            });
        }

        function renderNav() {
            const navContainer = document.getElementById('process-nav');
            navContainer.innerHTML = '';
            
            const stepKeys = Object.keys(STEPS_DATA);
            const navLabels = I18N[currentLang].nav;

            stepKeys.forEach((key, index) => {
                const isActive = key === currentStepId;
                const btn = document.createElement('div');
                
                // Mobile-friendly classes: snap-center for scrolling, min-width for touch targets
                btn.className = `
                    flex-shrink-0 min-w-[140px] md:min-w-0 snap-center
                    cursor-pointer rounded-xl p-3 md:p-4 transition-all duration-300 relative overflow-hidden group
                    ${isActive ? 'bg-white shadow-md ring-2 ring-teal-500 scale-100' : 'bg-slate-100/50 hover:bg-white hover:shadow-sm scale-95 opacity-80'}
                `;
                
                btn.innerHTML = `
                    <div class="flex flex-col items-center justify-center relative z-10">
                        <span class="text-2xl md:text-3xl mb-2 filter drop-shadow-sm transition-transform group-hover:scale-110 duration-300">${STEPS_DATA[key].icon}</span>
                        <span class="text-sm md:text-base font-bold ${isActive ? 'text-teal-800' : 'text-slate-500'}">${navLabels[index]}</span>
                    </div>
                    ${isActive ? '<div class="absolute bottom-0 left-0 w-full h-1 bg-teal-500"></div>' : ''}
                `;

                btn.onclick = () => switchStep(key);
                navContainer.appendChild(btn);
            });
        }

        function switchStep(newStepId) {
            if (currentStepId === newStepId) return;

            // GSAP Transition Out
            gsap.to("#dashboard-content", { 
                opacity: 0, 
                y: 10, 
                duration: 0.2, 
                onComplete: () => {
                    currentStepId = newStepId;
                    renderNav();
                    loadStep(newStepId);
                    
                    // GSAP Transition In
                    gsap.fromTo("#dashboard-content", 
                        { opacity: 0, y: 10 }, 
                        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }
                    );
                }
            });
        }

        function loadStep(stepId) {
            const data = STEPS_DATA[stepId];
            const content = data[currentLang];

            // Update Text
            document.getElementById('section-icon').textContent = data.icon;
            document.getElementById('section-title').textContent = content.title;
            document.getElementById('section-desc').textContent = content.desc;
            document.getElementById('chart-title').textContent = content.chartTitle;

            // Render Metrics with Stagger Animation
            const metricsContainer = document.getElementById('metrics-container');
            metricsContainer.innerHTML = '';
            content.metrics.forEach((m, i) => {
                const div = document.createElement('div');
                div.className = 'metric-card bg-slate-50 p-3 rounded-lg border border-slate-100 text-center';
                div.innerHTML = `
                    <div class="text-xs text-slate-400 uppercase tracking-wide mb-1">${m.label}</div>
                    <div class="text-lg md:text-xl font-bold text-slate-800 metric-value">${m.value}</div>
                `;
                metricsContainer.appendChild(div);
            });
            
            // Animate Metrics Entry
            gsap.from(".metric-card", {
                y: 20, opacity: 0, duration: 0.4, stagger: 0.1, ease: "back.out(1.7)"
            });

            // Update Checklist
            renderChecklist(stepId, content.checklist);

            // Update Tool
            renderTool(content.toolType, content.toolTitle);

            // Update Chart
            renderChart(data.chartType, data.chartData);
        }

        function renderChecklist(stepId, items) {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';
            
            if (!checkedStates[stepId]) checkedStates[stepId] = new Array(items.length).fill(false);

            items.forEach((item, idx) => {
                const isChecked = checkedStates[stepId][idx];
                const li = document.createElement('li');
                li.className = 'flex items-start group p-2 hover:bg-slate-50 rounded-lg transition-colors';
                li.innerHTML = `
                    <label class="custom-checkbox flex items-center cursor-pointer w-full">
                        <input type="checkbox" class="hidden" onchange="toggleCheck('${stepId}', ${idx}, this)" ${isChecked ? 'checked' : ''}>
                        <div class="w-5 h-5 border-2 border-slate-300 rounded-md flex items-center justify-center transition-colors mr-3 flex-shrink-0 bg-white">
                            <svg class="w-3 h-3 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <span class="text-sm text-slate-600 transition-all ${isChecked ? 'line-through text-slate-400' : 'group-hover:text-slate-800'}">${item}</span>
                    </label>
                `;
                container.appendChild(li);
            });

            updateProgress(stepId);
            
            // Stagger list items
            gsap.from("#checklist-container li", {
                x: -20, opacity: 0, duration: 0.3, stagger: 0.05
            });
        }

        function toggleCheck(stepId, idx, checkbox) {
            checkedStates[stepId][idx] = checkbox.checked;
            const span = checkbox.parentNode.querySelector('span');
            
            if (checkbox.checked) {
                span.classList.add('line-through', 'text-slate-400');
                // Celebrate check
                gsap.to(checkbox.nextElementSibling, { scale: 1.2, duration: 0.1, yoyo: true, repeat: 1 });
            } else {
                span.classList.remove('line-through', 'text-slate-400');
            }
            
            updateProgress(stepId);
        }

        function updateProgress(stepId) {
            const total = checkedStates[stepId].length;
            const checked = checkedStates[stepId].filter(Boolean).length;
            const pct = Math.round((checked / total) * 100);
            
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('progress-badge').textContent = `${pct}%`;
            
            if (pct === 100) {
                gsap.to("#progress-badge", { backgroundColor: "#0D9488", color: "#fff", duration: 0.3 });
            }
        }

        // --- 4. TOOL LOGIC & CHART ---

        function renderTool(type, title) {
            const toolTitle = document.getElementById('tool-title');
            const toolContent = document.getElementById('tool-content');
            const resultBox = document.getElementById('tool-result');
            
            toolTitle.textContent = title;
            resultBox.classList.add('hidden');

            const btnText = I18N[currentLang].calc_btn;
            const checkText = I18N[currentLang].check_btn;

            let html = '';
            
            if (type === 'customs') {
                html = `
                    <div class="space-y-3">
                        <input type="number" id="t-input" class="w-full p-3 text-sm bg-white/50 border border-teal-200 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Value (SGD)">
                        <select class="w-full p-3 text-sm bg-white/50 border border-teal-200 rounded-lg outline-none">
                            <option>Standard Food (0% Duty)</option>
                            <option>Alcohol (High Duty)</option>
                        </select>
                        <button onclick="runTool('${type}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-teal-200 transform active:scale-95 transition-all">${btnText}</button>
                    </div>
                `;
            } else if (type === 'storage') {
                html = `
                    <div class="space-y-3">
                        <div class="flex justify-between text-xs text-slate-500"><span>Duration</span><span id="range-val">30 Days</span></div>
                        <input type="range" class="w-full h-2 bg-teal-200 rounded-lg appearance-none cursor-pointer" oninput="document.getElementById('range-val').innerText = this.value + ' Days'" value="30">
                        <input type="number" id="t-input" class="w-full p-3 text-sm bg-white/50 border border-teal-200 rounded-lg outline-none" placeholder="Pallets (e.g. 10)">
                        <button onclick="runTool('${type}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-teal-200 transform active:scale-95 transition-all">${btnText}</button>
                    </div>
                `;
            } else {
                 html = `
                    <div class="space-y-3">
                        <input type="text" id="t-input" class="w-full p-3 text-sm bg-white/50 border border-teal-200 rounded-lg outline-none" placeholder="Query...">
                        <button onclick="runTool('generic')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-teal-200 transform active:scale-95 transition-all">${checkText}</button>
                    </div>
                `;
            }

            toolContent.innerHTML = html;
        }

        function runTool(type) {
            const input = document.getElementById('t-input').value;
            const resBox = document.getElementById('tool-result');
            const resVal = document.getElementById('tool-result-value');
            
            if (!input) {
                // Shake animation for error
                gsap.to("#tool-content", { x: 5, duration: 0.1, yoyo: true, repeat: 3 });
                return;
            }

            let result = "";
            if (type === 'customs') {
                const val = parseFloat(input);
                result = `$${(val * 0.09).toFixed(2)} (GST)`;
            } else if (type === 'storage') {
                const val = parseFloat(input);
                result = `$${(val * 30 * 1.5).toFixed(0)} SGD`;
            } else {
                result = currentLang === 'zh' ? "合规 (Pass)" : "Compliant";
            }

            resVal.textContent = result;
            resBox.classList.remove('hidden');
            
            // Pop in result
            gsap.fromTo(resBox, { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" });
        }

        function renderChart(type, data) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: type,
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
                    },
                    scales: type === 'radar' || type === 'doughnut' ? {} : {
                        y: { beginAtZero: true, grid: { borderDash: [4, 4] } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function resetIntro() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

    </script>
</body>
</html>
