<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海事级集装箱边缘计算中心仿真 (工程灰白版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 背景改为工程灰白 */
        body { margin: 0; overflow: hidden; background-color: #f1f5f9; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 玻璃拟态 UI 面板 - 工程白风格 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* 加载指示器 - 深色 */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0891b2; /* Cyan-600 */
            font-family: monospace;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* 扫描线动画 - 蓝色 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #0891b2, transparent);
            opacity: 0.3;
            animation: scan 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* 鼠标提示 - 深灰 */
        .tooltip-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #64748b;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
            font-weight: bold;
        }
    </style>

    <!-- 配置 Import Map 以使用 ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- 加载提示 -->
    <div id="loader" class="flex flex-col items-center gap-2">
        <svg class="animate-spin h-8 w-8 text-cyan-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="font-bold">INITIALIZING ENGINEERING MODEL...</span>
    </div>

    <!-- 3D 容器 -->
    <div id="canvas-container"></div>
    
    <!-- 扫描线特效 -->
    <div class="scan-line"></div>
    <div class="tooltip-hint">R-CLICK CONTAINER TO TOGGLE SHELL • L-CLICK TO ROTATE</div>

    <!-- UI: 顶部标题 -->
    <div class="absolute top-4 left-4 z-20 glass-panel rounded-r-lg border-l-4 border-cyan-600 p-4 transition-opacity duration-500" id="ui-header">
        <div class="flex items-center gap-3 mb-2">
            <div class="bg-slate-100 p-2 rounded border border-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="22" x2="12" y2="8"></line><path d="M5 12H2a10 10 0 0 0 20 0h-3"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tighter text-slate-800 uppercase leading-none">
                    ERIS EDGE <span class="text-cyan-600">CONTAINER</span>
                </h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1 font-bold">Port Grade / ISO 20ft / Engineering View</p>
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mt-3 border-t border-slate-300 pt-3">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-sm"></div>
                <span class="text-xs font-mono text-slate-600 font-bold">STATUS: ONLINE</span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="text-cyan-600" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                <span class="text-xs font-mono text-slate-600 font-bold">CFD: ACTIVE</span>
            </div>
        </div>
    </div>

    <!-- UI: 悬浮数据 -->
    <div class="absolute bottom-8 left-8 z-20 space-y-3 font-mono">
        <div class="glass-panel p-2 pl-3 rounded-r border-l-2 border-blue-600 flex items-center gap-4 min-w-[180px] hover:translate-x-1 transition-transform">
            <div class="text-slate-500 text-xs uppercase font-bold flex items-center gap-2">
                <span class="text-blue-600 font-black">IN</span> Inlet Air
            </div>
            <div class="text-lg font-bold text-blue-700 tabular-nums" id="val-inlet">22.4<span class="text-xs text-slate-500 ml-1">°C</span></div>
        </div>
        
        <div class="glass-panel p-2 pl-3 rounded-r border-l-2 border-red-500 flex items-center gap-4 min-w-[180px] hover:translate-x-1 transition-transform">
            <div class="text-slate-500 text-xs uppercase font-bold flex items-center gap-2">
                <span class="text-red-600 font-black">OUT</span> Outlet Air
            </div>
            <div class="text-lg font-bold text-red-600 tabular-nums" id="val-outlet">36.1<span class="text-xs text-slate-500 ml-1">°C</span></div>
        </div>
    </div>

    <!-- UI: 控制按钮 -->
    <div class="absolute top-4 right-4 z-20 flex flex-col gap-2">
        <button id="btn-reset" class="glass-panel p-2 rounded text-slate-500 hover:text-cyan-600 hover:bg-slate-50 transition-colors" title="Reset Camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
        <button id="btn-rotate" class="glass-panel p-2 rounded text-slate-500 hover:text-cyan-600 hover:bg-slate-50 transition-colors" title="Toggle Rotation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
        </button>
        <button id="btn-shell" class="glass-panel p-2 rounded text-slate-500 hover:text-cyan-600 hover:bg-slate-50 transition-colors" title="Toggle Shell (Right Click)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
        </button>
    </div>

    <!-- 核心逻辑 (Module) -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化 ---
        const container = document.getElementById('canvas-container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        const scene = new THREE.Scene();
        // 更改为工程灰白背景 (Slate 100)
        scene.background = new THREE.Color(0xf1f5f9); 
        // 更改为浅色雾
        scene.fog = new THREE.FogExp2(0xf1f5f9, 0.02);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(6, 4, 8); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- 灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const redLight = new THREE.PointLight(0xff4444, 1.0, 8);
        redLight.position.set(-2, 1, 0);
        scene.add(redLight);
        
        const bottomLight = new THREE.DirectionalLight(0xe2e8f0, 0.8);
        bottomLight.position.set(0, -5, 0);
        scene.add(bottomLight);

        // --- 辅助网格 ---
        const gridHelper = new THREE.GridHelper(30, 30, 0x94a3b8, 0xcbd5e1);
        scene.add(gridHelper);

        // --- 程序化纹理生成 ---
        function createCorrugatedTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#334155'; 
            ctx.fillRect(0, 0, 512, 512);

            const gradient = ctx.createLinearGradient(0, 0, 512, 0);
            for (let i = 0; i <= 20; i++) {
                const stop1 = i / 20;
                const stop2 = Math.min(1.0, (i + 0.5) / 20);
                gradient.addColorStop(stop1, '#94a3b8'); 
                gradient.addColorStop(stop2, '#1e293b'); 
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        const bumpMap = createCorrugatedTexture();

        // --- 3D 模型构建 ---
        const containerGroup = new THREE.Group();
        scene.add(containerGroup);

        // 1. 集装箱外壳
        const boxGeo = new THREE.BoxGeometry(4.5, 2.4, 2.2);
        const boxMat = new THREE.MeshStandardMaterial({
            color: 0x334155, 
            metalness: 0.6,
            roughness: 0.3, 
            bumpMap: bumpMap,
            bumpScale: 0.08, 
            transparent: true,
            opacity: 0.95,
            side: THREE.DoubleSide
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.y = 1.2;
        box.castShadow = true;
        box.receiveShadow = true;
        box.name = "ContainerShell";
        containerGroup.add(box);

        // 2. 机柜 (Rack)
        const rackGeo = new THREE.BoxGeometry(0.6, 1.8, 0.8);
        const rackMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e293b, 
            emissive: 0x0f172a,
            roughness: 0.4,
            metalness: 0.7 
        });
        
        const racks = [];
        for(let i=0; i<4; i++) {
            const rack = new THREE.Mesh(rackGeo, rackMat.clone());
            rack.position.set(-1.5 + i * 1.0, 1.1, 0);
            containerGroup.add(rack);
            racks.push(rack);

            // LED 灯点
            const ledGeo = new THREE.PlaneGeometry(0.4, 0.05);
            const ledMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 }); // Cyan
            for(let j=0; j<6; j++) {
                const led = new THREE.Mesh(ledGeo, ledMat.clone());
                led.position.set(0, 0.6 - j * 0.25, 0.41);
                rack.add(led);
                led.userData = { 
                    blinkSpeed: Math.random() * 0.1, 
                    offset: Math.random() * 100 
                };
            }
        }

        // 3. HVAC (冷却机组)
        const hvacGroup = new THREE.Group();
        const hvacGeo = new THREE.BoxGeometry(0.8, 1.6, 1.4);
        const hvacMat = new THREE.MeshStandardMaterial({ 
            color: 0x64748b, // Slate-500
            metalness: 0.5,
            roughness: 0.5
        });
        const hvac = new THREE.Mesh(hvacGeo, hvacMat);
        hvacGroup.add(hvac);
        hvacGroup.position.set(2.8, 1.0, 0);
        containerGroup.add(hvacGroup);

        // 风扇系统优化 (Horizontal Embed Adjustment)
        // A. 顶部风扇孔洞 (嵌入感)
        const fanHoleGeo = new THREE.CircleGeometry(0.38, 32);
        const fanHoleMat = new THREE.MeshBasicMaterial({ color: 0x1e293b }); // 深色模拟内部
        const fanHole = new THREE.Mesh(fanHoleGeo, fanHoleMat);
        fanHole.rotation.x = -Math.PI / 2; // 水平放置
        fanHole.position.set(0, 0.801, 0); // 略高于HVAC顶部表面
        hvac.add(fanHole);

        // B. 风扇叶片
        const fanGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.02, 16);
        const fanMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, wireframe: true });
        const fan = new THREE.Mesh(fanGeo, fanMat);
        // 保持水平 (Cylinder默认Y轴朝上，无需旋转X/Z)
        fan.position.set(0, 0.82, 0); // 位于孔洞上方
        hvac.add(fan);

        // --- CFD 粒子系统 (加大颗粒度) ---
        const particleCount = 1200;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pColor = new Float32Array(particleCount * 3);
        const pData = []; 

        for(let i=0; i<particleCount; i++) {
            pPos[i*3] = -3 + Math.random() * 1.5; 
            pPos[i*3+1] = 0.2 + Math.random() * 2.0; 
            pPos[i*3+2] = -1 + Math.random() * 2.0; 
            
            pData.push({
                speed: 0.03 + Math.random() * 0.04,
                yBase: pPos[i*3+1]
            });

            // 初始颜色
            pColor[i*3] = 0; pColor[i*3+1] = 0; pColor[i*3+2] = 1;
        }
        
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3));

        const pMat = new THREE.PointsMaterial({
            size: 0.15, // 加大颗粒度 (原0.06)
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.NormalBlending, 
            depthWrite: false
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // --- 交互逻辑 ---
        function toggleShellVisibility() {
            if (box.material.opacity > 0.1) {
                box.material.opacity = 0.05;
                box.material.transparent = true;
                box.material.roughness = 1.0; 
            } else {
                box.material.opacity = 0.95;
                box.material.roughness = 0.3;
            }
        }

        window.addEventListener('contextmenu', (event) => {
            event.preventDefault(); 
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(box);
            if (intersects.length > 0) {
                toggleShellVisibility();
            }
        });

        document.getElementById('btn-shell').addEventListener('click', toggleShellVisibility);

        // --- 动画循环 ---
        let autoRotate = true;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 风扇旋转 (绕Y轴旋转，即水平旋转)
            fan.rotation.y -= 0.25;

            if (autoRotate) {
                containerGroup.rotation.y = Math.sin(time * 0.1) * 0.15;
            }

            // LED 闪烁
            racks.forEach(rack => {
                rack.children.forEach(led => {
                    const blink = Math.sin(time * 8 + led.userData.offset) > 0.2;
                    led.material.color.setHex(blink ? 0x06b6d4 : 0x155e75);
                });
            });

            // 粒子更新
            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;

            for(let i=0; i<particleCount; i++) {
                let x = positions[i*3];
                let y = positions[i*3+1];
                let z = positions[i*3+2];
                const data = pData[i];

                x += data.speed;

                if (x > -2 && x < 2) {
                    y = data.yBase + Math.sin(x * 3 + time * 3) * 0.15; 
                }

                if (x > 3.5 || y < 0 || y > 2.5) {
                    x = -3 + Math.random();
                    y = 0.2 + Math.random() * 2.0;
                    z = -1 + Math.random() * 2.0;
                    data.yBase = y;
                }

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                // 颜色变化
                const t = Math.max(0, Math.min(1, (x + 2.5) / 5.5));
                
                if (t < 0.5) {
                    const localT = t * 2;
                    colors[i*3] = 0; 
                    colors[i*3+1] = localT * 0.8;
                    colors[i*3+2] = 0.8; 
                } else {
                    const localT = (t - 0.5) * 2;
                    colors[i*3] = 0.8 * localT; 
                    colors[i*3+1] = 0.8 * (1 - localT); 
                    colors[i*3+2] = 0.8 * (1 - localT); 
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        document.getElementById('loader').style.opacity = 0; 

        // --- 事件监听 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            controls.reset();
            camera.position.set(6, 4, 8);
        });
        
        document.getElementById('btn-rotate').addEventListener('click', () => {
            autoRotate = !autoRotate;
        });

        // 模拟数据更新
        setInterval(() => {
            const inlet = (22 + Math.random()).toFixed(1);
            const outlet = (34 + Math.random() * 3).toFixed(1);
            document.getElementById('val-inlet').innerText = inlet + "°C";
            document.getElementById('val-outlet').innerText = outlet + "°C";
        }, 2000);

    </script>
</body>
</html>
