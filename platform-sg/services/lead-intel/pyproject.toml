[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-intel"
version = "0.1.0"
description = "DCDeepTech B2B lead discovery and qualification service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
