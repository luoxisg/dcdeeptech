[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-compliance"
version = "0.1.0"
description = "DCDeepTech Singapore PDPA compliance service — DSAR, consent, breach, retention"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic[email]==2.7.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
