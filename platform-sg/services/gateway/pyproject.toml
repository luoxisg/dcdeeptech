[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-gateway"
version = "0.1.0"
description = "DCDeepTech Singapore control-plane gateway — auth, PII, policy, routing, audit"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "httpx==0.27.0",
    "pydantic==2.7.4",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "auth", "keys", "policy", "routing", "security", "audit", "adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
