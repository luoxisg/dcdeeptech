version: "3.9"

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env.local
    volumes:
      - gateway-data:/app/data
      - gateway-audit:/app/audit_logs
    restart: unless-stopped

volumes:
  gateway-data:
  gateway-audit:
