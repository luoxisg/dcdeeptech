# Data retention policy
# Applies to all data generated by the DCDeepTech gateway.
# Review with legal/DPA counsel before production deployment.

retention:

  audit_metadata:
    ttl_days: 90
    storage_path: "audit_logs/"
    format: "jsonl"
    notes: >
      Audit records contain only metadata (request_id, tenant_id, key_id,
      prompt_hash, data_class, destination, timestamps).
      Raw prompts, API keys, and PII matches are NEVER stored here.
    review_reminder: "Renew legal approval for >90 day retention if needed"

  inference_cache_cq:
    ttl_seconds: 259200    # 72 hours
    region: cq
    auto_purge: true
    notes: >
      CQ vLLM may cache KV attention blocks in GPU memory during a session.
      All in-memory state must be cleared within 72 hours.
      No disk persistence of prompts or completions on CQ nodes.

  incident_logs:
    ttl_days: 365
    storage_path: "incident_logs/"
    notes: >
      Policy denials, auth failures, upstream errors.
      Contains no PII beyond what appears in audit_metadata.

  api_key_records:
    active_ttl_days: null    # Keys live until explicitly revoked
    post_revocation_days: 30 # Keep revoked key metadata for audit trail
    notes: >
      The key hash and salt are kept for audit trail even after revocation.
      They cannot be used to reconstruct the plaintext key.

  temp_request_context:
    ttl_seconds: 0    # In-memory only, discarded after response
    notes: >
      Redacted messages and PII findings exist only in process memory
      for the duration of a single request. Never persisted to disk.
