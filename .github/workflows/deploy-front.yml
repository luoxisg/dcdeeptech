name: Deploy — front

on:
  push:
    branches: [main]
    paths:
      - "front/**"
      - "shared/**"

jobs:
  deploy-marketing:
    name: Deploy marketing to Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing
        run: pnpm turbo run build --filter="@front/app-marketing"
        env:
          # Add Next.js public env vars here
          NEXT_PUBLIC_SITE_URL: ${{ vars.MARKETING_SITE_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}
          working-directory: front/apps/marketing

  deploy-portal:
    name: Deploy portal to Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm turbo run build --filter="@front/app-portal"
        env:
          NEXT_PUBLIC_GATEWAY_API_URL: ${{ secrets.SG_GATEWAY_PUBLIC_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
          working-directory: front/apps/portal
