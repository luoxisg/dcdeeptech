version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leadintel
      POSTGRES_USER: leadintel
      POSTGRES_PASSWORD: leadintel
    ports:
      - "5432:5432"
    volumes:
      - leadintel-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - leadintel-redis:/data

volumes:
  leadintel-postgres:
  leadintel-redis:
