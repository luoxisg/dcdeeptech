[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-intel-api"
version = "0.1.0"
description = "China Outbound Enterprise Lead Intelligence Platform API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.0",
  "fastapi==0.116.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.13",
  "pydantic==2.11.7",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.17",
  "redis==5.2.0",
  "rq==1.16.2",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.32.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.3"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
