    <style>
        /* ============================================================
           Design System Tokens
        ============================================================ */
        :root {
            --sidebar-w: 256px;
            --header-h: 64px;
            --radius-panel: 10px;
            --color-accent-1: #0ea5e9;  /* sky-500 — Layer 1 */
            --color-accent-2: #3b82f6;  /* blue-500 — Layer 2 */
            --color-accent-3: #10b981;  /* emerald-500 — Layer 3 */
            --color-sidebar-bg: #0f172a;
            --color-sidebar-border: #1e293b;
            --color-sidebar-text: #94a3b8;
            --color-sidebar-active-bg: rgba(14,165,233,0.12);
            --color-sidebar-active-text: #38bdf8;
        }

        /* ============================================================
           Base & Typography
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           Scrollbars
        ============================================================ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ============================================================
           Layout Shell
        ============================================================ */
        .platform-sidebar {
            width: var(--sidebar-w);
            background: var(--color-sidebar-bg);
            border-right: 1px solid var(--color-sidebar-border);
        }
        .platform-main {
            margin-left: var(--sidebar-w);
        }
        @media (max-width: 767px) {
            .platform-main { margin-left: 0; }
        }

        /* ============================================================
           Sidebar Nav Items
        ============================================================ */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--color-sidebar-text);
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            outline: none;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
        }
        .nav-item:focus-visible {
            outline: 2px solid var(--color-accent-1);
            outline-offset: 2px;
        }
        .nav-item.active {
            background: var(--color-sidebar-active-bg);
            color: var(--color-sidebar-active-text);
            border: 1px solid rgba(14,165,233,0.2);
        }
        .nav-item .nav-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .nav-layer-badge {
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(148,163,184,0.15);
            color: #64748b;
            margin-left: auto;
            flex-shrink: 0;
        }
        .nav-item.active .nav-layer-badge {
            background: rgba(14,165,233,0.15);
            color: #38bdf8;
        }
        .nav-section-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #475569;
            padding: 0 14px;
            margin-bottom: 4px;
        }

        /* ============================================================
           Section Headers (SectionHeader component)
        ============================================================ */
        .section-eyebrow {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }
        .section-title {
            font-size: 1.625rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }
        .section-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.6;
            margin-top: 4px;
        }

        /* ============================================================
           Panel Shell (PanelShell component)
        ============================================================ */
        .panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-panel);
        }
        .panel-dark {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: var(--radius-panel);
        }
        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header-dark {
            padding: 14px 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .panel-label-dark {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .panel-body { padding: 20px; }

        /* ============================================================
           Metric Cards (MetricCard component)
        ============================================================ */
        .metric-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px 20px;
        }
        .metric-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }
        .metric-value {
            font-size: 1.625rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .metric-trend {
            font-size: 0.75rem;
            color: #10b981;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ============================================================
           Info / Reference Cards (InfoCard, ExternalReferenceCard)
        ============================================================ */
        .info-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-panel);
            padding: 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .info-card:hover {
            border-color: #bae6fd;
            box-shadow: 0 4px 16px rgba(14,165,233,0.07);
        }
        .info-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .info-card h4 {
            font-size: 0.9375rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .info-card .card-meta {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .info-card p {
            font-size: 0.8125rem;
            color: #64748b;
            line-height: 1.65;
            flex: 1;
        }

        /* ============================================================
           Layer Overview Cards (overview grid)
        ============================================================ */
        .layer-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-panel);
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }
        .layer-card:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .layer-card:focus-visible {
            outline: 2px solid var(--color-accent-1);
            outline-offset: 2px;
        }
        .layer-card-body {
            position: relative;
            z-index: 10;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .layer-card-number {
            font-size: 0.625rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .layer-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.35;
        }
        .layer-card p {
            font-size: 0.8125rem;
            color: #64748b;
            line-height: 1.6;
            flex: 1;
        }
        .layer-card-arrow {
            margin-top: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .layer-card:hover .layer-card-arrow { opacity: 1; }
        .layer-card-bg {
            position: absolute;
            inset: 0;
        }
        .layer-card-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.18;
            transition: opacity 0.3s, transform 0.5s;
        }
        .layer-card:hover .layer-card-bg img {
            opacity: 0.28;
            transform: scale(1.04);
        }
        .layer-card-bg-overlay {
            position: absolute;
            inset: 0;
        }

        /* ============================================================
           CTA Banner
        ============================================================ */
        .cta-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-panel);
            padding: 20px 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .cta-banner:hover {
            border-color: #bae6fd;
            box-shadow: 0 4px 16px rgba(14,165,233,0.07);
        }
        .cta-banner .cta-inner { display: flex; align-items: center; gap: 16px; }
        .cta-banner .cta-icon {
            width: 44px; height: 44px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 1.375rem;
        }
        .cta-banner .cta-text h3 {
            font-size: 0.9375rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .cta-banner .cta-text p {
            font-size: 0.8125rem;
            color: #64748b;
        }
        .cta-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 7px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #334155;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
        }
        .cta-link-btn:hover {
            background: #f0f9ff;
            border-color: #7dd3fc;
            color: #0369a1;
        }

        /* ============================================================
           Contact Block
        ============================================================ */
        .contact-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .contact-row:last-child { border-bottom: none; }
        .contact-icon-wrap {
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 1rem;
        }
        .contact-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        .contact-value {
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
        }
        .contact-value a {
            color: #1e293b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .contact-value a:hover { color: #0ea5e9; }

        /* ============================================================
           Progress Bars
        ============================================================ */
        .progress-track {
            width: 100%; height: 5px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; border-radius: 3px; }

        /* ============================================================
           Code Panel
        ============================================================ */
        .code-panel { background: #0f172a; border-radius: var(--radius-panel); overflow: hidden; }
        .code-titlebar {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .code-dots { display: flex; gap: 6px; }
        .code-dot { width: 10px; height: 10px; border-radius: 50%; }
        .code-body { padding: 20px; overflow-x: auto; }
        .code-body pre { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.8125rem; line-height: 1.7; color: #cbd5e1; }

        /* ============================================================
           Arch Diagram Nodes
        ============================================================ */
        .arch-node {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .arch-node:hover { border-color: #94a3b8; }
        .arch-node-icon { font-size: 1.625rem; margin-bottom: 6px; }
        .arch-node-label { font-size: 0.75rem; font-weight: 700; color: #1e293b; line-height: 1.3; }
        .arch-node-sub { font-size: 0.65rem; margin-top: 3px; }
        .arch-arrow { color: #94a3b8; font-size: 1rem; flex-shrink: 0; }

        /* ============================================================
           Billing Card
        ============================================================ */
        .billing-model-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .billing-model-row:last-child { border-bottom: none; }
        .billing-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .billing-name { font-size: 0.8125rem; font-weight: 600; color: #1e293b; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .billing-cost { font-size: 0.8125rem; font-weight: 700; color: #0f172a; flex-shrink: 0; }
        .billing-tokens { font-size: 0.7rem; color: #94a3b8; }

        /* ============================================================
           About Page Typography
        ============================================================ */
        .about-body p {
            font-size: 1rem;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 1.25rem;
        }
        .about-body p:last-child { margin-bottom: 0; }

        /* ============================================================
           Animations
        ============================================================ */
        @keyframes flowDash { to { stroke-dashoffset: -40; } }
        @keyframes dash-flow { to { stroke-dashoffset: -20; } }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(500%); opacity: 0; }
        }
        @keyframes pulse-ring {
            0%   { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(34,211,238,0.7); }
            70%  { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(34,211,238,0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(34,211,238,0); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

        .animate-flow     { animation: flowDash 1s linear infinite; }
        .animate-float    { animation: float 6s ease-in-out infinite; }
        .animate-dash-flow { stroke-dasharray: 10; animation: dash-flow 1s linear infinite; }
        .animate-scanline { animation: scanline 4s linear infinite; }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4,0,0.6,1) infinite; }
        .view-fade-in  { animation: fadeIn 0.4s ease both; }
        .view-slide-in { animation: slideInRight 0.35s ease both; }

        .isometric-container { transform: rotateX(60deg) rotateZ(-45deg); transform-style: preserve-3d; }
        .server-blade { transform-style: preserve-3d; transition: all 0.3s ease; }
        .server-blade:hover { transform: translateZ(10px); box-shadow: 0 0 20px rgba(6,182,212,0.5); }

        /* ============================================================
           Mobile overrides
        ============================================================ */
        @media (max-width: 767px) {
            .section-title { font-size: 1.375rem; }
            .metric-value { font-size: 1.375rem; }
            .cta-banner { flex-direction: column; align-items: flex-start; }
            /* Layer grids — stack on mobile */
            .layer-two-col { grid-template-columns: 1fr !important; }
        }
    </style>

    <!-- Track contact / partner clicks -->
    <script>
      document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (!link) return;
        const href = link.getAttribute('href') || '';
        if (typeof gtag !== 'function') return;

                        const newArr = [...prev.slice(1)];
                        const noise = Math.random() * 20 - 10;
                        const spike = Math.random() > 0.9 ? 40 : 0;
                        let nextVal = newArr[newArr.length - 1] + noise + spike;
                        nextVal = Math.max(10, Math.min(90, nextVal));
                        newArr.push(nextVal);
                        return newArr;
                    });
                }, 100);
                return () => clearInterval(interval);
